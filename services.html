<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud Services</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { height: 100%; margin: 0; padding: 0; background: #020b14; color: #fff; font-family: system-ui, sans-serif; }
    
    .wrap { width: 100%; max-width: 500px; margin: 0 auto; padding: 12px; }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 15px; background: rgba(6, 22, 42, 0.95);
      position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .wallet-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(33, 160, 240, 0.15); padding: 4px 4px 4px 12px;
      border-radius: 20px; border: 1px solid rgba(33, 160, 240, 0.3);
    }
    .balance-text { font-weight: 800; font-size: 13px; color: #21a0f0; }
    .add-btn { width: 26px; height: 26px; background: #21a0f0; border-radius: 50%; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .menu-trigger { font-size: 20px; cursor: pointer; padding: 5px; }

    /* Banner */
    .slider-box { width: 100%; height: 140px; border-radius: 12px; overflow: hidden; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); }
    .slides { display: flex; width: 300%; height: 100%; transition: 0.6s; }
    .slides img { width: 33.333%; height: 100%; object-fit: cover; }

    /* Search */
    .search-box { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 0 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
    .search-box input { width: 100%; background: none; border: none; color: #fff; height: 40px; font-size: 14px; }

    /* Grid - تظبيط الصور لتبين كبيرة وواضحة */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .neon-tile {
      background: #06101d; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
      text-decoration: none; display: flex; flex-direction: column;
      height: 160px; /* طول مناسب للمربع */
      transition: 0.2s;
    }
    .neon-tile:active { transform: scale(0.96); }
    
    .tile-img-container {
      width: 100%; height: 120px; /* مساحة أكبر للصورة */
      overflow: hidden;
    }
    .neon-tile img { 
      width: 100%; height: 100%; 
      object-fit: cover; /* هيدي بتخلي الصورة تعبي المربع وتطلع كبيرة */
    }
    
    .tile-label {
      background: rgba(0,0,0,0.4); padding: 8px;
      text-align: center; font-size: 12px; font-weight: 700; color: #fff;
    }

    /* Overlay & Drawer */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2000; }
    .drawer { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #06101d; z-index: 2100; transform: translateX(-100%); transition: 0.3s; padding: 20px; }
    .drawer.active { transform: translateX(0); }
    .m-item { display: block; padding: 12px; color: #ccc; text-decoration: none; font-weight: 600; }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div style="text-align: center; margin-bottom: 20px;">
        <div style="width: 50px; height: 50px; background: #21a0f0; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;">👤</div>
        <div id="userEmail" style="font-size: 12px; opacity: 0.6;">Loading...</div>
    </div>
    <a href="index.html" class="m-item">🏠 Dashboard</a>
    <a href="my-orders.html" class="m-item">📦 My Orders</a>
    <a href="add-credit.html" class="m-item">💰 Add Credit</a>
    <button onclick="sb.auth.signOut().then(()=>location.reload())" style="background:none; border:none; color:red; padding:12px; font:inherit; cursor:pointer;">🚪 Logout</button>
  </aside>

  <header class="topbar">
    <div class="menu-trigger" id="menuBtn">☰</div>
    <div class="wallet-pill">
      <span class="balance-text" id="balanceText">0.00 🇱🇧</span>
      <button class="add-btn" onclick="location.href='add-credit.html'">+</button>
    </div>
    <div style="font-weight: 900; color: #fff;">BAROUD</div>
  </header>

  <main class="wrap">
    <div class="slider-box">
      <div class="slides" id="mainSlider">
        <img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x300/06162a/21a0f0?text=Baroud+App'">
        <img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x300/06162a/21a0f0?text=Fast+Service'">
      </div>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search services...">
    </div>

    <section class="grid">
      <a href="accounts.html" class="neon-tile">
        <div class="tile-img-container"><img src="assets/accounts.png"></div>
        <div class="tile-label">Accounts</div>
      </a>
      <a href="games.html" class="neon-tile">
        <div class="tile-img-container"><img src="assets/games.png"></div>
        <div class="tile-label">Games</div>
      </a>
      <a href="mobile.html" class="neon-tile">
        <div class="tile-img-container"><img src="assets/mobile.png"></div>
        <div class="tile-label">Mobile</div>
      </a>
      <a href="giftcards.html" class="neon-tile">
        <div class="tile-img-container"><img src="assets/giftcards.png"></div>
        <div class="tile-label">Gift Cards</div>
      </a>
      <a href="social.html" class="neon-tile">
        <div class="tile-img-container"><img src="assets/social.png"></div>
        <div class="tile-label">Social Media</div>
      </a>
      <a href="apps.html" class="neon-tile">
        <div class="tile-img-container"><img src="assets/apps.png"></div>
        <div class="tile-label">Premium Apps</div>
      </a>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById("menuBtn").onclick = () => { document.getElementById("drawer").classList.add("active"); document.getElementById("overlay").style.display = "block"; };
    document.getElementById("overlay").onclick = () => { document.getElementById("drawer").classList.remove("active"); document.getElementById("overlay").style.display = "none"; };

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if(session) {
        document.getElementById("userEmail").textContent = session.user.email;
        const { data } = await sb.from("profiles").select("balance").eq("id", session.user.id).single();
        if(data) document.getElementById("balanceText").textContent = data.balance.toFixed(2) + " 🇱🇧";
      }
    }
    init();

    let idx = 0;
    setInterval(() => { idx = (idx + 1) % 2; document.getElementById("mainSlider").style.transform = `translateX(-${idx * 50}%)`; }, 4000);
  </script>
</body>
</html>
