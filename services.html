<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Services Portal</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; padding: 0; background: var(--bg-dark); color: #fff; 
      font-family: 'Orbitron', 'Cairo', sans-serif; overflow-x: hidden;
    }
    
    .wrap { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 15px 120px; }

    /* ===== TOPBAR (MODERN GLASS) ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; background: rgba(2, 5, 8, 0.85);
      position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px);
    }
    
    .wallet-pill {
      display: flex; align-items: center; gap: 10px;
      background: var(--glass); padding: 5px 5px 5px 15px;
      border-radius: 20px; border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
    }
    .balance-text { font-weight: 900; font-size: 13px; color: var(--neon-cyan); }
    .add-btn { 
      width: 28px; height: 28px; background: var(--neon-cyan); 
      border-radius: 50%; color: #000; border: none; font-weight: bold; cursor: pointer;
    }

    .menu-trigger { font-size: 24px; cursor: pointer; color: #fff; }

    /* ===== BANNER SLIDER ===== */
    .slider-box { 
      width: 100%; height: 180px; border-radius: 24px; overflow: hidden; 
      margin: 20px 0; border: 1px solid var(--glass-border); position: relative;
    }
    .slides { display: flex; width: 300%; height: 100%; transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .slides img { width: 33.333%; height: 100%; object-fit: cover; }

    /* ===== SEARCH (CLEAN) ===== */
    .search-wrap { 
      background: #fff; border-radius: 14px; padding: 0 18px; 
      margin-bottom: 25px; display: flex; align-items: center;
    }
    .search-wrap input { 
      width: 100%; height: 48px; background: none; border: none; 
      color: #000; font-size: 15px; font-weight: 700; font-family: 'Cairo';
    }

    /* ===== GRID SYSTEM ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .service-card {
      background: var(--glass); border-radius: 24px;
      border: 1px solid var(--glass-border); overflow: hidden;
      text-decoration: none; display: flex; flex-direction: column;
      transition: 0.3s; height: 190px;
    }
    .service-card:active { transform: scale(0.95); border-color: var(--neon-cyan); }
    
    .img-box { width: 100%; height: 140px; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    
    .label-box { padding: 12px; text-align: center; font-size: 11px; font-weight: 900; color: #fff; letter-spacing: 1px; }

    /* ===== DRAWER (RIGHT SIDE) ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; z-index: 2000; }
    .drawer { 
      position: fixed; top: 0; right: -100%; width: 280px; height: 100%; 
      background: var(--bg-dark); z-index: 2100; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
      padding: 40px 25px; border-left: 1px solid var(--glass-border);
    }
    .drawer.active { right: 0; }
    .m-item { display: block; padding: 18px 0; color: #fff; text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--glass-border); }

    /* ===== BOTTOM DOCK ===== */
    .dock {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 380px; height: 70px;
      background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 25px;
      display: flex; align-items: center; justify-content: space-around;
      z-index: 1000;
    }
    .dock-icon { font-size: 24px; cursor: pointer; opacity: 0.5; transition: 0.3s; }
    .dock-icon.active { opacity: 1; transform: translateY(-5px); color: var(--neon-cyan); }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 60px; height: 60px; background: var(--neon-cyan); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px;">👤</div>
        <div id="userEmail" style="font-size: 11px; opacity: 0.5;">Loading profile...</div>
    </div>
    <a href="services.html" class="m-item">🏠 Home </a>
    <a href="my-orders.html" class="m-item">📦 Order History</a>
    <a href="add-credit.html" class="m-item">💰 Refill Wallet</a>
    <a href="https://wa.me/96170385398" class="m-item">💬 Support Chat</a>
    <button onclick="sb.auth.signOut().then(()=>location.replace('login.html'))" style="background:none; border:none; color:#ff5252; padding:20px 0; font:inherit; cursor:pointer; width:100%; text-align:left; font-weight:900;">🚪 LOGOUT</button>
  </aside>

  <header class="topbar">
    <div class="wallet-pill">
      <span class="balance-text" id="balanceText">0.00 🇱🇧</span>
      <button class="add-btn" onclick="location.href='add-credit.html'">+</button>
    </div>
    <div style="font-weight: 900; letter-spacing: 2px; color: #fff; font-size: 20px;">BAROUD</div>
    <div class="menu-trigger" id="menuBtn">☰</div>
  </header>

  <main class="wrap">
    <div class="slider-box">
      <div class="slides" id="mainSlider">
        <img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x400/020508/00f2ff?text=PREMIUM+SERVICES'">
        <img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x400/020508/00f2ff?text=INSTANT+DELIVERY'">
        <img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/600x400/020508/00f2ff?text=24/7+SUPPORT'">
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" placeholder="Search for accounts, games...">
    </div>

    <section class="grid">
  <a href="accounts.html" class="service-card">
    <div class="img-box"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=500'"></div>
    <div class="label-box">ACCOUNTS</div>
  </a>
  <a href="games.html" class="service-card">
    <div class="img-box"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500'"></div>
    <div class="label-box">GAMING</div>
  </a>
  <a href="phone-recharge.html" class="service-card">
    <div class="img-box"><img src="assets/mobile.png" onerror="this.src='https://images.unsplash.com/photo-1616077168079-7e09a677fb2c?w=500'"></div>
    <div class="label-box">MOBILE</div>
  </a>
  <a href="giftcards.html" class="service-card">
    <div class="img-box"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500'"></div>
    <div class="label-box">GIFT CARDS</div>
  </a>
  <a href="apps.html" class="service-card">
    <div class="img-box"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1614332287897-cdc485fa562d?w=500'"></div>
    <div class="label-box">PREMIUM APPS</div>
  </a>

  <a href="phones.html" class="service-card" style="border-color: var(--neon-cyan);">
    <div class="img-box">
      <img src="assets/phones.png" onerror="this.src='https://images.unsplash.com/photo-1556656793-062ff9878204?w=500'">
    </div>
    <div class="label-box" style="color: var(--neon-cyan);">PHONES & ACCESSORIES</div>
  </a>
</section>

  </main>

  <nav class="dock">
    <div class="dock-icon active">🏠</div>
    <div class="dock-icon" onclick="location.href='add-credit.html'">💳</div>
    <div class="dock-icon" onclick="location.href='my-orders.html'">📦</div>
    <div class="dock-icon" onclick="window.open('https://wa.me/96170385398')">💬</div>
  </nav>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Menu Controls
    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");

    btn.onclick = () => { drawer.classList.add("active"); overlay.style.display = "block"; };
    overlay.onclick = () => { drawer.classList.remove("active"); overlay.style.display = "none"; };

    // Supabase Profile Data
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if(!session) return window.location.replace("login.html");

      document.getElementById("userEmail").textContent = session.user.email;
      const { data } = await sb.from("profiles").select("balance").eq("id", session.user.id).single();
      if(data) document.getElementById("balanceText").textContent = data.balance.toFixed(2) + " 🇱🇧";
    }
    init();

    // Smooth Slider Logic
    let currentIdx = 0;
    setInterval(() => { 
      currentIdx = (currentIdx + 1) % 3; 
      document.getElementById("mainSlider").style.transform = `translateX(-${currentIdx * 33.333}%)`; 
    }, 5000);
  </script>
</body>
</html>
