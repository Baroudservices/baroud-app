<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Premium Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #03060f;
      --brand-blue: #3b82f6;
      --brand-glow: rgba(59, 130, 246, 0.15);
      --glass-base: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.04);
      --glass-hover: rgba(255, 255, 255, 0.05);
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: radial-gradient(circle at 50% 20%, #0a142c 0%, var(--bg-dark) 80%);
      color: #f1f5f9; 
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; 
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    .wrap { width: 100%; max-width: 420px; margin: 0 auto; padding: 0 14px 110px; }

    /* ===== TOPBAR (Sleek Mini) ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; 
      background: rgba(3, 6, 15, 0.4);
      position: sticky; top: 0; z-index: 1000; 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    .brand-title {
      font-family: 'Plus Jakarta Sans';
      font-weight: 800; letter-spacing: 5px; 
      color: #ffffff; font-size: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* بار رصيد ناعم وملموم */
    .user-info-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin: 12px 0 4px; padding: 10px 14px;
      background: rgba(255,255,255,0.01); border-radius: 16px;
      border: 1px solid var(--glass-border);
    }
    .balance-box { font-size: 13px; font-weight: 700; color: #f8fafc; }
    .balance-box span { color: var(--brand-blue); }
    .wallet-pill { padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.04); }
    .wallet-pill.reseller { background: rgba(16, 185, 129, 0.08); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.15); }
    .reseller-badge { display: none; font-size: 9px; background: #10b981; color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 5px; font-weight: 700; }
    
    /* ===== SLIDER (Compact Radius) ===== */
    .slider-box { 
      width: 100%; height: 135px; border-radius: 24px; 
      overflow: hidden; margin: 16px 0; 
      border: 1px solid var(--glass-border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .slides { display: flex; width: 300%; height: 100%; transition: 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
    .slides img { width: 33.333%; height: 100%; object-fit: cover; }

    /* ===== MINIMAL SEARCH BAR ===== */
    .search-wrap { 
      background: rgba(255, 255, 255, 0.01); 
      border-radius: 18px; padding: 0 18px; margin-bottom: 20px; 
      display: flex; align-items: center;
      border: 1px solid var(--glass-border);
    }
    .search-wrap input { 
      width: 100%; height: 44px; background: none; border: none; 
      color: #ffffff; font-size: 13px; font-weight: 600; font-family: 'Cairo';
    }
    .search-wrap input::placeholder { color: rgba(255, 255, 255, 0.15); }

    /* ===== SLEEK OFFERS BAR ===== */
    .offers-btn {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      margin-bottom: 20px; padding: 14px 20px; border-radius: 18px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 20px rgba(37, 99, 211, 0.2);
    }
    .offers-btn:active { transform: scale(0.98); }
    .off-txt h2 { margin: 0; font-size: 12px; font-weight: 800; color: #fff; letter-spacing: 1px; font-family: 'Plus Jakarta Sans'; }
    .off-txt p { margin: 2px 0 0; font-size: 10px; color: #bfdbfe; font-family: 'Cairo'; font-weight: 600; }
    .off-icon { font-size: 16px; animation: smooth-bounce 2s infinite ease-in-out; }
    
    /* ===== THE ULTRA-SLEEK ASYMMETRIC GRID ===== */
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    
    .service-card { 
      background: var(--glass-base); 
      border-radius: 22px; 
      border: 1px solid var(--glass-border); 
      text-decoration: none; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center;
      padding: 16px 12px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }
    
    /* كروت متناسقة ونحيفة مريحة جداً بالتقليب */
    .c-large { grid-column: span 6; flex-direction: row; justify-content: flex-start; gap: 18px; padding: 14px 20px; height: 78px; }
    .c-medium { grid-column: span 3; height: 120px; }

    .service-card:active { 
      transform: translateY(-3px) scale(1.01);
      background: var(--glass-hover);
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 10px 20px var(--brand-glow);
    }
    
    /* حجم الأيقونات ملموم وناعم */
    .img-box { 
      width: 46px; height: 46px; 
      border-radius: 14px; 
      overflow: hidden; 
      background: rgba(255, 255, 255, 0.02); 
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .service-card:active .img-box {
      border-color: var(--brand-blue);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .label-box { 
      font-size: 11px; font-weight: 700; color: #e2e8f0;
      letter-spacing: 0.5px; text-align: center; margin-top: 8px;
    }
    .c-large .label-box { font-size: 13px; letter-spacing: 0.8px; margin-top: 0; }

    /* ===== DRAWER & OVERLAY ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; z-index: 2000; }
    .drawer { 
      position: fixed; top: 0; right: -100%; width: 260px; height: 100%; 
      background: #050914; z-index: 2100; transition: 0.3s ease; 
      padding: 30px 20px; border-left: 1px solid var(--glass-border); 
    }
    .drawer.active { right: 0; }
    .m-item { 
      display: block; padding: 14px 0; color: #94a3b8; 
      text-decoration: none; font-weight: 600; font-size: 12px;
      border-bottom: 1px solid var(--glass-border);
    }

    /* ===== COMPACT NAVIGATION DOCK ===== */
    .dock { 
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
      width: 82%; max-width: 320px; height: 56px; 
      background: rgba(5, 9, 20, 0.5); 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.03); 
      border-radius: 20px; display: flex; align-items: center; justify-content: space-around; 
      z-index: 1000;
      box-shadow: 0 15px 30px rgba(0,0,0,0.7);
    }
    .dock-icon { font-size: 18px; cursor: pointer; opacity: 0.3; transition: 0.2s; text-decoration: none; color: #f8fafc; }
    .dock-icon.active { opacity: 1; color: var(--brand-blue); filter: drop-shadow(0 2px 8px rgba(59,130,246,0.4)); }
    
    @keyframes smooth-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div style="text-align: center; margin-bottom: 25px;">
        <div id="userAvatar" style="width: 50px; height: 50px; background: rgba(255, 255, 255, 0.01); border: 1px solid var(--glass-border); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;">👤</div>
        <div id="userEmail" style="font-size: 10px; color: var(--text-muted); margin-bottom: 4px; word-break: break-all;">Loading...</div>
        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 1px;">BAROUD HUB <span id="resellerBadge" class="reseller-badge">RESELLER</span></div>
    </div>
    <a href="services.html" class="m-item">🏠 Home </a>
    <a href="my-orders.html" class="m-item">📦 Order History</a>
    <a href="https://wa.me/96170385398" class="m-item">💬 Support Chat</a>
  </aside>

  <header class="topbar">
    <div style="width: 40px;"></div> 
    <div class="brand-title">BAROUD</div>
    <div class="menu-trigger" id="menuBtn" style="font-size: 18px; cursor: pointer; color: #94a3b8;">☰</div>
  </header>

  <main class="wrap">
    <div class="user-info-bar">
      <div class="balance-box">Balance: <span id="balanceText">$0.00</span></div>
      <div id="walletPill" class="wallet-pill">User Wallet</div>
    </div>

    <div class="slider-box">
      <div class="slides" id="mainSlider">
        <img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/500x300/03060f/3b82f6?text=PREMIUM+SERVICES'">
        <img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/500x300/03060f/3b82f6?text=BEST+PRICES'">
        <img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/500x300/03060f/3b82f6?text=24/7+SUPPORT'">
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" placeholder="Search accounts, games...">
    </div>

    <a href="offers.html" class="offers-btn">
        <div class="off-txt">
            <h2>EXCLUSIVE OFFERS</h2>
            <p>Hottest premium deals live now</p>
        </div>
        <div class="off-icon">✨</div>
    </a>

    <section class="grid" id="serviceGrid">
      <a href="accounts.html" class="service-card c-large">
        <div class="img-box"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=100'"></div>
        <div class="label-box">ACCOUNTS</div>
      </a>
      
      <a href="apps.html" class="service-card c-medium">
        <div class="img-box"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=100'"></div>
        <div class="label-box">PREMIUM APPS</div>
      </a>
      <a href="games.html" class="service-card c-medium">
        <div class="img-box"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=100'"></div>
        <div class="label-box">GAMING</div>
      </a>
      
      <a href="giftcards.html" class="service-card c-medium">
        <div class="img-box"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=100'"></div>
        <div class="label-box">GIFT CARDS</div>
      </a>
      <a href="ai-tools.html" class="service-card c-medium">
        <div class="img-box"><img src="assets/ai.png" onerror="this.src='https://images.unsplash.com/photo-1677442136019-21780ecad995?w=100'"></div>
        <div class="label-box">AI TOOLS</div>
      </a>

      <a href="phone-recharge.html" class="service-card c-large">
        <div class="img-box"><img src="assets/mobile.png" onerror="this.src='https://images.unsplash.com/photo-1616077168079-7e09a677fb2c?w=100'"></div>
        <div class="label-box">MOBILE RECHARGE</div>
      </a>
    </section>
  </main>

  <nav class="dock" id="bottomDock">
    <div class="dock-icon active" id="homeIcon">🏠</div>
    <div class="dock-icon" onclick="location.href='add-credit.html'">💳</div>
    <div class="dock-icon" onclick="location.href='my-orders.html'">📦</div>
    <div class="dock-icon" onclick="window.open('https://wa.me/96170385398')">💬</div>
  </nav>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");

    btn.onclick = () => { drawer.classList.add("active"); overlay.style.display = "block"; };
    overlay.onclick = () => { drawer.classList.remove("active"); overlay.style.display = "none"; };

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return window.location.replace("login.html");

      document.getElementById("userEmail").textContent = session.user.email;
      
      const { data: profile } = await sb.from("profiles").select("balance, role").eq("id", session.user.id).single();

      if (profile) {
        document.getElementById("balanceText").textContent = `$${profile.balance.toFixed(2)}`;

        if (profile.role === 'reseller') {
          document.getElementById("walletPill").classList.add("reseller");
          document.getElementById("walletPill").textContent = "Reseller Wallet";
          document.getElementById("resellerBadge").style.display = "inline-block";
          document.getElementById("userAvatar").style.borderColor = "#10b981";
          document.getElementById("homeIcon").classList.add("reseller");
        }
      }
    }
    init();

    let currentIdx = 0;
    setInterval(() => { 
      currentIdx = (currentIdx + 1) % 3; 
      const slider = document.getElementById("mainSlider");
      if(slider) slider.style.transform = `translateX(-${currentIdx * 33.333}%)`; 
    }, 5000);
  </script>
</body>
</html>
