<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud Services - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ===== RESET & BASE ===== */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #06162a, #020b14);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: 100%; margin: 0 auto;
      padding: 20px 14px 60px;
      max-width: 520px;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; margin: 0 -14px 15px;
      position: sticky; top: 0; z-index: 1000;
      background: rgba(6, 22, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }

    .menu-trigger {
      width: 42px; height: 42px; 
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 20px; cursor: pointer;
    }

    .brand-title {
      font-weight: 900; letter-spacing: 1px; font-size: 18px;
      background: linear-gradient(90deg, #fff, #21a0f0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Wallet */
    .wallet-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(33, 160, 240, 0.15);
      padding: 5px 5px 5px 12px; 
      border-radius: 20px;
      border: 1px solid rgba(33, 160, 240, 0.2);
    }
    .balance-text { font-weight: 800; font-size: 13px; color: #21a0f0; }
    .add-fund-btn {
      width: 28px; height: 28px; 
      background: #21a0f0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; border: none; font-weight: bold; cursor: pointer;
    }

    /* App Pill */
    .appPill {
      background: linear-gradient(135deg, #ffd700, #ffa500);
      color: #000 !important; text-decoration: none;
      padding: 6px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 800;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
    }

    /* ===== SLIDER & SUPPORT ===== */
    .slider-box {
      width: 100%; border-radius: 20px; overflow: hidden;
      margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
      height: 160px; position: relative; background: #000;
    }
    .slides { display: flex; width: 300%; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
    .slides img { width: 33.333%; height: 100%; object-fit: cover; }

    .support-slider {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 15px; height: 40px;
      overflow: hidden; margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .support-item {
      height: 40px; display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 12px; color: #aaa; font-weight: 600;
    }

    /* ===== SEARCH ===== */
    .search-box {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 15px; padding: 0 15px;
      margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .search-box input { 
      width: 100%; background: transparent; border: none; outline: none; 
      color: #fff; height: 45px; font-size: 14px;
    }

    #searchResults {
      display: none; margin-bottom: 20px;
      background: #0b1a2d; border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;
    }
    .sr-item {
      padding: 12px 15px; display: flex; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
    }

    /* ===== GRID ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .neon-tile {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none; color: inherit; transition: 0.2s;
    }
    .neon-tile:active { transform: scale(0.96); background: rgba(255,255,255,0.08); }
    .neon-tile img { width: 100%; height: 110px; object-fit: cover; }
    .tile-label { padding: 10px; text-align: center; font-weight: 700; font-size: 13px; }

    /* ===== DRAWER ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 2000; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; width: 280px; height: 100%;
      background: #06101d; border-right: 1px solid rgba(255,255,255,0.1);
      transform: translateX(-100%); transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 2100; padding: 25px 15px; display: flex; flex-direction: column;
    }
    .drawer.show { transform: translateX(0); }
    .m-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      border-radius: 12px; text-decoration: none; color: #ccc; font-weight: 600;
    }
    .m-item:active { background: rgba(33, 160, 240, 0.1); color: #fff; }
    .user-card { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .user-avatar { width: 55px; height: 55px; background: rgba(255,255,255,0.05); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border: 2px solid #21a0f0; font-size: 24px; }

    /* ===== WHATSAPP MODAL ===== */
    .waModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 9999; }
    .waCard { background: #0b1a2d; border-radius: 24px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 350px; }
    .waBtn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .btn-join { background: #25D366; color: #fff; }
    .btn-later { background: transparent; color: #777; }

    @media (min-width: 992px) { .grid { grid-template-columns: repeat(4, 1fr); } .slider-box { height: 300px; } }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer">
    <div class="user-card">
      <div class="user-avatar">👤</div>
      <div class="userEmail" id="userEmail" style="font-size: 13px;">Loading...</div>
    </div>
    <a href="#" class="m-item" onclick="closeSidebar()"><span>🏠</span> Home</a>
    <a href="profile.html" class="m-item"><span>👤</span> Account</a>
    <a href="add-credit.html" class="m-item"><span>💰</span> Add Credit</a>
    <a href="my-orders.html" class="m-item"><span>📦</span> My Orders</a>
    <a href="security.html" class="m-item"><span>🔒</span> Security</a>
    <button class="m-item" id="logoutBtn" style="width:100%; background:none; border:none; color:#ff5252; margin-top:10px;"><span>🚪</span> Logout</button>
    <a class="m-item" style="margin-top:auto; color:#25D366;" href="https://wa.me/96170385398"><span>💬</span> WhatsApp Support</a>
  </aside>

  <main class="wrap">
    <header class="topbar">
      <div class="topbar-left">
        <div class="menu-trigger" id="menuBtn">☰</div>
        <div class="wallet-pill">
          <span class="balance-text" id="balanceText">0.00 🇱🇧</span>
          <button class="add-fund-btn" onclick="location.href='add-credit.html'">+</button>
        </div>
      </div>
      <div class="topbar-right">
        <a href="app.apk" class="appPill">⬇ App</a>
        <div class="brand-title">BAROUD</div>
      </div>
    </header>

    <div class="slider-box">
      <div class="slides" id="mainSlider">
        <img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x300/111/FFF?text=Baroud+1'">
        <img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x300/111/FFF?text=Baroud+2'">
        <img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/600x300/111/FFF?text=Baroud+3'">
      </div>
    </div>

    <div class="support-slider">
      <div class="support-track" id="supportTrack">
        <div class="support-item">⚡ Fast Delivery &nbsp; | &nbsp; 📞 +961 70385398</div>
      </div>
    </div>

    <div class="search-box">
      <input id="serviceSearch" type="text" placeholder="Search for items..." autocomplete="off">
    </div>
    <div id="searchResults"></div>

    <section class="grid">
      <a href="accounts.html" class="neon-tile"><img src="assets/accounts.png" onerror="this.src='https://placehold.co/200x150/222/FFF?text=Accounts'"><div class="tile-label">Accounts</div></a>
      <a href="games.html" class="neon-tile"><img src="assets/games.png" onerror="this.src='https://placehold.co/200x150/222/FFF?text=Games'"><div class="tile-label">Games</div></a>
      <a href="phone-recharge.html" class="neon-tile"><img src="assets/phone-recharge.png" onerror="this.src='https://placehold.co/200x150/222/FFF?text=Phone'"><div class="tile-label">Phone</div></a>
      <a href="giftcards.html" class="neon-tile"><img src="assets/giftcards.png" onerror="this.src='https://placehold.co/200x150/222/FFF?text=Cards'"><div class="tile-label">Gift Cards</div></a>
    </section>
  </main>

  <div class="waModal" id="waModal">
    <div class="waCard">
      <h3>Join Community 💬</h3>
      <p style="font-size: 13px; color: #888;">Get the latest offers and instant support.</p>
      <button class="waBtn btn-join" id="waJoin">Join Now</button>
      <button class="waBtn btn-later" id="waLater">Maybe Later</button>
    </div>
  </div>

  <script>
    // Config & Supabase
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Sidebar
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const openSidebar = () => { drawer.classList.add("show"); overlay.classList.add("show"); };
    const closeSidebar = () => { drawer.classList.remove("show"); overlay.classList.remove("show"); };
    document.getElementById("menuBtn").onclick = openSidebar;
    overlay.onclick = closeSidebar;

    // Slider
    let slideIdx = 0;
    setInterval(() => {
      slideIdx = (slideIdx + 1) % 3;
      document.getElementById("mainSlider").style.transform = `translateX(-${slideIdx * 33.333}%)`;
    }, 4000);

    // Load Data
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if(session) {
        document.getElementById("userEmail").textContent = session.user.email;
        const { data } = await sb.from("profiles").select("balance").eq("id", session.user.id).single();
        if(data) document.getElementById("balanceText").textContent = data.balance.toFixed(2) + " 🇱🇧";
      }
    }
    init();

    // Logout
    document.getElementById("logoutBtn").onclick = async () => {
      await sb.auth.signOut();
      location.href = "index.html";
    };

    // WhatsApp Popup - 3 Seconds delay for better UX
    setTimeout(() => { document.getElementById("waModal").style.display = "flex"; }, 3000);
    document.getElementById("waLater").onclick = () => { document.getElementById("waModal").style.display = "none"; };
    document.getElementById("waJoin").onclick = () => { window.open("https://chat.whatsapp.com/D7ORsbcGnRpJmHpoIVBbYw"); };

    // Search Logic
    const searchInput = document.getElementById("serviceSearch");
    const resultsDiv = document.getElementById("searchResults");
    searchInput.oninput = async () => {
      const q = searchInput.value.trim();
      if(q.length < 2) { resultsDiv.style.display = "none"; return; }
      const { data } = await sb.from("products").select("id,title,price").ilike("title", `%${q}%`).limit(5);
      if(data && data.length > 0) {
        resultsDiv.style.display = "block";
        resultsDiv.innerHTML = data.map(p => `<div class="sr-item" onclick="location.href='account.html?id=${p.id}'"><span>${p.title}</span><span style="color:#21a0f0">$${p.price}</span></div>`).join("");
      }
    };
  </script>
</body>
</html>
