<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Premium Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #02040a;
      --brand-blue: #2563eb;
      --brand-glow: rgba(37, 99, 211, 0.12);
      --glass-card: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.04);
      --glass-border-active: rgba(37, 99, 211, 0.3);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background-color: var(--bg-dark); color: #f8fafc; 
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; 
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    .wrap { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 18px 120px; }

    /* ===== TOPBAR (Next-Gen Luxury) ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; 
      background: rgba(2, 4, 10, 0.7);
      position: sticky; top: 0; z-index: 1000; 
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--glass-border);
    }
    .brand-title {
      font-family: 'Plus Jakarta Sans';
      font-weight: 800; letter-spacing: 5px; 
      color: #ffffff;
      font-size: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    /* ===== FLOATING SLIDER ===== */
    .slider-box { 
      width: 100%; height: 155px; border-radius: 28px; 
      overflow: hidden; margin: 20px 0; 
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .slides { display: flex; width: 300%; height: 100%; transition: 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
    .slides img { width: 33.333%; height: 100%; object-fit: cover; }

    /* ===== PREMIUM MINIMAL SEARCH ===== */
    .search-wrap { 
      background: rgba(255, 255, 255, 0.02); 
      border-radius: 20px; padding: 0 20px; margin-bottom: 26px; 
      display: flex; align-items: center;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }
    .search-wrap input { 
      width: 100%; height: 50px; background: none; border: none; 
      color: #ffffff; font-size: 14px; font-weight: 600; font-family: 'Cairo';
    }
    .search-wrap input::placeholder { color: rgba(255, 255, 255, 0.2); }

    /* ===== EXCLUSIVE OFFERS ===== */
    .offers-btn {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
      margin-bottom: 26px; padding: 16px 24px; border-radius: 20px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 25px rgba(37, 99, 211, 0.2);
    }
    .offers-btn:active { transform: scale(0.98); }
    .off-txt h2 { margin: 0; font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 1px; font-family: 'Plus Jakarta Sans'; }
    .off-txt p { margin: 3px 0 0; font-size: 11px; color: #dbeafe; font-family: 'Cairo'; font-weight: 600; }
    .off-icon { font-size: 20px; animation: smooth-bounce 2s infinite ease-in-out; }
    
    /* ===== GRID & THE NEW LUXURY BADGE CARDS ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .service-card { 
      background: var(--glass-card); 
      border-radius: 28px; 
      border: 1px solid var(--glass-border); 
      text-decoration: none; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center;
      height: 160px; padding: 20px 10px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    /* لمسة الأجهزة الذكية الفخمة عند الكبس */
    .service-card:active { 
      transform: translateY(-4px) scale(1.02);
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--glass-border-active);
      box-shadow: 0 12px 24px var(--brand-glow);
    }
    
    /* دائرة الأيقونة الفخمة المضاءة بنعومة بدلاً من المربع الميت */
    .img-box { 
      width: 64px; height: 64px; 
      border-radius: 50%; 
      overflow: hidden; 
      background: rgba(255, 255, 255, 0.02); 
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.03);
      transition: all 0.4s ease;
    }
    .service-card:active .img-box {
      border-color: var(--brand-blue);
      box-shadow: 0 0 15px rgba(37, 99, 211, 0.3);
    }
    .img-box img { 
      width: 100%; height: 100%; 
      object-fit: cover;
    }
    
    .label-box { 
      font-size: 11px; font-weight: 700; color: #f1f5f9;
      letter-spacing: 0.5px; text-align: center;
      opacity: 0.9; transition: color 0.3s;
    }
    .service-card:active .label-box { color: #ffffff; opacity: 1; }

    /* ===== DRAWER & OVERLAY ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: none; z-index: 2000; }
    .drawer { 
      position: fixed; top: 0; right: -100%; width: 280px; height: 100%; 
      background: #050811; z-index: 2100; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
      padding: 40px 24px; border-left: 1px solid var(--glass-border); 
    }
    .drawer.active { right: 0; }
    .m-item { 
      display: block; padding: 18px 0; color: #94a3b8; 
      text-decoration: none; font-weight: 600; font-size: 13px;
      border-bottom: 1px solid var(--glass-border); transition: 0.2s;
    }
    .m-item:active { color: var(--brand-blue); }

    /* ===== ULTRA-MINIMAL DOCK ===== */
    .dock { 
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); 
      width: 88%; max-width: 360px; height: 66px; 
      background: rgba(5, 8, 17, 0.6); 
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.05); 
      border-radius: 24px; display: flex; align-items: center; justify-content: space-around; 
      z-index: 1000;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .dock-icon { font-size: 20px; cursor: pointer; opacity: 0.3; transition: 0.3s; }
    .dock-icon.active { opacity: 1; color: var(--brand-blue); filter: drop-shadow(0 2px 8px rgba(37,99,211,0.4)); }
    
    @keyframes smooth-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  </style>
</head>
