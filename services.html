<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Services Portal</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --neon-pink: #ff007a;
      --neon-green: #2ecc71;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; padding: 0; background: var(--bg-dark); color: #fff; 
      font-family: 'Orbitron', 'Cairo', sans-serif; overflow-x: hidden;
    }
    
    .wrap { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 15px 120px; }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; background: rgba(2, 5, 8, 0.9);
      position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
    }

    /* ===== OFFERS BUTTON (FIXED SIZE) ===== */
    .offers-btn {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(90deg, #ff007a, #ff4b2b);
      margin: 10px 0 20px; padding: 12px 20px; border-radius: 15px;
      text-decoration: none; position: relative;
      box-shadow: 0 0 15px rgba(255, 0, 122, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .offers-btn:active { transform: scale(0.97); }
    .off-txt h2 { margin: 0; font-size: 13px; font-weight: 900; color: #fff; letter-spacing: 1px; }
    .off-txt p { margin: 1px 0 0; font-size: 9px; opacity: 0.9; font-family: 'Cairo'; }
    .off-icon { font-size: 18px; animation: pulse 1.5s infinite; }
    
    /* ===== SLIDER ===== */
    .slider-box { width: 100%; height: 160px; border-radius: 20px; overflow: hidden; margin: 15px 0; border: 1px solid var(--glass-border); }
    .slides { display: flex; width: 300%; height: 100%; transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .slides img { width: 33.333%; height: 100%; object-fit: cover; }

    /* ===== SEARCH ===== */
    .search-wrap { background: #fff; border-radius: 12px; padding: 0 15px; margin-bottom: 20px; display: flex; align-items: center; }
    .search-wrap input { width: 100%; height: 44px; background: none; border: none; color: #000; font-size: 14px; font-weight: 700; font-family: 'Cairo'; }

    /* ===== GRID & CARDS (FIXED IMAGES) ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .service-card { 
      background: var(--glass); border-radius: 20px; border: 1px solid var(--glass-border); 
      overflow: hidden; text-decoration: none; display: flex; flex-direction: column; 
      height: 165px; transition: 0.3s; 
    }
    .service-card:active { transform: scale(0.95); }
    
    .img-box { width: 100%; height: 115px; overflow: hidden; background: #000; }
    .img-box img { 
      width: 100%; height: 100%; 
      object-fit: cover; 
      object-position: center;
    }
    
    .label-box { 
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 5px; text-align: center; font-size: 10px; font-weight: 900; color: #fff; 
    }

    /* Drawer & Dock */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; z-index: 2000; }
    .drawer { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: var(--bg-dark); z-index: 2100; transition: 0.5s; padding: 40px 25px; border-left: 1px solid var(--glass-border); }
    .drawer.active { right: 0; }
    .m-item { display: block; padding: 18px 0; color: #fff; text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--glass-border); }

    .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; height: 65px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 22px; display: flex; align-items: center; justify-content: space-around; z-index: 1000; }
    .dock-icon { font-size: 22px; cursor: pointer; opacity: 0.5; }
    .dock-icon.active { opacity: 1; color: var(--neon-cyan); }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div style="text-align: center; margin-bottom: 30px;">

        <div style="font-size: 14px; font-weight: 900; color: var(--neon-cyan);">BAROUD CUSTOMER</div>
    </div>
    <a href="services.html" class="m-item">🏠 Home </a>
    <a href="my-orders.html" class="m-item">📦 Order History</a>

  </aside>

  <header class="topbar">
    <div style="width: 40px;"></div> <div style="font-weight: 900; letter-spacing: 2px; color: #fff; font-size: 18px;">BAROUD</div>
    <div class="menu-trigger" id="menuBtn" style="font-size: 20px; cursor: pointer;">☰</div>

  <main class="wrap">
    <div class="slider-box">

        <img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x400/020508/00f2ff?text=PREMIUM+SERVICES'">
        <img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x400/020508/2ecc71?text=BEST+PRICES'">
        <img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/600x400/020508/00f2ff?text=24/7+SUPPORT'">

    </div>

    <div class="search-wrap">

    <a href="offers.html" class="offers-btn">

    <section class="grid" id="serviceGrid">
      <a href="accounts.html" class="service-card">

        <div class="label-box">PREMIUM APPS</div>
      </a>
      <a href="games.html" class="service-card">
        <div class="img-box"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500'"></div>
        <div class="label-box">GAMING</div>
      </a>
      <a href="giftcards.html" class="service-card">
        <div class="img-box"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500'"></div>
        <div class="label-box">GIFT CARDS</div>
      </a>
      <a href="ai-tools.html" class="service-card">
        <div class="img-box"><img src="assets/ai.png" onerror="this.src='https://images.unsplash.com/photo-1677442136019-21780ecad995?w=500'"></div>

      </a>
      <a href="phone-recharge.html" class="service-card">
        <div class="img-box"><img src="assets/mobile.png" onerror="this.src='https://images.unsplash.com/photo-1616077168079-7e09a677fb2c?w=500'"></div>
        <div class="label-box">MOBILE RECHARGE</div>
      </a>
    </section>
  </main>

  <nav class="dock" id="bottomDock">
    <div class="dock-icon active" id="homeIcon">🏠</div>
    <div class="dock-icon" onclick="location.href='my-orders.html'">📦</div>
    <div class="dock-icon" onclick="window.open('https://wa.me/96170385398')">💬</div>
  </nav>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btn = document.getElementById("menuBtn");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");

    btn.onclick = () => { drawer.classList.add("active"); overlay.style.display = "block"; };
    overlay.onclick = () => { drawer.classList.remove("active"); overlay.style.display = "none"; };

    async function init() {

      console.log("Portal initialized successfully without balance constraints.");

</body>
</html>
