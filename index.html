<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud App | المتجر الأول في لبنان</title>
  
  <style>
    /* ===== MODERN SYSTEM & THEME ===== */
    :root {
      --bg: #020b14;
      --card-bg: #06101d;
      --accent: #21a0f0; /* اللون الأزرق الأساسي لبارود */
      --green-fix: #21f07a;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; min-height: 100vh; }

    .wrap { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 16px 100px; }

    /* ===== TOPBAR (MODERN & CLEAN) ===== */
    .topbar {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 16px; background: rgba(2, 11, 20, 0.85);
      backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);
    }
    .brand-title { font-weight: 900; font-size: 20px; letter-spacing: 1.5px; color: #fff; }
    .icon-btn { 
      width: 42px; height: 42px; border-radius: 12px; 
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    /* ===== HERO BANNER (PREMIUM LOOK) ===== */
    .banner-container { 
      width: 100%; height: 175px; border-radius: 24px; 
      overflow: hidden; margin-top: 15px; position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
    }
    .slides { display: flex; width: 300%; height: 100%; transition: 0.8s cubic-bezier(0.2, 1, 0.2, 1); }
    .slide { width: 33.333%; height: 100%; position: relative; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }
    .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }

    .dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 10px; background: rgba(255,255,255,0.3); transition: 0.4s; }
    .dot.active { width: 20px; background: var(--accent); }

    /* ===== TICKER (FAST DELIVERY) ===== */
    .ticker {
      margin: 15px 0; background: rgba(33, 160, 240, 0.1); 
      border: 1px solid rgba(33, 160, 240, 0.15);
      border-radius: 12px; padding: 8px; overflow: hidden; white-space: nowrap;
    }
    .ticker-content { display: inline-block; animation: scroll 20s linear infinite; font-size: 12px; font-weight: 600; color: #cbd5e0; }
    @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

    /* ===== SEARCH (NEW STYLE) ===== */
    .search-box {
      background: var(--card-bg); border: 1px solid var(--glass-border);
      border-radius: 15px; padding: 2px 15px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px; transition: 0.3s;
    }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 15px rgba(33, 160, 240, 0.2); }
    .search-box input { width: 100%; background: none; border: none; color: #fff; height: 48px; font-size: 15px; }

    /* ===== GRID (HIGH QUALITY IMAGES) ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .tile {
      background: var(--card-bg); border: 1px solid var(--glass-border);
      border-radius: 20px; overflow: hidden; position: relative;
      transition: 0.3s; text-decoration: none; display: flex; flex-direction: column;
      height: 180px; /* طول متناسق للموبايل */
    }
    .tile:active { transform: scale(0.96); }
    
    .img-wrap { width: 100%; height: 135px; overflow: hidden; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .label { 
      padding: 10px; text-align: center; font-weight: 700; font-size: 13px; 
      color: #fff; background: rgba(0,0,0,0.3); flex-grow: 1;
      display: flex; align-items: center; justify-content: center;
    }

    .badge {
      position: absolute; top: 10px; right: 10px; background: var(--green-fix);
      color: #020b14; font-size: 9px; font-weight: 900; padding: 4px 10px;
      border-radius: 8px; z-index: 5;
    }

    /* ===== DRAWER ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 2000; }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: var(--bg); border-right: 1px solid var(--glass-border);
      transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); z-index: 2100; padding: 30px 20px;
    }
    .drawer.active { left: 0; }
    .menu-item { display: block; padding: 15px; color: #a0aec0; text-decoration: none; font-weight: 600; border-radius: 12px; margin-bottom: 5px; }
    .menu-item:active { background: var(--glass); color: #fff; }

    .hint { text-align: center; opacity: 0.2; font-size: 11px; margin-top: 50px; letter-spacing: 2px; }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div style="text-align: center; margin-bottom: 40px;">
        <div style="width: 70px; height: 70px; background: var(--accent); border-radius: 20px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 20px rgba(33, 160, 240, 0.3);">👤</div>
        <div style="font-weight: 700;">Welcome Back</div>
    </div>
    <a href="index.html" class="menu-item">🏠 Home</a>
    <a href="login.html" class="menu-item">🔑 Login</a>
    <a href="register.html" class="menu-item">📝 Register</a>
    <a href="https://wa.me/96170385398" class="menu-item">💬 Support</a>
  </aside>

  <header class="topbar">
    <div class="icon-btn" id="menuBtn">☰</div>
    <div class="brand-title">BAROUD</div>
    <div class="icon-btn" onclick="location.href='login.html'">👤</div>
  </header>

  <main class="wrap">
    <div class="banner-container">
      <div class="slides" id="slides">
        <div class="slide"><img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x300/06101d/21a0f0?text=Premium+Services'"></div>
        <div class="slide"><img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x300/06101d/21a0f0?text=Instant+Delivery'"></div>
        <div class="slide"><img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/600x300/06101d/21a0f0?text=Best+Prices'"></div>
      </div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="ticker">
      <div class="ticker-content">⚡ Fast Delivery • 🔥 Best Rates in Lebanon • 📞 Support +961 70385398 • ✅ Secure Payments</div>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="mainSearch" placeholder="Search for items..." autocomplete="off">
    </div>

    <section class="grid">
      <a href="login.html" class="tile">
        <span class="badge">POPULAR</span>
        <div class="img-wrap"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=500'"></div>
        <div class="label">Accounts</div>
      </a>
      <a href="login.html" class="tile">
        <span class="badge" style="background: #f0a021;">HOT</span>
        <div class="img-wrap"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500'"></div>
        <div class="label">Games</div>
      </a>
      <a href="login.html" class="tile">
        <div class="img-wrap"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=500'"></div>
        <div class="label">Gift Cards</div>
      </a>
      <a href="login.html" class="tile">
        <div class="img-wrap"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1614332287897-cdc485fa562d?q=80&w=500'"></div>
        <div class="label">Apps</div>
      </a>
    </section>

    <div class="hint">BAROUDAPP.COM</div>
  </main>

  <script>
    // Drawer
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    document.getElementById('menuBtn').onclick = () => { drawer.classList.add('active'); overlay.classList.add('active'); };
    overlay.onclick = () => { drawer.classList.remove('active'); overlay.classList.remove('active'); };

    // Auto Slider
    let step = 0;
    const slides = document.getElementById('slides');
    const dotsContainer = document.getElementById('dots');
    for(let i=0; i<3; i++) {
        const d = document.createElement('div');
        d.className = `dot ${i===0?'active':''}`;
        dotsContainer.appendChild(d);
    }
    setInterval(() => {
        step = (step + 1) % 3;
        slides.style.transform = `translateX(-${step * 33.333}%)`;
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === step));
    }, 4500);

    // Search Mockup
    document.getElementById('mainSearch').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.tile').forEach(t => {
            const text = t.innerText.toLowerCase();
            t.style.display = text.includes(val) ? 'flex' : 'none';
        });
    };
  </script>
</body>
</html>
