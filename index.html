<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAROUD | Elite Digital Realm</title>
  
  <style>
    /* ===== THE UNKNOWN SYSTEM ===== */
    :root {
      --neon-cyan: #00f2ff;
      --deep-black: #050505;
      --glass-white: rgba(255, 255, 255, 0.05);
      --sharp-border: #1a1a1a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    body { 
      background-color: var(--deep-black); 
      color: #fff; 
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* تأثير الشبكة الرقمية في الخلفية */
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(var(--sharp-border) 1px, transparent 1px), 
                        linear-gradient(90deg, var(--sharp-border) 1px, transparent 1px);
      background-size: 30px 30px; z-index: -1; opacity: 0.3;
    }

    .wrapper { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 15px 120px; }

    /* ===== NAVIGATION (STATIC MINIMAL) ===== */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 25px 5px; margin-bottom: 20px;
    }
    .logo-box {
      font-size: 26px; font-weight: 900; letter-spacing: -1px;
      border: 3px solid #fff; padding: 2px 12px; transform: skewX(-10deg);
      box-shadow: 5px 5px 0px var(--neon-cyan);
    }

    /* ===== HERO CARDS (THE MIRROR) ===== */
    .hero-container {
      width: 100%; height: 230px; position: relative; margin-bottom: 35px;
      perspective: 1000px;
    }
    .hero-card {
      width: 100%; height: 100%; position: relative;
      background: var(--glass-white); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px); border-radius: 5px;
      overflow: hidden; transform: rotateX(5deg);
    }
    .hero-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; filter: grayscale(100%) contrast(120%); transition: 0.5s; }
    .hero-card:hover img { filter: grayscale(0%); opacity: 1; }

    /* ===== SEARCH (NEO-INPUT) ===== */
    .search-box {
      background: #fff; border-radius: 0; padding: 5px 20px;
      margin-bottom: 30px; display: flex; align-items: center;
      box-shadow: 8px 8px 0px var(--neon-cyan);
    }
    .search-box input {
      width: 100%; height: 50px; background: none; border: none;
      color: #000; font-size: 16px; font-weight: 900;
    }

    /* ===== GRID (STAGGERED CARDS) ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    
    .item {
      background: #111; border: 2px solid var(--sharp-border);
      position: relative; height: 200px; transition: 0.3s;
      cursor: pointer;
    }
    .item:nth-child(even) { transform: translateY(20px); } /* حركة غير متناظرة */

    .item:active { background: var(--neon-cyan); transform: scale(0.95); }
    .item:active .item-label { color: #000; }

    .item-img { width: 100%; height: 140px; overflow: hidden; position: relative; }
    .item-img img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
    
    .item-label {
      padding: 12px; font-weight: 900; font-size: 14px;
      text-transform: uppercase; text-align: center; color: #fff;
    }

    /* التاج (Badge) بأسلوب ستيكر */
    .sticker {
      position: absolute; top: -10px; right: -10px;
      background: #fff; color: #000; padding: 4px 10px;
      font-size: 10px; font-weight: 900; transform: rotate(15deg);
      box-shadow: 3px 3px 0px var(--neon-cyan);
    }

    /* ===== BOTTOM BAR (APP STYLE) ===== */
    .bottom-nav {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 400px; height: 70px;
      background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
      display: flex; align-items: center; justify-content: space-around;
      z-index: 1000;
    }
    .nav-icon { font-size: 20px; cursor: pointer; opacity: 0.5; transition: 0.3s; }
    .nav-icon.active { opacity: 1; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
  </style>
</head>

<body>
  <div class="wrapper">
    <header class="nav">
      <div class="logo-box">BAROUD</div>
      <div style="display: flex; gap: 15px;">
        <span style="font-weight: 900; color: var(--neon-cyan);">ONLINE</span>
        <span>☰</span>
      </div>
    </header>

    <div class="hero-container">
      <div class="hero-card">
        <img src="assets/banner1.jpg" onerror="this.src='https://images.unsplash.com/photo-1614680376593-902f74cf0d41?q=80&w=1000'">
        <div style="position: absolute; bottom: 20px; right: 20px; text-align: left;">
            <h1 style="font-size: 40px; line-height: 0.8; font-weight: 900;">ELITE<br><span style="color: var(--neon-cyan);">DEALS</span></h1>
        </div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" placeholder="اكتب ما تبحث عنه...">
      <span style="color: #000; font-size: 20px;">🔍</span>
    </div>

    <section class="grid">
      <div class="item" onclick="location.href='login.html'">
        <div class="sticker">BEST</div>
        <div class="item-img"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=500'"></div>
        <div class="item-label">Accounts</div>
      </div>

      <div class="item" onclick="location.href='login.html'">
        <div class="item-img"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500'"></div>
        <div class="item-label">Gaming</div>
      </div>

      <div class="item" onclick="location.href='login.html'">
        <div class="item-img"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500'"></div>
        <div class="item-label">Gift Cards</div>
      </div>

      <div class="item" onclick="location.href='login.html'">
        <div class="sticker" style="background: var(--neon-cyan);">HOT</div>
        <div class="item-img"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1614332287897-cdc485fa562d?w=500'"></div>
        <div class="item-label">Apps</div>
      </div>
    </section>

    <div style="text-align: center; margin-top: 80px; opacity: 0.1; font-weight: 900; letter-spacing: 10px;">
      BAROUDAPP.COM
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-icon active">🏠</div>
    <div class="nav-icon" onclick="location.href='wallet.html'">💳</div>
    <div class="nav-icon" onclick="location.href='orders.html'">📦</div>
    <div class="nav-icon" onclick="window.open('https://wa.me/96170385398')">💬</div>
  </nav>

  <script>
    // تأثيرات بسيطة عند التحميل
    window.onload = () => {
      document.querySelectorAll('.item').forEach((el, index) => {
        el.style.opacity = '0';
        el.style.transform += ' translateY(30px)';
        setTimeout(() => {
          el.style.transition = '0.5s ease-out';
          el.style.opacity = '1';
          el.style.transform = el.style.transform.replace('translateY(30px)', '');
        }, index * 100);
      });
    };
  </script>
</body>
</html>
