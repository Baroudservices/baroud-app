<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAROUD | Elite Digital Realm</title>
  
  <style>
    :root {
      --neon-cyan: #00f2ff;
      --deep-black: #050505;
      --card-bg: #0d0d0d;
      --border-color: #1a1a1a;
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    body { 
      background-color: var(--deep-black); 
      color: var(--text-main); 
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .wrapper { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 15px 120px; }

    /* ===== TOPBAR (REFINED) ===== */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 5px; position: sticky; top: 0; z-index: 1000;
      background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px);
    }
    .logo-box {
      font-size: 24px; font-weight: 900; letter-spacing: 2px;
      border: 2px solid #fff; padding: 4px 15px; 
      box-shadow: 4px 4px 0px var(--neon-cyan);
    }

    /* ===== HERO (SMOOTH & BOLD) ===== */
    .hero-banner {
      width: 100%; height: 200px; border-radius: 12px;
      overflow: hidden; margin: 15px 0 30px; position: relative;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
    }
    .hero-banner img { width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--deep-black), transparent);
      display: flex; align-items: flex-end; padding: 20px;
    }

    /* ===== SEARCH (SOLID SHADOW) ===== */
    .search-wrap {
      background: #fff; padding: 2px 15px; margin-bottom: 25px;
      display: flex; align-items: center; box-shadow: 6px 6px 0px var(--neon-cyan);
    }
    .search-wrap input {
      width: 100%; height: 48px; background: none; border: none;
      color: #000; font-size: 16px; font-weight: 700; outline: none;
    }

    /* ===== GRID (REFINED & RESPONSIVE) ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      position: relative; border-radius: 10px; overflow: hidden;
      transition: 0.2s; cursor: pointer; text-decoration: none;
    }
    .card:active { transform: scale(0.97); border-color: var(--neon-cyan); }

    .card-img { width: 100%; height: 130px; overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
    
    .card-title {
      padding: 12px; font-weight: 800; font-size: 13px;
      text-align: center; color: #fff; letter-spacing: 1px;
    }

    .badge {
      position: absolute; top: 10px; right: 10px;
      background: var(--neon-cyan); color: #000; padding: 3px 8px;
      font-size: 10px; font-weight: 900; border-radius: 4px; z-index: 10;
    }

    /* ===== BOTTOM BAR (APP EXPERIENCE) ===== */
    .bottom-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 400px; height: 65px;
      background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(15px);
      border: 1px solid var(--border-color); border-radius: 18px;
      display: flex; align-items: center; justify-content: space-evenly;
      z-index: 1000; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }
    .nav-link { 
      font-size: 22px; color: #666; transition: 0.3s; 
      width: 50px; text-align: center; cursor: pointer;
    }
    .nav-link.active { color: var(--neon-cyan); transform: translateY(-5px); }
  </style>
</head>

<body>
  <div class="wrapper">
    <header class="nav">
      <div class="logo-box">BAROUD</div>
      <div style="font-size: 20px; cursor: pointer;" id="menuBtn">☰</div>
    </header>

    <div class="hero-banner">
      <img src="assets/banner1.jpg" onerror="this.src='https://images.unsplash.com/photo-1614680376593-902f74cf0d41?q=80&w=1000'">
      <div class="hero-overlay">
        <h2 style="font-size: 24px; font-weight: 900;">BEST RATES IN <span style="color: var(--neon-cyan);">LEBANON</span></h2>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" placeholder="ماذا تريد أن تشتري اليوم؟">
      <span style="color: #000;">🔍</span>
    </div>

    <section class="grid">
      <a href="login.html" class="card">
        <div class="badge">POPULAR</div>
        <div class="card-img"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=500'"></div>
        <div class="card-title">ACCOUNTS</div>
      </a>

      <a href="login.html" class="card">
        <div class="card-img"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500'"></div>
        <div class="card-title">GAMING</div>
      </a>

      <a href="login.html" class="card">
        <div class="card-img"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500'"></div>
        <div class="card-title">GIFT CARDS</div>
      </a>

      <a href="login.html" class="card">
        <div class="badge" style="background: #fff;">NEW</div>
        <div class="card-img"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1614332287897-cdc485fa562d?w=500'"></div>
        <div class="card-title">PREMIUM APPS</div>
      </a>
    </section>

    <p style="text-align: center; margin-top: 60px; opacity: 0.1; font-weight: 900; letter-spacing: 5px;">BAROUDAPP.COM</p>
  </div>

  <nav class="bottom-bar">
    <div class="nav-link active">🏠</div>
    <div class="nav-link" onclick="location.href='wallet.html'">💳</div>
    <div class="nav-link" onclick="location.href='orders.html'">📦</div>
    <div class="nav-link" onclick="window.open('https://wa.me/96170385398')">💬</div>
  </nav>
</body>
</html>
