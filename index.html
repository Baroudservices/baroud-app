<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAROUD | Elite Digital Realm</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-cyan: #00f2ff;
      --deep-black: #050505;
      --card-bg: #0d0d0d;
      --border-color: #1a1a1a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    body { 
      background-color: var(--deep-black); 
      color: #fff; 
      font-family: 'Orbitron', 'Cairo', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .wrapper { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 15px 120px; }

    /* ===== TOPBAR (Clean) ===== */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 25px 5px; position: sticky; top: 0; z-index: 1000;
      background: var(--deep-black);
    }
    .logo-box {
      font-size: 26px; font-weight: 900; letter-spacing: 4px;
      border: 2px solid #fff; padding: 4px 18px; 
      box-shadow: none; /* تأكيد إزالة الخط الأزرق */
    }

    /* ===== IMPROVED SLIDER ===== */
    .slider-container {
      width: 100%; height: 210px; border-radius: 15px;
      overflow: hidden; margin: 15px 0 30px; position: relative;
      border: 1px solid var(--border-color);
    }
    .slider-track {
      display: flex; width: 300%; height: 100%;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .slide { width: 33.333%; height: 100%; position: relative; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }
    .slide::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(5,5,5,0.8), transparent);
    }

    /* ===== SEARCH (Clean) ===== */
    .search-wrap {
      background: #fff; padding: 2px 18px; margin-bottom: 25px;
      display: flex; align-items: center; 
      box-shadow: none; border-radius: 8px;
    }
    .search-wrap input {
      width: 100%; height: 50px; background: none; border: none;
      color: #000; font-size: 15px; font-weight: 700; outline: none;
      font-family: 'Orbitron', sans-serif;
    }

    /* ===== GRID ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      position: relative; border-radius: 12px; overflow: hidden;
      transition: 0.3s; cursor: pointer; text-decoration: none;
    }
    .card:active { transform: scale(0.96); border-color: var(--neon-cyan); }
    .card-img { width: 100%; height: 135px; overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { padding: 14px; font-weight: 900; font-size: 11px; text-align: center; color: #fff; letter-spacing: 1px; }

    .badge {
      position: absolute; top: 10px; right: 10px;
      background: var(--neon-cyan); color: #000; padding: 4px 10px;
      font-size: 9px; font-weight: 900; border-radius: 5px; z-index: 10;
    }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 400px; height: 65px;
      background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px);
      border: 1px solid var(--border-color); border-radius: 20px;
      display: flex; align-items: center; justify-content: space-evenly;
      z-index: 2000;
    }
    .nav-link { font-size: 22px; color: #444; transition: 0.3s; cursor: pointer; }
    .nav-link.active { color: var(--neon-cyan); }
  </style>
</head>

<body>
  <div class="wrapper">
    <header class="nav">
      <div class="logo-box">BAROUD</div>
      <div style="font-size: 22px; color: var(--neon-cyan);">☰</div>
    </header>

    <div class="slider-container">
      <div class="slider-track" id="track">
        <div class="slide"><img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x400/050505/00f2ff?text=PREMIUM+SERVICES'"></div>
        <div class="slide"><img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x400/050505/00f2ff?text=INSTANT+DELIVERY'"></div>
        <div class="slide"><img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/600x400/050505/00f2ff?text=SAFE+PAYMENTS'"></div>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" placeholder="Explore Elite Services...">
      <span style="color: #888;">🔍</span>
    </div>

    <section class="grid">
      <a href="login.html" class="card">
        <div class="badge">ELITE</div>
        <div class="card-img"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=500'"></div>
        <div class="card-title">ACCOUNTS</div>
      </a>
      <a href="login.html" class="card">
        <div class="card-img"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500'"></div>
        <div class="card-title">GAMING</div>
      </a>
      <a href="login.html" class="card">
        <div class="card-img"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500'"></div>
        <div class="card-title">GIFT CARDS</div>
      </a>
      <a href="login.html" class="card">
        <div class="badge" style="background: #fff;">NEW</div>
        <div class="card-img"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1614332287897-cdc485fa562d?w=500'"></div>
        <div class="card-title">APPS</div>
      </a>
    </section>

    <p style="text-align: center; margin-top: 60px; opacity: 0.2; font-size: 10px; letter-spacing: 5px;">BAROUDAPP.COM</p>
  </div>

  <nav class="bottom-bar">
    <div class="nav-link active">🏠</div>
    <div class="nav-link" onclick="location.href='wallet.html'">💳</div>
    <div class="nav-link" onclick="location.href='orders.html'">📦</div>
    <div class="nav-link" onclick="window.open('https://wa.me/96176452027')">💬</div>
  </nav>

  <script>
    // Slider Logic Fix
    const track = document.getElementById('track');
    let index = 0;
    
    function moveSlider() {
      index = (index + 1) % 3;
      track.style.transform = `translateX(${index * 33.333}%)`; // تم تعديل المنطق ليتناسب مع RTL
    }
    
    setInterval(moveSlider, 4000);
  </script>
</body>
</html>
