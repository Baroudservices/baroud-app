<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | The Future of Digital Services</title>
  
  <style>
    :root {
      --main-bg: #01060b;
      --accent-blue: #21a0f0;
      --glow-blue: rgba(33, 160, 240, 0.4);
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-gold: #f0c321;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { 
      background: var(--main-bg); 
      color: #fff; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* خلفية متحركة خفيفة (Ambient Light) */
    body::before {
      content: ''; position: fixed; top: -10%; left: -10%; width: 40%; height: 40%;
      background: radial-gradient(circle, var(--glow-blue) 0%, transparent 70%);
      filter: blur(80px); z-index: -1; animation: drift 15s infinite alternate;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(50%, 30%); } }

    .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 18px 100px; }

    /* ===== TOPBAR (FUTURE STYLE) ===== */
    .header {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; background: rgba(1, 6, 11, 0.7);
      backdrop-filter: blur(25px); border-bottom: 1px solid var(--border-color);
    }
    .brand-id { font-weight: 900; font-size: 22px; letter-spacing: 2px; background: linear-gradient(90deg, #fff, var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-circle {
      width: 45px; height: 45px; border-radius: 15px; 
      background: var(--card-bg); border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s;
    }
    .btn-circle:active { transform: scale(0.9) rotate(-10deg); border-color: var(--accent-blue); }

    /* ===== SLIDER (CINEMATIC) ===== */
    .hero-banner {
      width: 100%; height: 200px; border-radius: 28px;
      overflow: hidden; margin: 20px 0; position: relative;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .slides { display: flex; width: 300%; height: 100%; transition: 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .slide { width: 33.333%; height: 100%; position: relative; }
    .slide img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }
    .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, var(--main-bg) 5%, transparent 60%); }

    /* ===== SEARCH (GLOWING) ===== */
    .search-container { position: relative; margin-bottom: 25px; }
    .search-container input {
      width: 100%; height: 55px; background: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: 18px;
      padding: 0 55px 0 20px; color: #fff; font-size: 16px;
      transition: 0.4s;
    }
    .search-container input:focus { border-color: var(--accent-blue); background: rgba(33, 160, 240, 0.05); box-shadow: 0 0 20px var(--glow-blue); }
    .search-container i { position: absolute; right: 20px; top: 18px; color: var(--accent-blue); }

    /* ===== PREMIUM GRID (THE BEAST) ===== */
    .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    
    .card {
      background: var(--card-bg); border-radius: 26px; border: 1px solid var(--border-color);
      overflow: hidden; position: relative; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; flex-direction: column; height: 190px;
    }
    .card:active { transform: translateY(-5px) scale(1.02); border-color: var(--accent-blue); }

    .card-media { width: 100%; height: 140px; position: relative; overflow: hidden; }
    .card-media img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .card:hover .card-media img { transform: scale(1.1); }

    .card-info {
      padding: 12px; text-align: center; font-weight: 800;
      font-size: 14px; background: rgba(255,255,255,0.02);
      letter-spacing: 1px; text-transform: uppercase;
    }

    .status-tag {
      position: absolute; top: 12px; left: 12px;
      background: rgba(1, 6, 11, 0.6); backdrop-filter: blur(10px);
      padding: 4px 10px; border-radius: 10px; font-size: 10px;
      font-weight: 900; color: var(--accent-blue); border: 1px solid var(--accent-blue);
      z-index: 10;
    }

    /* ===== DRAWER (BLUR EFFECT) ===== */
    .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(12px); display: none; z-index: 2000; opacity: 0; transition: 0.4s; }
    .menu-overlay.active { display: block; opacity: 1; }
    
    .side-drawer {
      position: fixed; top: 0; left: -300px; width: 300px; height: 100%;
      background: rgba(1, 6, 11, 0.95); z-index: 2100; padding: 40px 25px;
      transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); border-right: 1px solid var(--border-color);
    }
    .side-drawer.active { left: 0; box-shadow: 40px 0 100px rgba(0,0,0,0.8); }

    .nav-link {
      display: flex; align-items: center; gap: 15px; padding: 18px;
      color: #888; text-decoration: none; font-weight: 700;
      border-radius: 15px; margin-bottom: 10px; transition: 0.3s;
    }
    .nav-link:active { background: var(--accent-blue); color: #fff; }

    /* Floating Baroud Footer */
    .baroud-tag { text-align: center; margin-top: 40px; font-size: 10px; color: #333; letter-spacing: 5px; font-weight: 900; }
  </style>
</head>

<body>
  <div class="menu-overlay" id="overlay"></div>
  <aside class="side-drawer" id="drawer">
    <div style="margin-bottom: 50px; border-left: 4px solid var(--accent-blue); padding-left: 15px;">
      <h2 style="font-size: 24px;">BAROUD</h2>
      <p style="font-size: 12px; color: #555;">LEBANON'S #1 STORE</p>
    </div>
    <a href="index.html" class="nav-link">🏠 DASHBOARD</a>
    <a href="login.html" class="nav-link">🔑 AUTHENTICATION</a>
    <a href="wallet.html" class="nav-link">💳 WALLET SYSTEM</a>
    <a href="https://wa.me/96170385398" class="nav-link" style="color: var(--accent-blue);">💬 LIVE SUPPORT</a>
    <div style="position: absolute; bottom: 30px; width: calc(100% - 50px);">
        <button onclick="location.href='login.html'" style="width: 100%; height: 50px; border-radius: 15px; border: none; background: #ff3e3e; color: #fff; font-weight: 900;">LOGOUT</button>
    </div>
  </aside>

  <header class="header">
    <div class="btn-circle" id="openMenu">☰</div>
    <div class="brand-id">BAROUD</div>
    <div class="btn-circle" onclick="location.href='login.html'">👤</div>
  </header>

  <main class="container">
    <div class="hero-banner">
      <div class="slides" id="slider">
        <div class="slide"><img src="assets/banner1.jpg" onerror="this.src='https://placehold.co/600x400/01060b/21a0f0?text=ELITE+GAMING'"></div>
        <div class="slide"><img src="assets/banner2.jpg" onerror="this.src='https://placehold.co/600x400/01060b/21a0f0?text=INSTANT+ACCESS'"></div>
        <div class="slide"><img src="assets/banner3.jpg" onerror="this.src='https://placehold.co/600x400/01060b/21a0f0?text=SAFE+TRADES'"></div>
      </div>
    </div>

    <div class="search-container">
      <input type="text" id="search" placeholder="Search elite services...">
      <i>🔍</i>
    </div>

    <section class="grid-layout" id="mainGrid">
      <div class="card" onclick="location.href='login.html'">
        <div class="status-tag">ACTIVE</div>
        <div class="card-media"><img src="assets/accounts.png" onerror="this.src='https://images.unsplash.com/photo-1614680376593-902f74cf0d41?q=80&w=500'"></div>
        <div class="card-info">Accounts</div>
      </div>

      <div class="card" onclick="location.href='login.html'">
        <div class="status-tag" style="color: #f0a021; border-color: #f0a021;">TRENDING</div>
        <div class="card-media"><img src="assets/games.png" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=500'"></div>
        <div class="card-info">Games</div>
      </div>

      <div class="card" onclick="location.href='login.html'">
        <div class="card-media"><img src="assets/giftcards.png" onerror="this.src='https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=500'"></div>
        <div class="card-info">Gift Cards</div>
      </div>

      <div class="card" onclick="location.href='login.html'">
        <div class="card-media"><img src="assets/apps.png" onerror="this.src='https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=500'"></div>
        <div class="card-info">Premium Apps</div>
      </div>
    </section>

    <div class="baroud-tag">BAROUDAPP.COM</div>
  </main>

  <script>
    // Menu Control
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    document.getElementById('openMenu').onclick = () => { drawer.classList.add('active'); overlay.classList.add('active'); };
    overlay.onclick = () => { drawer.classList.remove('active'); overlay.classList.remove('active'); };

    // Slider Logic
    let step = 0;
    setInterval(() => {
      step = (step + 1) % 3;
      document.getElementById('slider').style.transform = `translateX(-${step * 33.333}%)`;
    }, 5000);

    // Filter Logic
    document.getElementById('search').oninput = (e) => {
      const v = e.target.value.toLowerCase();
      document.querySelectorAll('.card').forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(v) ? 'flex' : 'none';
      });
    };
  </script>
</body>
</html>
