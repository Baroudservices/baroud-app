<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroud Lucky Box | Unbox & Win</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --gold: #fbbf24; --elite: #a855f7; --bg: #020617; }
        body { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh; }
        .user-stats { display: flex; justify-content: flex-end; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .balance-card { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); padding: 10px 25px; border-radius: 50px; display: flex; align-items: center; gap: 10px; }
        .balance-amount { font-weight: 900; font-size: 1.2rem; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; text-align: center; }
        .lucky-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; }
        .lucky-box-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 50px 20px; backdrop-filter: blur(10px); }
        .btn-open { margin-top: 25px; width: 100%; padding: 16px; border-radius: 15px; border: none; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; font-weight: 900; cursor: pointer; }
        #openingEffect, #prizeModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div class="user-stats">
        <div class="balance-card">
            <span>BALANCE:</span>
            <div id="userBalance" class="balance-amount">Syncing...</div>
        </div>
    </div>

    <div class="container">
        <h1>BAROUD BOXES</h1>
        <div class="lucky-grid">
            <div class="lucky-box-card">📦 <h2>BRONZE</h2> <button class="btn-open" onclick="startOpening('BRONZE')">Open</button></div>
            <div class="lucky-box-card" style="border-color: var(--gold);">🎁 <h2 style="color: var(--gold);">GOLDEN</h2> <button class="btn-open" onclick="startOpening('GOLDEN')" style="background: var(--gold); color: black;">Open</button></div>
            <div class="lucky-box-card" style="border-color: var(--elite);">💎 <h2 style="color: var(--elite);">ELITE</h2> <button class="btn-open" onclick="startOpening('ELITE')" style="background: var(--elite);">Open</button></div>
        </div>
    </div>

    <div id="openingEffect"><h2>UNBOXING...</h2></div>
    <div id="prizeModal"><div style="text-align:center;"><h2>WINNER!</h2><div id="prizeResult" style="font-size:3rem; color:var(--gold); font-weight:900;"></div><button class="btn-open" onclick="location.reload()">CLAIM</button></div></div>

    <script>
        const SUPABASE_URL = 'https://atjicwulicpckfghzojr.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxcndpdG9sb25oZmJmd3RzbmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NjQyNTcsImV4cCI6MjA4MzA0MDI1N30.N-OqDDDOz1wJnKfmOFAtwlH00m_oJvUKEQvbygVeujQ';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        async function initAuth() {
            // محاولة جلب الجلسة العادية
            let { data: { session } } = await _supabase.auth.getSession();

            // إذا ما لقى جلسة، منجرب نقرأ الـ Token من الرابط (إذا بعتناه من الموقع الأساسي)
            if (!session) {
                const params = new URLSearchParams(window.location.search);
                const accessToken = params.get('access_token');
                if (accessToken) {
                    await _supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: params.get('refresh_token')
                    });
                    // تنظيف الرابط بعد السحب
                    window.history.replaceState({}, document.title, "/Baroud.html");
                }
            }
            
            checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                const { data: bal } = await _supabase.rpc('get_my_balance');
                document.getElementById('userBalance').innerText = `$${parseFloat(bal || 0).toFixed(2)}`;
            } else {
                document.getElementById('userBalance').innerText = "Login Needed";
                alert("Please go back to baroudapp.com and login again.");
            }
        }

        async function startOpening(boxType) {
            const { data: prizes } = await _supabase.from('box_prizes').select('*').eq('box_type', boxType);
            if (!prizes || prizes.length === 0) { alert("Add prizes to Supabase table first!"); return; }

            document.getElementById('openingEffect').style.display = 'flex';
            setTimeout(async () => {
                const win = prizes[Math.floor(Math.random() * prizes.length)];
                await _supabase.rpc('win_lucky_box_credit', { amount_to_add: win.prize_value });
                document.getElementById('openingEffect').style.display = 'none';
                document.getElementById('prizeResult').innerText = win.prize_name;
                document.getElementById('prizeModal').style.display = 'flex';
            }, 2000);
        }

        window.onload = initAuth;
    </script>
</body>
</html>
