<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroud Boxes | Secure Access</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg: #020617; }
        body { background: #020617; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; text-align: center; }
        
        /* تصميم واجهة الدخول إذا لم يتم التعرف على المستخدم */
        #loginOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020617; z-index: 10000; align-items: center; justify-content: center; }
        .login-box { background: rgba(30, 41, 59, 0.7); padding: 40px; border-radius: 20px; border: 1px solid var(--primary); width: 90%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f172a; color: white; box-sizing: border-box; }
        
        .user-stats { display: flex; justify-content: flex-end; padding: 20px; }
        .balance-card { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); padding: 10px 20px; border-radius: 50px; }
        .lucky-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .box-card { background: rgba(30, 41, 59, 0.5); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; margin-top: 10px; }
        #openingEffect { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Baroud Login</h2>
            <p>Please enter your BaroudApp credentials to access boxes</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="handleLogin()">Login to Boxes</button>
            <p id="loginError" style="color: red; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div class="user-stats">
        <div class="balance-card">BALANCE: <span id="userBalance" style="color: var(--primary); font-weight: 900;">$0.00</span></div>
    </div>

    <h1>BAROUD LUCKY BOXES</h1>

    <div class="lucky-grid">
        <div class="box-card">📦 <h3>BRONZE</h3> <button class="btn" onclick="openBox('BRONZE')">OPEN</button></div>
        <div class="box-card">🎁 <h3>GOLDEN</h3> <button class="btn" onclick="openBox('GOLDEN')">OPEN</button></div>
        <div class="box-card">💎 <h3>ELITE</h3> <button class="btn" onclick="openBox('ELITE')">OPEN</button></div>
    </div>

    <div id="openingEffect"><h2>UNBOXING...</h2></div>

    <script>
        const SUPABASE_URL = 'https://atjicwulicpckfghzojr.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxcndpdG9sb25oZmJmd3RzbmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NjQyNTcsImV4cCI6MjA4MzA0MDI1N30.N-OqDDDOz1wJnKfmOFAtwlH00m_oJvUKEQvbygVeujQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. فحص الدخول عند فتح الصفحة
        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                document.getElementById('loginOverlay').style.display = 'none';
                updateBalance();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        }

        // 2. معالجة الدخول اليدوي
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('loginError').innerText = error.message;
            } else {
                location.reload(); // إعادة تحميل الصفحة لتفعيل الجلسة
            }
        }

        async function updateBalance() {
            const { data } = await _supabase.rpc('get_my_balance');
            document.getElementById('userBalance').innerText = `$${parseFloat(data || 0).toFixed(2)}`;
        }

        async function openBox(type) {
            const { data: prizes } = await _supabase.from('box_prizes').select('*').eq('box_type', type);
            if (!prizes || prizes.length === 0) { alert("Check table 'box_prizes' - it's empty!"); return; }

            document.getElementById('openingEffect').style.display = 'flex';
            setTimeout(async () => {
                const win = prizes[Math.floor(Math.random() * prizes.length)];
                await _supabase.rpc('win_lucky_box_credit', { amount_to_add: win.prize_value });
                alert("You Won: " + win.prize_name);
                location.reload();
            }, 2000);
        }

        window.onload = checkUser;
    </script>
</body>
</html>
