<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroud Boxes | Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg: #020617; }
        body { background: #020617; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; text-align: center; }
        .user-stats { display: flex; justify-content: flex-end; padding: 20px; }
        .balance-card { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); padding: 10px 20px; border-radius: 50px; font-weight: 900; }
        .btn { padding: 15px 30px; border-radius: 12px; border: none; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; margin-top: 20px; text-decoration: none; display: inline-block; }
        #mainContent { display: none; }
        #syncStatus { padding: 50px; }
    </style>
</head>
<body>

    <div id="syncStatus">
        <h2>جاري التحقق من الحساب...</h2>
        <p>إذا لم يتم تحويلك خلال ثوانٍ، اضغط على الزر أدناه</p>
        <a href="https://baroudapp.com" class="btn">العودة لتسجيل الدخول</a>
    </div>

    <div id="mainContent">
        <div class="user-stats">
            <div class="balance-card">BALANCE: <span id="userBalance">$0.00</span></div>
        </div>
        <h1>BAROUD BOXES</h1>
        <div style="padding: 20px;">
            <button class="btn" onclick="openBox('BRONZE')">OPEN BRONZE</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://atjicwulicpckfghzojr.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxcndpdG9sb25oZmJmd3RzbmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NjQyNTcsImV4cCI6MjA4MzA0MDI1N30.N-OqDDDOz1wJnKfmOFAtwlH00m_oJvUKEQvbygVeujQ';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true // هيدي أهم وحدة عشان يلقط الدخول من الرابط
            }
        });

        async function init() {
            // محاولة جلب الجلسة من الرابط أو التخزين
            const { data: { session }, error } = await _supabase.auth.getSession();
            
            if (session) {
                document.getElementById('syncStatus').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                updateBalance();
            } else {
                // إذا مش مسجل دخول، منبعته يسجل دخول ويرجع أوتوماتيك
                console.log("No session found, redirecting...");
                setTimeout(() => {
                    if (!session) window.location.href = "https://baroudapp.com";
                }, 3000);
            }
        }

        async function updateBalance() {
            const { data } = await _supabase.rpc('get_my_balance');
            document.getElementById('userBalance').innerText = `$${parseFloat(data || 0).toFixed(2)}`;
        }

        window.onload = init;
    </script>
</body>
</html>
