<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroud Lucky Box | Exclusive Prizes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8; --gold: #fbbf24; --elite: #a855f7;
            --bg: #020617; --card-bg: rgba(30, 41, 59, 0.5);
        }

        body {
            background-color: var(--bg);
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff; font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh;
        }

        /* Prize Ticker */
        .prize-ticker {
            background: rgba(56, 189, 248, 0.1); padding: 12px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); overflow: hidden;
        }
        .ticker-wrap { display: flex; gap: 60px; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ticker-item { white-space: nowrap; font-size: 0.85rem; color: #cbd5e1; }
        .ticker-item b { color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        header h1 { font-size: 3.5rem; letter-spacing: 5px; margin-bottom: 10px; text-shadow: 0 0 20px var(--primary); }

        .lucky-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 50px; }

        .lucky-box-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 50px 20px; transition: 0.4s; backdrop-filter: blur(12px);
        }
        .lucky-box-card:hover { transform: translateY(-10px); border-color: var(--primary); }
        .box-icon { font-size: 80px; margin-bottom: 20px; display: block; filter: drop-shadow(0 0 10px var(--primary)); }

        .btn-open {
            margin-top: 30px; width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
        }

        /* --- Animation Effect Overlay --- */
        #openingEffect {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center;
        }
        .rolling-box {
            font-size: 100px; animation: shake 0.5s infinite, glow 1.5s infinite;
        }
        @keyframes shake {
            0% { transform: rotate(0deg); } 25% { transform: rotate(5deg); }
            50% { transform: rotate(0deg); } 75% { transform: rotate(-5deg); }
        }
        @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 20px var(--primary)); } 50% { filter: drop-shadow(0 0 50px var(--primary)); } }

        /* Win Modal */
        #prizeModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center;
        }
        .prize-glow { font-size: 3.5rem; color: var(--gold); text-shadow: 0 0 40px var(--gold); font-weight: 900; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="prize-ticker">
        <div class="ticker-wrap">
            <div class="ticker-item">🔥 WIN: <b>TikTok 5000 Coins</b></div>
            <div class="ticker-item">💎 WIN: <b>$100 Store Credit</b></div>
            <div class="ticker-item">🎮 WIN: <b>PUBG 660 UC</b></div>
            <div class="ticker-item">💸 WIN: <b>$50 Whish Money</b></div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>BAROUD BOXES</h1>
            <p>Select a box and unlock your prize instantly!</p>
        </header>

        <div class="lucky-grid">
            <div class="lucky-box-card">
                <span class="box-icon">📦</span>
                <h2>BRONZE</h2>
                <div style="font-weight: bold; color: var(--primary);">$2.00</div>
                <button class="btn-open" onclick="startOpening('BRONZE')">Open Box</button>
            </div>
            <div class="lucky-box-card" style="border-color: var(--gold);">
                <span class="box-icon">🎁</span>
                <h2 style="color: var(--gold);">GOLDEN</h2>
                <div style="font-weight: bold; color: var(--gold);">$10.00</div>
                <button class="btn-open" onclick="startOpening('GOLDEN')" style="background: linear-gradient(135deg, #d97706, #fbbf24);">Open Box</button>
            </div>
        </div>
    </div>

    <div id="openingEffect">
        <div class="rolling-box">🎁</div>
        <h2 style="position: absolute; bottom: 30%; letter-spacing: 5px;">UNBOXING...</h2>
    </div>

    <div id="prizeModal">
        <div style="text-align: center;">
            <h2 style="opacity: 0.7;">CONGRATULATIONS!</h2>
            <div id="prizeResult" class="prize-glow"></div>
            <p>The prize has been added to your balance.</p>
            <button class="btn-open" style="width: auto; padding: 10px 50px;" onclick="location.reload()">Claim & Finish</button>
        </div>
    </div>

    <script>
        // 1. هون بتحط جوائزك أنت بالظبط
        const prizeList = {
            'BRONZE': [
                { name: '$1.00 Credit', value: 1.00 },
                { name: '$0.50 Credit', value: 0.50 },
                { name: '100 TikTok Coins', value: 0 }, // القيمة 0 إذا مش رصيد مباشر
                { name: '$2.00 Credit', value: 2.00 }
            ],
            'GOLDEN': [
                { name: '$15.00 Credit', value: 15.00 },
                { name: '$50.00 Credit', value: 50.00 },
                { name: 'PUBG 660 UC', value: 0 },
                { name: '$10.00 Credit', value: 10.00 }
            ]
        };

        function startOpening(boxType) {
            document.getElementById('openingEffect').style.display = 'flex';
            
            // محاكاة وقت "الحماس" 2.5 ثانية
            setTimeout(() => {
                document.getElementById('openingEffect').style.display = 'none';
                revealPrize(boxType);
            }, 2500);
        }

        function revealPrize(boxType) {
            const prizes = prizeList[boxType];
            const win = prizes[Math.floor(Math.random() * prizes.length)];

            document.getElementById('prizeResult').innerText = win.name;
            document.getElementById('prizeModal').style.display = 'flex';

            // 2. هون الـ Logic لزيادة الرصيد فوراً
            if (win.value > 0) {
                updateUserBalance(win.value);
            }
        }

        // 3. دالة زيادة الرصيد (الربط مع السيرفر)
        function updateUserBalance(amount) {
            console.log("Sending to Server: Add " + amount + " to User ID");
            
            /* ملاحظة يا حسين: هون لازم تستخدم fetch وتبعتها لملف PHP أو API عندك بالسيرفر.
            مثال:
            fetch('update_balance.php', {
                method: 'POST',
                body: JSON.stringify({ addAmount: amount })
            });
            */
        }
    </script>
</body>
</html>
