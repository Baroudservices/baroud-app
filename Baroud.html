<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroud Lucky Box | Secure System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --gold: #fbbf24; --bg: #020617; }
        body { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 1000px; width: 90%; text-align: center; }
        .lucky-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
        .box-card { background: rgba(30, 41, 59, 0.4); border: 2px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px 20px; transition: 0.3s; cursor: pointer; }
        .box-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2); }
        .box-icon { font-size: 70px; display: block; margin-bottom: 15px; }
        .btn-open { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        #prizeModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: #0f172a; padding: 40px; border-radius: 40px; border: 2px solid var(--gold); text-align: center; max-width: 400px; width: 90%; }
        .redeem-btn { background: #25D366; color: white; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-weight: 900; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="font-size: 3rem; text-shadow: 0 0 20px var(--primary);">BAROUD BOXES</h1>
        <p style="opacity: 0.7;">Open a box and claim your reward instantly!</p>

        <div class="lucky-grid">
            <div class="box-card" onclick="startProcess('BRONZE')">
                <span class="box-icon">📦</span>
                <h2>BRONZE</h2>
                <button class="btn-open">Open</button>
            </div>
            <div class="box-card" style="border-color: var(--gold);" onclick="startProcess('GOLDEN')">
                <span class="box-icon">🎁</span>
                <h2 style="color: var(--gold);">GOLDEN</h2>
                <button class="btn-open" style="background: var(--gold);">Open</button>
            </div>
            <div class="box-card" onclick="startProcess('ELITE')">
                <span class="box-icon">💎</span>
                <h2>ELITE</h2>
                <button class="btn-open">Open</button>
            </div>
        </div>
    </div>

    <div id="prizeModal">
        <div class="modal-content">
            <h2 style="opacity: 0.6;">CONGRATS!</h2>
            <div id="prizeName" style="font-size: 2.5rem; color: var(--gold); font-weight: 900; margin: 20px 0;">...</div>
            <p style="font-size: 0.8rem; opacity: 0.8;">Click below to redeem. Your win is being secured in our database...</p>
            <a href="#" id="waBtn" class="redeem-btn">REDEEM ON WHATSAPP</a>
        </div>
    </div>

    <script>
        const SB_URL = 'https://atjicwulicpckfghzojr.supabase.co';
        const SB_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxcndpdG9sb25oZmJmd3RzbmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NjQyNTcsImV4cCI6MjA4MzA0MDI1N30.N-OqDDDOz1wJnKfmOFAtwlH00m_oJvUKEQvbygVeujQ';
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        const MY_WHATSAPP = "96170385398";
        const SECRET_SALT = "BAROUD_X_2026"; // كلمة سر للتوثيق

        const prizesData = {
            'BRONZE': ['10 Points', 'Free Wallpaper', 'Try Again'],
            'GOLDEN': ['100 Points', '$2 Credit', 'Mystery Gift'],
            'ELITE': ['500 Points', '$10 Credit', 'Baroud Premium']
        };

        async function startProcess(boxType) {
            const list = prizesData[boxType];
            const win = list[Math.floor(Math.random() * list.length)];
            
            const now = new Date();
            const time = now.toLocaleTimeString();
            // إنشاء كود حماية فريد
            const secureKey = btoa(win + SECRET_SALT + time).substring(0, 8).toUpperCase();

            // 1. تسجيل الربح في الداتابيز للتوثيق (خلف الكواليس)
            const { error } = await _sb.from('wins_history').insert([
                { prize_name: win, box_type: boxType, win_time: time, security_key: secureKey }
            ]);

            if (error) {
                console.error("Sync Error:", error.message);
            }

            // 2. إظهار النتيجة للزبون
            document.getElementById('prizeName').innerText = win;
            
            const msg = `*NEW WIN VERIFIED*%0A` +
                        `--------------------------%0A` +
                        `🏆 Prize: *${win}*%0A` +
                        `📦 Box: ${boxType}%0A` +
                        `⏰ Time: ${time}%0A` +
                        `🔑 Security Key: *${secureKey}*%0A` +
                        `--------------------------%0A` +
                        `Please verify from your dashboard!`;

            document.getElementById('waBtn').href = `https://wa.me/${MY_WHATSAPP}?text=${msg}`;
            document.getElementById('prizeModal').style.display = 'flex';
        }
    </script>
</body>
</html>
