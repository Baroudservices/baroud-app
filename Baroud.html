<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroud Lucky Box | Unbox & Win</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8; --gold: #fbbf24; --elite: #a855f7;
            --bg: #020617; --card-bg: rgba(30, 41, 59, 0.5);
        }
        body {
            background-color: var(--bg);
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff; font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh;
        }
        .user-stats { display: flex; justify-content: flex-end; padding: 20px; max-width: 1200px; margin: 0 auto; gap: 10px; }
        .balance-card {
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary);
            padding: 10px 25px; border-radius: 50px; display: flex; align-items: center; gap: 10px;
        }
        .balance-amount { font-weight: 900; font-size: 1.2rem; color: var(--primary); }
        .btn-refresh {
            background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-size: 0.8rem;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; text-align: center; }
        header h1 { font-size: 3rem; letter-spacing: 5px; margin: 0; text-shadow: 0 0 20px var(--primary); }
        .lucky-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .lucky-box-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 40px 20px; transition: 0.4s ease; backdrop-filter: blur(12px);
        }
        .box-icon { font-size: 70px; margin-bottom: 15px; display: block; }
        .btn-open {
            margin-top: 20px; width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; font-weight: 900; cursor: pointer;
        }
        #openingEffect {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; flex-direction: column;
        }
        .rolling-box { font-size: 100px; animation: shake 0.4s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } }
        #prizeModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center;
        }
        .modal-content { text-align: center; padding: 40px; background: #0f172a; border-radius: 30px; border: 2px solid var(--gold); }
        .prize-glow { font-size: 2.5rem; color: var(--gold); text-shadow: 0 0 20px var(--gold); font-weight: 900; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="user-stats">
        <button id="refreshBtn" class="btn-refresh" style="display: none;" onclick="location.reload()">Refresh Session</button>
        <div class="balance-card">
            <span id="userStatus">BALANCE:</span>
            <div id="userBalance" class="balance-amount">Checking...</div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>BAROUD BOXES</h1>
            <p>Unbox your luck directly on the web!</p>
        </header>

        <div class="lucky-grid">
            <div class="lucky-box-card">
                <span class="box-icon">📦</span>
                <h2>BRONZE</h2>
                <button class="btn-open" onclick="startOpening('BRONZE')">Open Box</button>
            </div>
            <div class="lucky-box-card" style="border-color: var(--gold);">
                <span class="box-icon">🎁</span>
                <h2 style="color: var(--gold);">GOLDEN</h2>
                <button class="btn-open" onclick="startOpening('GOLDEN')" style="background: var(--gold); color: black;">Open Box</button>
            </div>
            <div class="lucky-box-card" style="border-color: var(--elite);">
                <span class="box-icon">💎</span>
                <h2 style="color: var(--elite);">ELITE</h2>
                <button class="btn-open" onclick="startOpening('ELITE')" style="background: var(--elite);">Open Box</button>
            </div>
        </div>
    </div>

    <div id="openingEffect">
        <div class="rolling-box">🎁</div>
        <h2 style="color: var(--primary); margin-top: 20px;">UNBOXING...</h2>
    </div>

    <div id="prizeModal">
        <div class="modal-content">
            <h2>YOU WON!</h2>
            <div id="prizeResult" class="prize-glow"></div>
            <button class="btn-open" style="width: auto; padding: 10px 40px;" onclick="closeModal()">Claim Prize</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://atjicwulicpckfghzojr.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxcndpdG9sb25oZmJmd3RzbmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NjQyNTcsImV4cCI6MjA4MzA0MDI1N30.N-OqDDDOz1wJnKfmOFAtwlH00m_oJvUKEQvbygVeujQ';
        
        // إعداد العميل مع ذاكرة تخزين قوية
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                flowType: 'pkce'
            }
        });

        let prizeList = { 'BRONZE': [], 'GOLDEN': [], 'ELITE': [] };

        async function fetchUserBalance() {
            const { data, error } = await _supabase.rpc('get_my_balance');
            if (error) {
                console.error("Balance Error:", error.message);
                document.getElementById('userBalance').innerText = "Error";
                document.getElementById('refreshBtn').style.display = "block";
            } else {
                document.getElementById('userBalance').innerText = `$${parseFloat(data || 0).toFixed(2)}`;
                document.getElementById('refreshBtn').style.display = "none";
            }
        }

        async function syncPrizes() {
            try {
                const { data } = await _supabase.from('box_prizes').select('*');
                if (data) {
                    prizeList = { 'BRONZE': [], 'GOLDEN': [], 'ELITE': [] };
                    data.forEach(p => {
                        if(prizeList[p.box_type]) {
                            prizeList[p.box_type].push({ name: p.prize_name, value: p.prize_value });
                        }
                    });
                }
            } catch (e) {
                console.log("Prizes not loaded yet");
            }
        }

        async function startOpening(boxType) {
            // فحص الجلسة يدوياً قبل الفتح
            const { data: { user } } = await _supabase.auth.getUser();
            
            if (!user) {
                alert("Session expired or not found. Please log in to baroudapp.com again.");
                return;
            }

            if (prizeList[boxType].length === 0) await syncPrizes();
            if (prizeList[boxType].length === 0) {
                alert("Box is empty! Syncing...");
                await syncPrizes();
                return;
            }
            
            document.getElementById('openingEffect').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('openingEffect').style.display = 'none';
                revealPrize(boxType);
            }, 2000);
        }

        async function revealPrize(boxType) {
            const prizes = prizeList[boxType];
            const win = prizes[Math.floor(Math.random() * prizes.length)];

            document.getElementById('prizeResult').innerText = win.name;
            document.getElementById('prizeModal').style.display = 'flex';

            if (win.value > 0) {
                const { error } = await _supabase.rpc('win_lucky_box_credit', { 
                    amount_to_add: win.value 
                });
                if (!error) setTimeout(fetchUserBalance, 800);
            }
        }

        function closeModal() { document.getElementById('prizeModal').style.display = 'none'; }

        // الانتظار قليلاً ليتعرف المتصفح على الجلسة
        window.onload = async () => {
            setTimeout(async () => {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    fetchUserBalance();
                } else {
                    document.getElementById('userBalance').innerText = "Login Needed";
                    document.getElementById('refreshBtn').style.display = "block";
                }
                syncPrizes();
            }, 1000);
        };
    </script>
</body>
</html>
