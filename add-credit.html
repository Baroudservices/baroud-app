<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Add Credit</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark);
      color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 25px 20px; }

    /* ===== TOP HEADER ===== */
    .top { display: flex; align-items: center; margin-bottom: 30px; }
    .back-btn {
      width: 45px; height: 45px; border-radius: 15px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; transition: 0.3s;
    }
    .back-btn:active { transform: scale(0.9); background: var(--neon-cyan); color: #000; }

    h1 {
      font-size: 24px; font-weight: 900; margin: 0 0 25px;
      letter-spacing: 1px; text-transform: uppercase;
    }

    /* ===== PAYMENT GRID ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .tile {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 24px; overflow: hidden;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer; position: relative;
    }
    .tile:active { transform: scale(0.95); border-color: var(--neon-cyan); }

    .tile img {
      width: 100%; height: 120px; object-fit: cover;
      display: block; filter: brightness(0.9);
    }

    .label {
      padding: 12px; text-align: center; font-weight: 700;
      font-size: 13px; font-family: 'Cairo'; opacity: 0.9;
    }

    /* Automatic Badge */
    .auto-badge {
      position: absolute; top: 10px; right: 10px;
      background: var(--neon-cyan); color: #000;
      font-size: 8px; font-weight: 900; padding: 4px 8px;
      border-radius: 6px; box-shadow: 0 0 10px rgba(0,242,255,0.4);
    }

    .footer {
      margin-top: 50px; text-align: center;
      opacity: 0.2; font-size: 10px; letter-spacing: 4px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="back-btn" onclick="location.href='services.html'">←</div>
    </div>

    <h1>Add Credit</h1>

    <section class="grid">
      <div class="tile" onclick="location.href='wish.html'">
        <img src="assets/wish.png" alt="Whish Money"/>
        <div class="label">Whish Money</div>
      </div>

      <div class="tile" onclick="location.href='binance.html'">
        <img src="assets/binance.png" alt="Binance"/>
        <div class="label">Binance Pay</div>
      </div>

      <div class="tile" onclick="location.href='usdt-bep20.html'">
        <div class="auto-badge">AUTO</div>
        <img src="assets/usdt.jpg" alt="USDT"/>
        <div class="label">USDT (BEP20)</div>
      </div>

      <div class="tile" onclick="location.href='usdt-trc20.html'">
        <img src="assets/usdt.jpg" alt="USDT"/>
        <div class="label">USDT (TRC20)</div>
      </div>
    </section>

    <div class="footer">BAROUD SERVICES © 2026</div>
  </div>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // التحقق من الجلسة فوراً
    async function checkAuth() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (error || !data.session) {
          location.replace("login.html?reason=session_expired&t=" + Date.now());
        }
      } catch (e) {
        location.replace("login.html");
      }
    }

    checkAuth();
  </script>
  <script src="app-ui.js?v=4"></script>
</body>
</html>
