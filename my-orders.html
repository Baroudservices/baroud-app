<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | My Orders</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-blue: #38bdf8;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .back-btn {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 18px; margin-bottom: 15px;
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
    .order-title { font-weight: 900; font-size: 15px; color: var(--neon-blue); text-transform: uppercase; line-height: 1.2; max-width: 70%; }
    .order-date { font-size: 10px; opacity: 0.5; font-family: 'Cairo'; margin-top: 4px; }
    .order-price { font-weight: 900; font-size: 18px; }

    .status-row { display: flex; gap: 8px; margin-bottom: 15px; }
    .status-badge {
      font-size: 9px; font-weight: 900; padding: 5px 10px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
    }
    .status-badge.done { color: #22c55e; border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.1); }
    .status-badge.pending { color: #fbbf24; border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.1); }
    .status-badge.fail { color: #ef4444; border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); }

    .details-box {
      background: rgba(0,0,0,0.3); border-radius: 15px; padding: 12px;
      margin-bottom: 15px; border: 1px solid var(--glass-border);
    }
    .detail-item { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; font-family: 'Cairo'; }
    .detail-item:last-child { margin-bottom: 0; }
    .detail-label { opacity: 0.6; }
    .detail-value { font-weight: 700; color: #fff; text-align: right; word-break: break-all; margin-left: 10px; }

    .reply-area {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 12px; border-top: 1px solid var(--glass-border);
    }
    .reply-btn {
      background: var(--neon-blue); color: #000; border: none;
      padding: 8px 16px; border-radius: 10px; font-weight: 900; font-size: 11px; cursor: pointer;
    }
    .no-reply { font-size: 11px; opacity: 0.4; font-family: 'Cairo'; }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: #0f172a; border: 1px solid var(--neon-blue);
      border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; text-align: center;
    }
    .modal-text { font-family: 'Cairo'; font-size: 14px; line-height: 1.6; margin: 20px 0; color: #fff; }
    .close-btn { background: var(--glass); border: 1px solid var(--glass-border); color: #fff; padding: 10px 30px; border-radius: 12px; cursor: pointer; }

    .empty-state { text-align: center; padding: 80px 20px; opacity: 0.5; font-family: 'Cairo'; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <div class="back-btn" onclick="location.href='services.html'">←</div>
      <div style="font-weight: 900; letter-spacing: 2px;">MY ORDERS</div>
      <div style="width: 42px;"></div>
    </div>
    <div id="ordersList"></div>
  </div>

  <div class="modal" id="replyModal">
    <div class="modal-content">
      <div style="font-weight: 900; color: var(--neon-blue);">ADMIN MESSAGE</div>
      <div class="modal-text" id="modalText"></div>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadOrders() {
    const list = document.getElementById("ordersList");
    const { data: { session } } = await sb.auth.getSession();
    
    if (!session) { location.replace('login.html'); return; }

    // 1. جلب الطلبات أولاً لضمان عمل الصفحة
    const { data: orders, error } = await sb
      .from('orders')
      .select('*')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    if (error) {
      list.innerHTML = `<div class="empty-state">Error loading orders.</div>`;
      return;
    }

    if (!orders || orders.length === 0) {
      list.innerHTML = `<div class="empty-state">No orders found.</div>`;
      return;
    }

    // 2. جلب خريطة المنتجات لربط الـ ID بالاسم
    const { data: products } = await sb.from('products').select('id, title');
    const productMap = {};
    if (products) {
      products.forEach(p => productMap[p.id] = p.title);
    }

    list.innerHTML = orders.map(o => {
      const statusClass = (o.delivery_status === 'done') ? 'done' : (o.delivery_status === 'rejected' ? 'fail' : 'pending');
      const payClass = (o.status === 'paid') ? 'done' : 'pending';
      const hasReply = o.admin_reply && o.admin_reply.trim() !== "";
      
      // تحديد الاسم: الأولوية لجدول المنتجات، ثم الحقول الاحتياطية
      const orderTitle = productMap[o.product_id] || o.product_title || o.title || 'Service Order';

      return `
        <div class="card">
          <div class="card-top">
            <div>
              <div class="order-title">${orderTitle}</div>
              <div class="order-date">${new Date(o.created_at).toLocaleString('en-GB')}</div>
            </div>
            <div class="order-price">$${Number(o.price || 0).toFixed(2)}</div>
          </div>

          <div class="status-row">
            <div class="status-badge ${payClass}">PAY: ${o.status.toUpperCase()}</div>
            <div class="status-badge ${statusClass}">DELIVERY: ${o.delivery_status.toUpperCase()}</div>
          </div>

          <div class="details-box">
             ${o.player_id ? `<div class="detail-item"><span class="detail-label">ID:</span><span class="detail-value">${o.player_id}</span></div>` : ''}
             ${o.player_name ? `<div class="detail-item"><span class="detail-label">Name:</span><span class="detail-value">${o.player_name}</span></div>` : ''}
             ${o.account_email ? `<div class="detail-item"><span class="detail-label">Email:</span><span class="detail-value">${o.account_email}</span></div>` : ''}
             ${o.account_password ? `<div class="detail-item"><span class="detail-label">Password:</span><span class="detail-value">${o.account_password}</span></div>` : ''}
             ${o.plan_label ? `<div class="detail-item"><span class="detail-label">Plan:</span><span class="detail-value">${o.plan_label}</span></div>` : ''}
             ${o.region ? `<div class="detail-item"><span class="detail-label">Region:</span><span class="detail-value">${o.region}</span></div>` : ''}
             ${o.notes ? `<div class="detail-item"><span class="detail-label">Notes:</span><span class="detail-value">${o.notes}</span></div>` : ''}
             ${o.phone_number ? `<div class="detail-item"><span class="detail-label">Phone:</span><span class="detail-value">${o.phone_number}</span></div>` : ''}
          </div>

          <div class="reply-area">
            <span class="no-reply">${hasReply ? 'Admin Replied' : 'Processing...'}</span>
            ${hasReply ? `<button class="reply-btn" onclick="openModal('${o.admin_reply.replace(/'/g, "\\'")}')">VIEW REPLY</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function openModal(text) {
    document.getElementById('modalText').innerText = text;
    document.getElementById('replyModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('replyModal').style.display = 'none';
  }

  loadOrders();
</script>
</body>
</html>
