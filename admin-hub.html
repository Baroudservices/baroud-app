<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Hub - Baroud</title>
<style>
:root {
  --primary: #38bdf8;
  --accent: #0aa0ff;
  --bg: #060b16;
  --card-bg: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.12);
}

body {
  margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(circle at top, #0a1330 0%, #060b16 100%);
  color: #fff; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; 
  padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
  overflow: hidden;
}

.hub-card {
  width: 100%; max-width: 420px;
  background: var(--card-bg);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid var(--border);
  border-radius: 32px; padding: 35px 25px; text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 { margin: 0 0 10px 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.small { opacity: 0.5; font-size: 14px; margin-bottom: 30px; display: block; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

.nav-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 22px 10px; border-radius: 20px;
  cursor: pointer; transition: all 0.3s ease;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}

.nav-item i { font-size: 24px; margin-bottom: 4px; }
.nav-item:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.1); }
.nav-item:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.08); }

.logout-btn {
  margin-top: 30px; width: 100%; padding: 16px;
  border-radius: 18px; border: 1px solid rgba(239, 68, 68, 0.2);
  background: rgba(239, 68, 68, 0.05); color: #ef4444;
  font-weight: 700; cursor: pointer; transition: 0.3s;
}
.logout-btn:hover { background: rgba(239, 68, 68, 0.15); }

#loginBox input {
  width: 100%; padding: 16px; margin-bottom: 20px;
  border-radius: 16px; border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.2); color: #fff; text-align: center; 
  font-size: 18px; outline: none; transition: 0.3s;
}
#loginBox input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }

.login-btn {
  width: 100%; padding: 16px; border-radius: 16px; border: 0;
  background: linear-gradient(135deg, #0aa0ff, #4f46e5);
  color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
  box-shadow: 0 10px 20px -5px rgba(10, 160, 255, 0.4);
}
</style>
</head>
<body>

<div class="hub-card" id="loginBox">
  <h1>Baroud <span class="gradient-text">Admin</span></h1>
  <span class="small">Secure Terminal Access</span>
  <input type="password" id="passInput" placeholder="Enter PIN Code" inputmode="numeric">
  <button class="login-btn" onclick="checkLogin()">Unlock Terminal</button>
</div>

<div class="hub-card" id="menuBox" style="display:none">
  <h1>Admin <span class="gradient-text">Hub</span> 👑</h1>
  <span class="small">Control Center • Active Session</span>
  
  <div class="grid">
    <div class="nav-item" onclick="location.href='admin-orders.html'"><span>📦</span> Orders</div>
    <div class="nav-item" onclick="location.href='admin-prices.html'"><span>💰</span> Prices</div>
    <div class="nav-item" onclick="location.href='admin.html'"><span>🏦</span> Deposits</div>
    <div class="nav-item" onclick="location.href='admin-reports.html'"><span>⚠️</span> Reports</div>
    <div class="nav-item" onclick="location.href='admin-stock.html'"><span>🗃️</span> Stock</div>
    <div class="nav-item" onclick="location.href='#'" style="opacity: 0.5;"><span>⚙️</span> Settings</div>
  </div>

  <button class="logout-btn" onclick="location.reload()">Terminate Session</button>
</div>

<script>
function checkLogin() {
  const p = document.getElementById('passInput').value;
  if(p === "230320") {
    document.getElementById('loginBox').style.animation = 'fadeOut 0.3s forwards';
    setTimeout(() => {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('menuBox').style.display = 'block';
    }, 300);
  } else {
    alert("Unauthorized Access!");
  }
}

document.getElementById('passInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkLogin(); });
</script>
<script src="app-ui.js?v=3"></script>
</body>
</html>
