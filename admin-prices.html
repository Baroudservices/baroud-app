<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin – Plan Prices</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --neon-blue: #1bc7ff;
  --bg-dark: #020508;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --accent: #2a74ff;
}

body {
  margin: 0; font-family: 'Cairo', sans-serif;
  background: var(--bg-dark); color: #fff;
  background-attachment: fixed;
  padding: 20px;
}

.wrap { max-width: 1000px; margin: auto; }

/* ===== HEADER ===== */
.top { 
  display: flex; justify-content: space-between; align-items: center; 
  margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;
}
.page-title { font-family: 'Orbitron'; font-weight: 900; font-size: 24px; letter-spacing: 2px; color: var(--neon-blue); }

.btn {
  padding: 10px 20px; border-radius: 12px; border: 1px solid var(--glass-border);
  cursor: pointer; background: var(--glass); color: #fff; font-weight: 700; transition: 0.3s;
}
.btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }

/* ===== SEARCH & SELECTION CARD ===== */
.card {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 20px; padding: 25px; margin-bottom: 25px;
  backdrop-filter: blur(10px);
}

.search-box {
  display: flex; gap: 10px; margin-bottom: 20px;
}
input, select {
  flex: 1; padding: 12px 15px; border-radius: 12px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
  color: #fff; font-family: 'Cairo'; outline: none; font-weight: 600;
}
input:focus, select:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(27, 199, 255, 0.2); }

.save-btn {
  background: linear-gradient(90deg, #0aa0ff, #2a74ff); border: none;
  font-weight: 900; letter-spacing: 1px; padding: 12px 25px;
}

/* ===== PRICE EDITOR GRID ===== */
.editor-title { font-family: 'Orbitron'; font-weight: 900; margin-bottom: 15px; font-size: 18px; color: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
.box {
  background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
  border-radius: 18px; padding: 15px; transition: 0.3s;
}
.box:hover { border-color: var(--neon-blue); background: rgba(255,255,255,0.06); }
.label { font-size: 13px; font-weight: 900; margin-bottom: 8px; opacity: 0.7; letter-spacing: 1px; }

.toggle {
  display: flex; align-items: center; gap: 10px; margin-top: 12px; 
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.toggle input { flex: none; width: 18px; height: 18px; cursor: pointer; }

/* ===== MODAL ===== */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center;
  padding: 20px; z-index: 10000; backdrop-filter: blur(8px);
}
.modalCard {
  width: 100%; max-width: 800px; background: #0b111a;
  border: 1px solid var(--glass-border); border-radius: 25px; padding: 30px;
}
.plansTable { width: 100%; border-collapse: collapse; margin-top: 20px; }
.plansTable th { text-align: left; padding: 12px; border-bottom: 2px solid var(--glass-border); font-size: 12px; opacity: 0.6; }
.plansTable td { padding: 10px; border-bottom: 1px solid var(--glass-border); }

.danger { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff4444; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.danger:hover { background: #ff4444; color: #fff; }

#msg { padding: 10px; border-radius: 10px; text-align: center; font-weight: 700; font-size: 14px; min-height: 20px; }
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="page-title">BAROUD ADMIN</div>
      <div style="font-size: 12px; opacity: 0.5;">PRICE CONTROL CENTER</div>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn" id="btnRefresh">Refresh</button>
      <button class="btn danger" id="btnLogout" style="border:none">Logout</button>
    </div>
  </div>

  <div class="card">
    <div class="search-box">
      <input id="productSearch" placeholder="Search product name..." />
      <button class="btn" id="btnClearSearch">Clear</button>
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <select id="productSelect"></select>
      <button class="btn save-btn" id="btnOpen">OPEN EDITOR</button>
    </div>
  </div>

  <div id="msg"></div>
  <div id="editor"></div>
</div>

<div id="plansModal" class="modal">
  <div class="modalCard">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="page-title" style="font-size:18px">PLAN STRUCTURE</div>
      <button class="btn" id="plansClose">✕</button>
    </div>

    <div style="max-height: 400px; overflow-y: auto; margin-top: 20px;">
      <table class="plansTable">
        <thead>
          <tr>
            <th>KEY</th>
            <th>LABEL</th>
            <th>PRICE ($)</th>
            <th>ACTIVE</th>
            <th>ACTION</th>
          </tr>
        </thead>
        <tbody id="plansTbody"></tbody>
      </table>
    </div>

    <div style="margin-top:25px; display:flex; justify-content:space-between; align-items:center;">
      <button class="btn" id="btnAddPlan" style="color:var(--neon-blue)">+ ADD NEW ROW</button>
      <div style="display:flex; gap:10px">
        <button class="btn" id="btnPlansCancel">CANCEL</button>
        <button class="btn save-btn" id="btnPlansSave">SAVE STRUCTURE</button>
      </div>
    </div>
  </div>
</div>

<script>
// Supabase Config
const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_PLAN_LIST = [{ key:"1" }, { key:"2"}, { key:"3"}, { key:"4"}];

let PLAN_LIST = [];
let _currentPlansProductId = null;
let ALL_PRODUCTS = [];

const productSelect = document.getElementById("productSelect");
const editor = document.getElementById("editor");
const msg = document.getElementById("msg");
const plansModal = document.getElementById("plansModal");
const plansTbody = document.getElementById("plansTbody");
const productSearch = document.getElementById("productSearch");

function esc(s){ return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function setMsg(text, type='info'){ 
  msg.textContent = text || ""; 
  msg.style.color = type === 'error' ? '#ff4444' : '#1bc7ff';
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) { window.location.href="login.html"; return; }

  const { data: profile } = await sb.from("profiles").select("is_admin").eq("id", session.user.id).single();
  if(!profile?.is_admin){ window.location.href = "services.html"; return; }

  await loadProducts();
}

async function loadProducts(){
  setMsg("Loading...");
  const { data, error } = await sb.from("products").select("id,title,active").order("title");
  if(error) return setMsg("Error", "error");

  ALL_PRODUCTS = data || [];
  renderProductSelect(ALL_PRODUCTS);
  if(ALL_PRODUCTS.length > 0) loadPlans(ALL_PRODUCTS[0].id);
  setMsg("");
}

function renderProductSelect(list){
  productSelect.innerHTML = list.map(p => `<option value="${p.id}">${esc(p.title)} (#${p.id})</option>`).join("");
}

productSearch.oninput = () => {
  const q = productSearch.value.toLowerCase();
  const filtered = ALL_PRODUCTS.filter(p => p.title.toLowerCase().includes(q));
  renderProductSelect(filtered);
};

async function loadPlans(productId){
  if(!productId) return;
  setMsg("Fetching...");
  _currentPlansProductId = productId;

  const { data: dbPlans, error } = await sb.from("product_plan_prices").select("*").eq("product_id", productId);
  if(error) return setMsg("Error", "error");

  PLAN_LIST = (dbPlans && dbPlans.length > 0) ? dbPlans.map(x => ({ key: String(x.plan_key), label: x.plan_label || x.plan_key })) : DEFAULT_PLAN_LIST;
  const map = {}; (dbPlans || []).forEach(r => map[String(r.plan_key)] = r);

  const title = productSelect.options[productSelect.selectedIndex]?.textContent || "Product Editor";

  editor.innerHTML = `
    <div class="card">
      <div class="editor-title">${esc(title)}</div>
      <div class="grid">
        ${PLAN_LIST.map(pl => {
          const row = map[pl.key];
          const price = row ? Number(row.price || 0) : 0;
          const active = row ? !!row.active : true;
          return `
            <div class="box">
              <div class="label">${esc(pl.label)}</div>
              <input type="number" step="0.01" value="${price.toFixed(2)}" data-price-key="${esc(pl.key)}" />
              <label class="toggle">
                <input type="checkbox" ${active ? "checked" : ""} data-active-key="${esc(pl.key)}" /> <span>ACTIVE</span>
              </label>
            </div>`;
        }).join("")}
      </div>
      <div style="display:flex; justify-content:flex-end; gap:15px; margin-top:25px;">
        <button class="btn" id="btnManagePlans">EDIT STRUCTURE</button>
        <button class="btn save-btn" id="btnSave">SAVE CHANGES</button>
      </div>
    </div>`;

  document.getElementById("btnSave").onclick = () => savePrices(productId);
  document.getElementById("btnManagePlans").onclick = async () => {
    await loadPlansForManage(productId);
    plansModal.style.display = "flex";
  };
  setMsg("Loaded Product ID: " + productId);
}

async function savePrices(productId){
  setMsg("Saving...");
  const rows = PLAN_LIST.map(pl => ({
    product_id: Number(productId),
    plan_key: String(pl.key).trim(),
    plan_label: String(pl.label || pl.key).trim(),
    price: parseFloat(editor.querySelector(`input[data-price-key="${pl.key}"]`).value) || 0,
    active: !!editor.querySelector(`input[data-active-key="${pl.key}"]`).checked
  }));

  const { error } = await sb.from("product_plan_prices").upsert(rows, { onConflict: "product_id,plan_key" });
  if(error) setMsg("Error", "error");
  else setMsg("Success! ✅");
}

async function loadPlansForManage(productId){
  const { data } = await sb.from("product_plan_prices").select("*").eq("product_id", productId);
  plansTbody.innerHTML = "";
  if(data && data.length > 0) data.forEach(renderPlanRow);
  else renderPlanRow({ plan_key:"", plan_label:"", price:0, active:true });
}

function renderPlanRow(row){
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input style="padding:8px" data-k value="${esc(row.plan_key)}" /></td>
    <td><input style="padding:8px" data-l value="${esc(row.plan_label)}" /></td>
    <td><input style="padding:8px" data-p type="number" value="${Number(row.price||0).toFixed(2)}" /></td>
    <td style="text-align:center"><input data-a type="checkbox" ${row.active !== false ? "checked":""} /></td>
    <td><button class="danger" onclick="this.closest('tr').remove()">DEL</button></td>`;
  plansTbody.appendChild(tr);
}

document.getElementById("btnPlansSave").onclick = async () => {
  const rows = Array.from(plansTbody.querySelectorAll("tr")).map(tr => ({
    product_id: Number(_currentPlansProductId),
    plan_key: tr.querySelector("[data-k]").value.trim(),
    plan_label: tr.querySelector("[data-l]").value.trim(),
    price: parseFloat(tr.querySelector("[data-p]").value) || 0,
    active: tr.querySelector("[data-a]").checked
  })).filter(r => r.plan_key);

  const { error } = await sb.from("product_plan_prices").upsert(rows, { onConflict: "product_id,plan_key" });
  if(!error) { plansModal.style.display="none"; loadPlans(_currentPlansProductId); }
};

document.getElementById("btnOpen").onclick = () => loadPlans(productSelect.value);
document.getElementById("btnRefresh").onclick = () => location.reload();
document.getElementById("btnAddPlan").onclick = () => renderPlanRow({ plan_key:"", plan_label:"", price:0, active:true });
document.getElementById("plansClose").onclick = () => plansModal.style.display = "none";
document.getElementById("btnPlansCancel").onclick = () => plansModal.style.display = "none";

boot();
</script>
</body>
</html>
