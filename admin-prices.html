<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin – Baroud Plan Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --neon-blue: #1bc7ff;
  --neon-green: #2ecc71;
  --bg-dark: #020508;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
}

body {
  margin: 0; font-family: 'Cairo', sans-serif;
  background: var(--bg-dark); color: #fff;
  padding: 10px; font-size: 13px;
}

.wrap { width: 100%; max-width: 1200px; margin: auto; }

.top { 
  display: flex; justify-content: space-between; align-items: center; 
  margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--glass-border);
}
.page-title { font-family: 'Orbitron'; font-weight: 900; font-size: 18px; color: var(--neon-blue); }

.btn {
  padding: 8px 15px; border-radius: 8px; border: 1px solid var(--glass-border);
  cursor: pointer; background: var(--glass); color: #fff; font-weight: 700; font-size: 12px;
}

.card {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 15px; padding: 15px; margin-bottom: 20px;
}

.search-box { display: flex; gap: 8px; margin-bottom: 15px; }

input, select {
  flex: 1; padding: 10px; border-radius: 8px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
  color: #fff; font-family: 'Cairo'; outline: none; font-size: 13px;
}

.save-btn { background: linear-gradient(90deg, #0aa0ff, #2a74ff); border: none; font-weight: 900; color: white; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.box {
  background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
  border-radius: 12px; padding: 12px;
}
.label { font-size: 11px; font-weight: 900; margin-bottom: 8px; color: var(--neon-blue); border-bottom: 1px solid var(--glass-border); padding-bottom: 4px;}

.price-label { font-size: 10px; opacity: 0.6; margin-top: 5px; margin-bottom: 2px; }
.box input[type="number"] { width: 100%; padding: 6px; margin-bottom: 5px; }

.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  display: none; align-items: center; justify-content: center; z-index: 10000;
}
.modalCard {
  width: 98%; max-width: 950px; background: #0b111a;
  border: 1px solid var(--glass-border); border-radius: 15px; padding: 15px;
}

.plansTable { width: 100%; border-collapse: collapse; }
.plansTable th { font-size: 11px; opacity: 0.5; padding: 8px 5px; text-align: left; }
.plansTable td { padding: 5px; }
.plansTable input { padding: 6px; font-size: 12px; width: 100%; }

.danger { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff4444; padding: 4px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }

#msg { text-align: center; font-weight: 700; margin-bottom: 10px; min-height: 15px; font-size: 12px; }
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <div class="page-title">BAROUD ADMIN</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" id="btnRefresh">Refresh</button>
      <button class="btn" id="btnLogout" style="color:#ff4444">Logout</button>
    </div>
  </div>

  <div class="card">
    <div class="search-box">
      <input id="productSearch" placeholder="Search product..." />
      <button class="btn" id="btnClearSearch">X</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <select id="productSelect"></select>
      <button class="btn save-btn" id="btnOpen">OPEN</button>
    </div>
  </div>

  <div id="msg"></div>
  <div id="editor"></div>
</div>

<div id="plansModal" class="modal">
  <div class="modalCard">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <div class="page-title" style="font-size:15px">PLAN STRUCTURE & PRICING</div>
      <button class="btn" id="plansClose">✕</button>
    </div>

    <div style="max-height: 450px; overflow-y: auto;">
      <table class="plansTable">
        <thead>
          <tr>
            <th style="width: 15%;">KEY</th>
            <th style="width: 30%;">LABEL</th>
            <th style="width: 15%;">USER ($)</th>
            <th style="width: 15%;">RESELLER ($)</th>
            <th style="width: 10%;">ACT</th>
            <th style="width: 10%;">DEL</th>
          </tr>
        </thead>
        <tbody id="plansTbody"></tbody>
      </table>
    </div>

    <div style="margin-top:15px; display:flex; justify-content:space-between;">
      <button class="btn" id="btnAddPlan">+ ROW</button>
      <div style="display:flex; gap:8px">
        <button class="btn" id="btnPlansCancel">CANCEL</button>
        <button class="btn save-btn" id="btnPlansSave">SAVE ALL</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let ALL_PRODUCTS = [];
let CURRENT_PLANS = [];
let _currentProductId = null;

const productSelect = document.getElementById("productSelect");
const editor = document.getElementById("editor");
const msg = document.getElementById("msg");
const plansModal = document.getElementById("plansModal");
const plansTbody = document.getElementById("plansTbody");
const productSearch = document.getElementById("productSearch");

function esc(s){ return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function setMsg(text, type='info'){ 
  msg.textContent = text || ""; 
  msg.style.color = type === 'error' ? '#ff4444' : '#1bc7ff';
  if(type !== 'error') setTimeout(() => { msg.textContent = ""; }, 3000);
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) { window.location.href="login.html"; return; }
  await loadProducts();
}

async function loadProducts(){
  const { data, error } = await sb.from("products").select("id,title").order("title");
  if(error) return;
  ALL_PRODUCTS = data || [];
  renderProductSelect(ALL_PRODUCTS);
  if(ALL_PRODUCTS.length > 0) loadPlans(ALL_PRODUCTS[0].id);
}

function renderProductSelect(list){
  productSelect.innerHTML = list.map(p => `<option value="${p.id}">${esc(p.title)} (#${p.id})</option>`).join("");
}

productSearch.oninput = () => {
  const q = productSearch.value.toLowerCase();
  const filtered = ALL_PRODUCTS.filter(p => p.title.toLowerCase().includes(q));
  renderProductSelect(filtered);
};

document.getElementById("btnClearSearch").onclick = () => {
  productSearch.value = "";
  renderProductSelect(ALL_PRODUCTS);
};

async function loadPlans(productId){
  if(!productId) return;
  _currentProductId = productId;
  setMsg("Loading...");
  
  const { data: dbPlans } = await sb.from("product_plan_prices").select("*").eq("product_id", productId).order("plan_key");
  CURRENT_PLANS = dbPlans || [];
  
  const title = productSelect.options[productSelect.selectedIndex]?.textContent || "Editor";
  
  if(CURRENT_PLANS.length === 0){
    editor.innerHTML = `<div class="card" style="text-align:center">No plans found. <br><br> <button class="btn" id="btnManagePlans">STRUCTURE</button></div>`;
  } else {
    editor.innerHTML = `
      <div class="card">
        <div style="font-weight:900; margin-bottom:15px; color:var(--neon-blue)">${esc(title)}</div>
        <div class="grid" id="pricesGrid">
          ${CURRENT_PLANS.map(pl => `
            <div class="box" data-key="${esc(pl.plan_key)}" data-label="${esc(pl.plan_label)}">
              <div class="label">${esc(pl.plan_label || pl.plan_key)}</div>
              
              <div class="price-label">USER PRICE ($)</div>
              <input type="number" step="0.01" value="${Number(pl.price || 0).toFixed(2)}" class="price-user" />
              
              <div class="price-label" style="color:var(--neon-green)">RESELLER PRICE ($)</div>
              <input type="number" step="0.01" value="${Number(pl.reseller_price || 0).toFixed(2)}" class="price-reseller" />
              
              <label style="display:flex; align-items:center; gap:5px; margin-top:10px; font-size:10px; opacity:0.8;">
                <input type="checkbox" ${pl.active !== false ? "checked" : ""} class="active-chk" /> ACTIVE
              </label>
            </div>`).join("")}
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
          <button class="btn" id="btnManagePlans">STRUCTURE</button>
          <button class="btn save-btn" id="btnSave">SAVE ALL PRICES</button>
        </div>
      </div>`;
    document.getElementById("btnSave").onclick = savePrices;
  }
  document.getElementById("btnManagePlans").onclick = openStructureModal;
}

async function savePrices(){
  setMsg("Saving...");
  const boxes = document.querySelectorAll("#pricesGrid .box");
  const updates = Array.from(boxes).map(box => ({
    product_id: Number(_currentProductId),
    plan_key: box.getAttribute("data-key"),
    plan_label: box.getAttribute("data-label"),
    price: parseFloat(box.querySelector(".price-user").value) || 0,
    reseller_price: parseFloat(box.querySelector(".price-reseller").value) || 0,
    active: box.querySelector(".active-chk").checked
  }));

  const { error } = await sb.from("product_plan_prices").upsert(updates, { onConflict: "product_id,plan_key" });
  setMsg(error ? "Error" : "Saved successfully! ✅", error ? "error" : "info");
}

function openStructureModal(){
  plansTbody.innerHTML = "";
  if(CURRENT_PLANS.length > 0) CURRENT_PLANS.forEach(renderPlanRow);
  else renderPlanRow({ plan_key: "", plan_label: "", price: 0, reseller_price: 0, active: true });
  plansModal.style.display = "flex";
}

function renderPlanRow(row){
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input class="row-key" value="${esc(row.plan_key)}" /></td>
    <td><input class="row-label" value="${esc(row.plan_label)}" /></td>
    <td><input class="row-p" type="number" step="0.01" value="${Number(row.price||0).toFixed(2)}" /></td>
    <td><input class="row-rp" type="number" step="0.01" value="${Number(row.reseller_price||0).toFixed(2)}" /></td>
    <td style="text-align:center"><input class="row-a" type="checkbox" ${row.active !== false ? "checked":""} /></td>
    <td><button class="danger" onclick="this.closest('tr').remove()">X</button></td>`;
  plansTbody.appendChild(tr);
}

document.getElementById("btnPlansSave").onclick = async () => {
  const rows = Array.from(plansTbody.querySelectorAll("tr")).map(tr => ({
    product_id: Number(_currentProductId),
    plan_key: tr.querySelector(".row-key").value.trim(),
    plan_label: tr.querySelector(".row-label").value.trim(),
    price: parseFloat(tr.querySelector(".row-p").value) || 0,
    reseller_price: parseFloat(tr.querySelector(".row-rp").value) || 0,
    active: tr.querySelector(".row-active") ? tr.querySelector(".row-active").checked : tr.querySelector(".row-a").checked
  })).filter(r => r.plan_key);

  const { error } = await sb.from("product_plan_prices").upsert(rows, { onConflict: "product_id,plan_key" });
  if(!error) { plansModal.style.display="none"; loadPlans(_currentProductId); }
};

document.getElementById("btnOpen").onclick = () => loadPlans(productSelect.value);
document.getElementById("btnRefresh").onclick = () => location.reload();
document.getElementById("btnAddPlan").onclick = () => renderPlanRow({ plan_key:"", plan_label:"", price:0, reseller_price:0, active:true });
document.getElementById("plansClose").onclick = () => plansModal.style.display = "none";
document.getElementById("btnPlansCancel").onclick = () => plansModal.style.display = "none";
document.getElementById("btnLogout").onclick = async () => { await sb.auth.signOut(); location.href="login.html"; };

boot();
</script>
</body>
</html>
