<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baroud Poster Maker 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الصفحة */
        body {
            background: #e0e0e0; /* خلفية فاتحة عشان تميز الكرت */
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 20px;
            text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- لوحة التحكم --- */
        .controls {
            background: #fff; padding: 20px; border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%; max-width: 350px; margin-bottom: 30px;
            text-align: right;
        }
        .controls h3 { margin: 0 0 10px 0; color: #333; font-family: 'Poppins'; font-size: 1em; text-align: center; }
        input, select {
            width: 100%; padding: 12px; margin: 5px 0;
            background: #f4f4f4; border: 1px solid #ddd;
            color: #333; text-align: center; border-radius: 8px;
            font-family: 'Tajawal'; outline: none; font-weight: bold;
        }

        /* --- الكرت الجديد (Modern Poster) --- */
        .poster-card {
            width: 360px;
            height: 640px;
            background: #000;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
            text-align: center;
            color: #fff;
        }

        /* 1. الخلفية الجذابة */
        .bg-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #111 0%, #000 100%);
            z-index: 1;
        }
        .bg-glow {
            position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: rgba(0, 140, 255, 0.25); /* لون أزرق راقي */
            filter: blur(80px);
            z-index: 1;
        }

        /* 2. الهيدر (شعار التطبيق) */
        .header {
            z-index: 5; margin-top: 25px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .logo-box {
            background: #fff; color: #000; font-weight: 900;
            padding: 2px 8px; border-radius: 4px; font-family: 'Poppins';
            font-size: 0.9em; letter-spacing: 1px;
        }
        .app-title { font-family: 'Poppins'; font-weight: 600; font-size: 1em; letter-spacing: 1px; color: #fff; }

        /* 3. منطقة الصورة (Hero Section) */
        .image-area {
            z-index: 5;
            margin: 20px auto;
            width: 300px; height: 300px;
            border-radius: 25px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #p-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* شارة الحالة (فوق الصورة) */
        .status-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            color: #fff; padding: 5px 12px; border-radius: 20px;
            font-size: 0.75em; font-weight: bold; border: 1px solid rgba(255,255,255,0.2);
            font-family: 'Poppins';
        }

        /* 4. النصوص والتفاصيل */
        .content { z-index: 5; padding: 0 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        
        #p-title {
            font-family: 'Tajawal'; font-weight: 900; font-size: 2.2em;
            margin: 0; line-height: 1.2;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        #p-desc {
            color: #888; font-size: 0.95em; margin-top: 10px; font-weight: 500;
        }

        /* 5. السعر والطلب */
        .bottom-section {
            z-index: 5;
            background: #1a1a1a;
            margin: 15px; padding: 15px 20px;
            border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333;
        }

        .price-box { text-align: right; }
        .price-label { color: #666; font-size: 0.7em; font-family: 'Poppins'; display: block; }
        #p-price {
            font-family: 'Poppins'; font-weight: 700; font-size: 1.8em; color: #fff;
            line-height: 1;
        }

        .action-btn {
            background: #fff; color: #000;
            padding: 10px 20px; border-radius: 12px;
            font-weight: 800; font-family: 'Poppins'; font-size: 0.9em;
            display: flex; align-items: center; gap: 5px;
        }
        .whatsapp-icon { width: 8px; height: 8px; background: #00d26a; border-radius: 50%; display: inline-block; }

        /* رقم الهاتف */
        .footer-number {
            z-index: 5; margin-bottom: 20px; font-family: 'Poppins';
            color: #555; font-size: 0.8em; letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <div class="controls">
        <h3>🎨 تصميم البوستر</h3>
        <input type="text" id="in-img" placeholder="رابط الصورة" oninput="update()">
        <input type="text" id="in-title" placeholder="العنوان (مثلاً: شدات ببجي)" oninput="update()">
        <input type="text" id="in-desc" placeholder="الوصف (تسليم فوري - رسمي)" oninput="update()">
        <input type="text" id="in-price" placeholder="السعر (مثلاً: $10)" oninput="update()">
        <select id="in-badge" onchange="update()">
            <option value="AVAILABLE NOW">AVAILABLE NOW</option>
            <option value="BEST SELLER">BEST SELLER 🔥</option>
            <option value="LIMITED OFFER">LIMITED OFFER ⏳</option>
        </select>
    </div>

    <div class="poster-card">
        <div class="bg-gradient"></div>
        <div class="bg-glow"></div>

        <div class="header">
            <div class="logo-box">BAROUD</div>
            <div class="app-title">APP STORE</div>
        </div>

        <div class="image-area">
            <div class="status-badge" id="p-badge">AVAILABLE NOW</div>
            <img id="p-img" src="https://via.placeholder.com/300" alt="Product">
        </div>

        <div class="content">
            <div id="p-title">عنوان الخدمة</div>
            <div id="p-desc">وصف الخدمة يظهر هنا بشكل مرتب</div>
        </div>

        <div class="bottom-section">
            <div class="action-btn">
                <span class="whatsapp-icon"></span> ORDER
            </div>
            <div class="price-box">
                <span class="price-label">PRICE</span>
                <span id="p-price">$0</span>
            </div>
        </div>

        <div class="footer-number">
            +961 70 385 398
        </div>
    </div>

<script>
    function update() {
        const img = document.getElementById('in-img').value;
        const title = document.getElementById('in-title').value;
        const desc = document.getElementById('in-desc').value;
        const price = document.getElementById('in-price').value;
        const badge = document.getElementById('in-badge').value;

        if(img) document.getElementById('p-img').src = img;
        if(title) document.getElementById('p-title').innerText = title;
        if(desc) document.getElementById('p-desc').innerText = desc;
        if(price) document.getElementById('p-price').innerText = price.includes('$') ? price : '$' + price;
        document.getElementById('p-badge').innerText = badge;
    }
</script>

</body>
</html>
