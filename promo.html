<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baroud Ad Generator 📸</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 10px;
            text-align: center;
        }

        /* --- 1. قسم التحكم (فوق) --- */
        .controls {
            background: #222;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        input {
            width: 100%; padding: 10px; margin: 5px 0;
            background: #000; border: 1px solid #555;
            color: #fff; text-align: center; border-radius: 5px;
            box-sizing: border-box;
        }
        h3 { margin: 0 0 10px 0; color: #aaa; font-size: 0.9em; }

        /* --- 2. قسم البوستر (النتيجة) --- */
        /* هيدا المربع اللي رح تعملو سكرين شوت */
        .ad-card {
            width: 100%;
            max-width: 380px; /* حجم مناسب للموبايل */
            height: 600px;    /* طول مناسب للستوري */
            background: linear-gradient(180deg, #050505 0%, #1a1a1a 100%);
            border: 4px solid #00ffea;
            border-radius: 20px;
            margin: auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 234, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
        }

        /* تأثيرات الخلفية */
        .ad-bg-effect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 255, 234, 0.1) 0%, transparent 60%);
            z-index: 0;
        }

        /* الهيدر */
        .ad-header { z-index: 1; margin-top: 10px; }
        .brand-name { font-family: 'Orbitron'; font-size: 1.8em; color: #fff; text-shadow: 0 0 10px #00ffea; margin: 0; }
        .tagline { color: #888; font-size: 0.8em; letter-spacing: 2px; }

        /* الصورة */
        .img-container {
            width: 90%;
            height: 280px;
            border: 2px solid #ff0055;
            border-radius: 15px;
            overflow: hidden;
            z-index: 1;
            background: #000;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; }
        
        .live-tag {
            position: absolute; top: 10px; left: 10px;
            background: red; color: white; padding: 5px 10px;
            border-radius: 5px; font-weight: bold; font-size: 0.8em;
        }

        /* التفاصيل */
        .details { z-index: 1; width: 100%; }
        .prod-title {
            font-family: 'Tajawal'; font-weight: 800; font-size: 1.8em;
            color: #fff; margin: 10px 0 5px 0; padding: 0 10px;
            line-height: 1.2;
        }
        
        .price-tag {
            font-family: 'Orbitron'; font-size: 3.5em; color: #00ffea;
            text-shadow: 0 0 15px rgba(0, 255, 234, 0.5);
            margin: 0; font-weight: bold;
        }

        /* الفوتر (معلومات التواصل) */
        .ad-footer {
            z-index: 1;
            background: #222;
            width: 90%;
            padding: 10px;
            border-radius: 50px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .whatsapp-icon { background: #25d366; color: #fff; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8em; }
        .phone-number { font-family: 'Orbitron'; color: #fff; font-size: 1.1em; letter-spacing: 1px; }

    </style>
</head>
<body>

    <div class="controls">
        <h3>🎛️ مولد الإعلانات (للواتساب والفيسبوك)</h3>
        <input type="text" id="inp-img" placeholder="رابط الصورة (URL)" oninput="updateAd()">
        <input type="text" id="inp-title" placeholder="اسم الغرض (مثلاً: حساب تيك توك)" oninput="updateAd()">
        <input type="text" id="inp-price" placeholder="السعر ($)" oninput="updateAd()">
        <p style="color:#666; font-size:0.8em; margin-top:5px;">بس تخلص، خد Screenshot للكرت اللي تحت 👇</p>
    </div>

    <div class="ad-card" id="capture-area">
        <div class="ad-bg-effect"></div>

        <div class="ad-header">
            <h1 class="brand-name">BAROUD <span style="color:#00ffea">APP</span></h1>
            <div class="tagline">PREMIUM AUCTIONS 🇱🇧</div>
        </div>

        <div class="img-container">
            <div class="live-tag">AVAILABLE NOW</div>
            <img id="preview-img" src="https://via.placeholder.com/400x400?text=Baroud+App" alt="Product">
        </div>

        <div class="details">
            <h2 class="prod-title" id="preview-title">اسم العرض هنا</h2>
            <div class="price-tag" id="preview-price">$0</div>
        </div>

        <div class="ad-footer">
            <div class="whatsapp-icon">WhatsApp</div>
            <div class="phone-number">70 385 398</div>
        </div>
    </div>

<script>
    function updateAd() {
        // جيب المعلومات من الخانات
        const img = document.getElementById('inp-img').value;
        const title = document.getElementById('inp-title').value;
        const price = document.getElementById('inp-price').value;

        // حطهم بالكرت
        if(img) document.getElementById('preview-img').src = img;
        if(title) document.getElementById('preview-title').innerText = title;
        if(price) document.getElementById('preview-price').innerText = '$' + price;
    }
</script>

</body>
</html>
