<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baroud Poster Maker v5.0 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        /* إعدادات الصفحة */
        body {
            background: #e0e0e0; 
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 20px; 
            text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .version-tag {
            background: #000; color: #00ffea; padding: 5px 10px;
            border-radius: 20px; font-size: 0.8em; margin-bottom: 10px;
            border: 1px solid #00ffea; font-weight: bold;
        }

        /* --- لوحة التحكم --- */
        .controls {
            background: #fff; padding: 20px; border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%; max-width: 350px; margin-bottom: 30px;
        }
        .controls h3 { margin: 0 0 10px 0; color: #333; text-align: center; }
        
        input, select {
            width: 100%; padding: 12px; margin: 5px 0;
            background: #f4f4f4; border: 1px solid #ddd;
            color: #333; text-align: center; border-radius: 8px;
            font-family: 'Poppins'; outline: none; font-weight: bold;
        }

        .file-upload-btn {
            background: #333; color: #fff; padding: 12px; border-radius: 8px;
            text-align: center; cursor: pointer; display: block; margin: 5px 0;
            font-weight: bold; font-size: 0.9em; width: 100%;
        }
        
        .save-btn {
            background: #00d26a; color: #fff; padding: 15px; border-radius: 8px;
            text-align: center; cursor: pointer; display: block; margin-top: 15px;
            font-weight: 900; font-size: 1.1em; border: none; width: 100%;
            box-shadow: 0 5px 15px rgba(0, 210, 106, 0.4);
        }

        input[type="file"] { display: none; }

        /* --- الكرت --- */
        .poster-card {
            width: 360px; height: 640px;
            background: #000; border-radius: 30px;
            position: relative; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
            text-align: center; color: #fff;
            margin: auto;
            transform-origin: top center;
        }
        
        @media (max-width: 380px) {
            .poster-card { transform: scale(0.85); margin-bottom: -60px; }
        }

        .bg-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #111 0%, #000 100%); z-index: 1; }
        .bg-glow { position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; background: rgba(0, 140, 255, 0.25); filter: blur(80px); z-index: 1; }

        .header { z-index: 5; margin-top: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .brand-title { font-family: 'Poppins'; font-weight: 900; font-size: 1.8em; letter-spacing: 2px; color: #fff; text-transform: uppercase; line-height: 1; }
        .brand-subtitle { font-size: 0.7em; color: #888; letter-spacing: 3px; margin-top: 5px; text-transform: uppercase; }

        .image-area {
            z-index: 5; margin: 20px auto; width: 300px; height: 300px;
            border-radius: 25px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); position: relative;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden;
        }
        #p-img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            color: #fff; padding: 5px 12px; border-radius: 20px;
            font-size: 0.75em; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase;
        }

        .content { z-index: 5; padding: 0 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        #p-title { font-family: 'Poppins'; font-weight: 800; font-size: 2em; margin: 0; line-height: 1.2; background: linear-gradient(90deg, #fff, #ddd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #p-desc { color: #888; font-size: 0.9em; margin-top: 8px; font-weight: 400; }

        .bottom-section {
            z-index: 5; background: #1a1a1a; margin: 15px; padding: 12px 20px;
            border-radius: 18px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333;
        }
        .price-box { text-align: right; }
        .price-label { color: #666; font-size: 0.6em; display: block; letter-spacing: 1px; }
        #p-price { font-weight: 700; font-size: 1.6em; color: #fff; line-height: 1; }

        .action-btn { background: #fff; color: #000; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .whatsapp-icon { width: 8px; height: 8px; background: #00d26a; border-radius: 50%; display: inline-block; }

        .footer-area { z-index: 5; margin-bottom: 25px; display: flex; flex-direction: column; gap: 5px; }
        .footer-number { color: #888; font-size: 0.9em; letter-spacing: 1px; font-weight: 600; }
        .footer-link { color: #00ffea; font-size: 0.8em; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; text-decoration: none; }

    </style>
</head>
<body>

    <div class="version-tag">Ver 5.0 (Ultimate Fix)</div>

    <div class="controls">
        <h3>🎨 Poster Maker</h3>
        <label for="img-upload" class="file-upload-btn">📂 Open Gallery</label>
        <input type="file" id="img-upload" accept="image/*" onchange="uploadImage()">
        <input type="text" id="in-img" placeholder="Or Paste Image URL" oninput="update()">
        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
        <input type="text" id="in-title" placeholder="Title (e.g. Netflix)" oninput="update()">
        <input type="text" id="in-desc" placeholder="Desc (e.g. Full Warranty)" oninput="update()">
        <input type="text" id="in-price" placeholder="Price (e.g. $10)" oninput="update()">
        <select id="in-badge" onchange="update()">
            <option value="AVAILABLE NOW">AVAILABLE NOW</option>
            <option value="BEST SELLER">BEST SELLER 🔥</option>
            <option value="LIMITED OFFER">LIMITED OFFER ⏳</option>
        </select>
        <button onclick="downloadPoster()" class="save-btn">SAVE IMAGE 📥</button>
    </div>

    <div class="poster-card" id="capture-area">
        <div class="bg-gradient"></div>
        <div class="bg-glow"></div>
        <div class="header">
            <div class="brand-title">BAROUD <span style="color:#00ffea">APP</span></div>
            <div class="brand-subtitle">Digital Store Services</div>
        </div>
        <div class="image-area">
            <div class="status-badge" id="p-badge">AVAILABLE NOW</div>
            <img id="p-img" src="https://via.placeholder.com/300" alt="Product" crossorigin="anonymous">
        </div>
        <div class="content">
            <div id="p-title">Service Name</div>
            <div id="p-desc">Description goes here</div>
        </div>
        <div class="bottom-section">
            <div class="action-btn"><span class="whatsapp-icon"></span> ORDER</div>
            <div class="price-box">
                <span class="price-label">PRICE</span>
                <span id="p-price">$0</span>
            </div>
        </div>
        <div class="footer-area">
            <div class="footer-number">+961 70 385 398</div>
            <div class="footer-link">WWW.BAROUDAPP.COM</div>
        </div>
    </div>

<script>
    function uploadImage() {
        const fileInput = document.getElementById('img-upload');
        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('p-img').src = e.target.result; }
            reader.readAsDataURL(file);
        }
    }

    function update() {
        const imgUrl = document.getElementById('in-img').value;
        const title = document.getElementById('in-title').value;
        const desc = document.getElementById('in-desc').value;
        const price = document.getElementById('in-price').value;
        const badge = document.getElementById('in-badge').value;

        if(imgUrl) document.getElementById('p-img').src = imgUrl;
        if(title) document.getElementById('p-title').innerText = title;
        if(desc) document.getElementById('p-desc').innerText = desc;
        if(price) document.getElementById('p-price').innerText = price.includes('$') ? price : '$' + price;
        document.getElementById('p-badge').innerText = badge;
    }

    // 🔥 دالة التحميل الخامسة (عزل تام) 🔥
    function downloadPoster() {
        const btn = document.querySelector('.save-btn');
        const originalText = btn.innerText;
        btn.innerText = "⏳ Saving..."; 

        const original = document.getElementById('capture-area');
        
        // 1. إنشاء حاوية عزل (Isolation Container)
        // بنحطها بأعلى الصفحة عاليسار (0,0) وبنعطيها حجم ثابت
        const container = document.createElement('div');
        container.style.position = 'absolute';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '360px';
        container.style.height = '640px';
        container.style.zIndex = '-9999'; // تحت كل شي
        container.style.overflow = 'hidden';
        container.style.padding = '0';
        container.style.margin = '0';
        
        document.body.appendChild(container);

        // 2. نسخ الكرت
        const clone = original.cloneNode(true);
        // تصفير كل المسافات للنسخة
        clone.style.margin = '0';
        clone.style.transform = 'none';
        clone.style.borderRadius = '0'; 
        clone.style.width = '100%';
        clone.style.height = '100%';
        clone.style.boxShadow = 'none'; // عشان ما يطلع خيال مقصوص

        container.appendChild(clone);

        // 3. التصوير
        html2canvas(container, {
            scale: 2, 
            useCORS: true,
            backgroundColor: null,
            // هول الإعدادات هنن السر:
            width: 360,
            height: 640,
            windowWidth: 360,
            windowHeight: 640,
            x: 0,
            y: 0,
            scrollX: 0,
            scrollY: 0
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'baroud-poster.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
            
            document.body.removeChild(container);
            btn.innerText = originalText;
        }).catch(err => {
            alert("Error: " + err);
            if(document.body.contains(container)) document.body.removeChild(container);
            btn.innerText = originalText;
        });
    }
</script>

</body>
</html>
