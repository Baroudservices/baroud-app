<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baroud Poster V11 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        /* إعدادات الصفحة */
        body {
            background: #121212; 
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center;
            color: #fff;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        .version-tag {
            background: #ff0055; color: #fff; padding: 5px 15px;
            border-radius: 20px; font-size: 0.8em; margin-bottom: 15px;
            font-weight: bold; border: 1px solid #fff;
        }

        /* --- لوحة التحكم --- */
        .controls {
            background: #1e1e1e; padding: 20px; border-radius: 20px;
            border: 1px solid #333;
            width: 100%; max-width: 350px; margin-bottom: 30px;
        }
        
        input, select {
            width: 100%; padding: 12px; margin: 8px 0;
            background: #2a2a2a; border: 1px solid #444;
            color: #fff; text-align: center; border-radius: 10px;
            font-family: 'Poppins'; outline: none; font-weight: bold; font-size: 0.9em;
        }

        .file-upload-btn {
            background: linear-gradient(45deg, #00ffea, #0099ff); 
            color: #000; padding: 12px; border-radius: 10px;
            text-align: center; cursor: pointer; display: block; margin: 5px 0;
            font-weight: bold; font-size: 0.9em;
        }
        
        .save-btn {
            background: #00d26a; color: #fff; padding: 15px; border-radius: 10px;
            text-align: center; cursor: pointer; display: block; margin-top: 20px;
            font-weight: 900; font-size: 1.1em; border: none; width: 100%;
            box-shadow: 0 0 15px rgba(0, 210, 106, 0.4);
        }

        input[type="file"] { display: none; }

        /* --- الكرت --- */
        .poster-card {
            width: 360px; height: 640px;
            background: #000; border-radius: 30px;
            position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            text-align: center; color: #fff;
            margin: auto;
            user-select: none;
        }

        /* تصغير للمعاينة فقط (عشان يبين بالشاشة) */
        #preview-wrapper .poster-card {
            transform: scale(0.9);
            transform-origin: top center;
            margin-bottom: -60px; /* تعويض الفراغ */
            border: 1px solid #333;
        }

        .bg-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #111 0%, #000 100%); z-index: 1; }
        .bg-glow { position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; background: rgba(0, 140, 255, 0.15); filter: blur(80px); z-index: 1; }

        .header { z-index: 5; margin-top: 40px; display: flex; flex-direction: column; align-items: center; }
        .brand-title { font-family: 'Poppins'; font-weight: 900; font-size: 2em; letter-spacing: 2px; color: #fff; text-transform: uppercase; line-height: 1; }
        .brand-subtitle { font-size: 0.7em; color: #888; letter-spacing: 4px; margin-top: 5px; text-transform: uppercase; }

        .image-area {
            z-index: 5; margin: 30px auto; width: 280px; height: 280px;
            border-radius: 25px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1); position: relative;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden;
        }
        .p-img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            color: #fff; padding: 5px 12px; border-radius: 20px;
            font-size: 0.7em; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase;
        }

        .content { z-index: 5; padding: 0 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .p-title { font-family: 'Poppins'; font-weight: 800; font-size: 1.8em; margin: 0; line-height: 1.2; background: linear-gradient(90deg, #fff, #bbb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .p-desc { color: #888; font-size: 0.9em; margin-top: 8px; font-weight: 400; }

        .bottom-section {
            z-index: 5; background: #1a1a1a; margin: 20px; padding: 15px 25px;
            border-radius: 20px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333;
        }
        .price-box { text-align: right; }
        .price-label { color: #555; font-size: 0.6em; display: block; letter-spacing: 1px; font-weight: bold; }
        .p-price { font-weight: 700; font-size: 1.8em; color: #fff; line-height: 1; }

        .action-btn { background: #fff; color: #000; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .whatsapp-icon { width: 10px; height: 10px; background: #00d26a; border-radius: 50%; display: inline-block; }

        .footer-area { z-index: 5; margin-bottom: 30px; display: flex; flex-direction: column; gap: 5px; }
        .footer-number { color: #666; font-size: 0.9em; letter-spacing: 2px; font-weight: 600; }
        .footer-link { color: #00ffea; font-size: 0.7em; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; text-decoration: none; }

        /* --- نافذة النتيجة (Result Modal) --- */
        #result-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        #result-img {
            /* عرض الصورة بالكامل دون قص */
            width: auto; height: auto; 
            max-width: 90%; max-height: 80vh;
            border: 2px solid #00ffea; border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 234, 0.3);
            margin-bottom: 20px;
        }
        .close-btn {
            background: #ff0055; color: #fff; width: 100%;
            padding: 15px; border-radius: 50px; border: none; font-weight: bold;
            font-size: 1.1em; cursor: pointer; max-width: 300px;
        }
        .hint-text { color: #00ffea; margin-bottom: 15px; font-size: 1em; font-weight: bold; text-align: center; }

    </style>
</head>
<body>

    <div class="version-tag">Ver 11.0 (Zero Position)</div>

    <div class="controls">
        <label for="img-upload" class="file-upload-btn">📂 اختر صورة من الاستديو</label>
        <input type="file" id="img-upload" accept="image/*" onchange="uploadImage()">
        <input type="text" id="in-img" placeholder="Paste Image URL" oninput="update()">
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <input type="text" id="in-title" placeholder="Title (e.g. Netflix 1 Month)" oninput="update()">
        <input type="text" id="in-desc" placeholder="Desc (e.g. 4K UHD - Private)" oninput="update()">
        <input type="text" id="in-price" placeholder="Price (e.g. $5)" oninput="update()">
        <select id="in-badge" onchange="update()">
            <option value="AVAILABLE NOW">AVAILABLE NOW</option>
            <option value="BEST SELLER">BEST SELLER 🔥</option>
            <option value="LIMITED OFFER">LIMITED OFFER ⏳</option>
        </select>
        <button onclick="generatePoster()" class="save-btn">✨ GENERATE IMAGE</button>
    </div>

    <div id="preview-wrapper">
        <div class="poster-card" id="card-source">
            <div class="bg-gradient"></div>
            <div class="bg-glow"></div>
            <div class="header">
                <div class="brand-title">BAROUD <span style="color:#00ffea">APP</span></div>
                <div class="brand-subtitle">Digital Store Services</div>
            </div>
            <div class="image-area">
                <div class="status-badge" id="p-badge">AVAILABLE NOW</div>
                <img class="p-img" id="p-img" src="https://via.placeholder.com/300" alt="Product" crossorigin="anonymous">
            </div>
            <div class="content">
                <div class="p-title" id="p-title">Service Name</div>
                <div class="p-desc" id="p-desc">Description goes here</div>
            </div>
            <div class="bottom-section">
                <div class="action-btn"><span class="whatsapp-icon"></span> ORDER</div>
                <div class="price-box">
                    <span class="price-label">PRICE</span>
                    <span class="p-price" id="p-price">$0</span>
                </div>
            </div>
            <div class="footer-area">
                <div class="footer-number">+961 70 385 398</div>
                <div class="footer-link">WWW.BAROUDAPP.COM</div>
            </div>
        </div>
    </div>

    <div id="result-modal">
        <p class="hint-text">✅ تم! اضغط مطولاً على الصورة لحفظها</p>
        <img id="result-img" src="" alt="Generated Poster">
        <button class="close-btn" onclick="closeModal()">إغلاق / خروج</button>
    </div>

<script>
    function uploadImage() {
        const file = document.getElementById('img-upload').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('p-img').src = e.target.result; }
            reader.readAsDataURL(file);
        }
    }

    function update() {
        const imgUrl = document.getElementById('in-img').value;
        const title = document.getElementById('in-title').value;
        const desc = document.getElementById('in-desc').value;
        const price = document.getElementById('in-price').value;
        const badge = document.getElementById('in-badge').value;

        if(imgUrl) document.getElementById('p-img').src = imgUrl;
        if(title) document.getElementById('p-title').innerText = title;
        if(desc) document.getElementById('p-desc').innerText = desc;
        if(price) document.getElementById('p-price').innerText = price.includes('$') ? price : '$' + price;
        document.getElementById('p-badge').innerText = badge;
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
    }

    // 🔥 V11.0: تثبيت الكرت بالزاوية (Zero Position) 🔥
    function generatePoster() {
        const btn = document.querySelector('.save-btn');
        btn.innerText = "⏳ جاري المعالجة...";

        // 1. إنشاء "غرفة تصوير" (Container)
        // الفرق هون: لغينا الـ Flex واستعملنا absolute positioning
        const studio = document.createElement('div');
        studio.style.position = 'fixed';
        studio.style.top = '0';
        studio.style.left = '0';
        studio.style.width = '100%';
        studio.style.height = '100%';
        studio.style.zIndex = '-9999'; // مخفي بالخلف
        studio.style.background = '#000'; // لضمان الخلفية
        
        document.body.appendChild(studio);

        // 2. نسخ الكرت
        const original = document.getElementById('card-source');
        const clone = original.cloneNode(true);
        
        // 3. إجبار النسخة تكون بالزاوية (0,0) وبحجمها الطبيعي
        clone.style.position = 'absolute';
        clone.style.top = '0';
        clone.style.left = '0';
        clone.style.transform = 'none'; 
        clone.style.margin = '0';
        clone.style.boxShadow = 'none';
        
        studio.appendChild(clone);

        // 4. التصوير
        // شلنا خصائص width/height/x/y وخلينا الكود يصور العنصر نفسه
        setTimeout(() => {
            html2canvas(clone, {
                scale: 2, // دقة عالية
                useCORS: true,
                backgroundColor: null,
                scrollY: 0
            }).then(canvas => {
                // عرض النتيجة
                const imgData = canvas.toDataURL("image/png");
                const modal = document.getElementById('result-modal');
                const resultImg = document.getElementById('result-img');
                
                resultImg.src = imgData;
                modal.style.display = 'flex';
                
                // تنظيف
                document.body.removeChild(studio);
                btn.innerText = "✨ GENERATE IMAGE";
                
            }).catch(err => {
                alert("Error: " + err);
                if(document.body.contains(studio)) document.body.removeChild(studio);
                btn.innerText = "✨ GENERATE IMAGE";
            });
        }, 200);
    }
</script>

</body>
</html>
