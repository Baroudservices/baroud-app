<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baroud Poster V14 🌙</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body {
      background: #121212;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    .version-tag {
      background: #ff0055;
      color: #fff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8em;
      margin-bottom: 15px;
      font-weight: bold;
      border: 1px solid #fff;
    }

    .controls {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid #333;
      width: 100%;
      max-width: 350px;
      margin-bottom: 30px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      text-align: center;
      border-radius: 10px;
      font-family: 'Poppins';
      outline: none;
      font-weight: bold;
      font-size: 0.9em;
    }

    .file-upload-btn {
      background: linear-gradient(45deg, #00ffea, #0099ff);
      color: #000;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      display: block;
      margin: 5px 0;
      font-weight: bold;
    }

    .save-btn {
      background: #00d26a;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: 900;
      font-size: 1.1em;
      border: none;
      width: 100%;
      box-shadow: 0 0 15px rgba(0, 210, 106, 0.4);
    }

    .download-btn {
      background: #00ffea;
      color: #000;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 900;
      font-size: 1em;
      border: none;
      width: 100%;
    }

    input[type="file"] { display: none; }

    /* Poster Card */
    .poster-card {
      width: 360px;
      height: 640px;
      background: #000;
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      text-align: center;
      color: #fff;
      flex-shrink: 0;
    }

    #preview-wrapper {
      transform: scale(0.9);
      transform-origin: top center;
    }

    body.shooting-mode {
      padding: 0;
      margin: 0;
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      align-items: center;
      justify-content: center;
    }

    body.shooting-mode .controls,
    body.shooting-mode .version-tag,
    body.shooting-mode #result-modal {
      display: none !important;
    }

    body.shooting-mode #preview-wrapper {
      transform: none !important;
    }

    body.shooting-mode .poster-card {
      border-radius: 0;
      box-shadow: none;
    }

    .bg-gradient {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #111 0%, #000 100%);
      z-index: 1;
    }

    .bg-glow {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: rgba(0, 140, 255, 0.15);
      filter: blur(80px);
      z-index: 1;
    }

    .header {
      z-index: 5;
      margin-top: 40px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 2em;
      letter-spacing: 2px;
    }

    .brand-subtitle {
      font-size: 0.7em;
      color: #888;
      letter-spacing: 4px;
      margin-top: 5px;
    }

    .image-area {
      z-index: 5;
      margin: 30px auto;
      width: 280px;
      height: 280px;
      border-radius: 25px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .p-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.7em;
      font-weight: bold;
    }

    .content {
      z-index: 5;
      padding: 0 20px;
      flex-grow: 1;
    }

    .p-title {
      font-weight: 800;
      font-size: 1.8em;
      margin: 0;
    }

    .p-desc {
      color: #888;
      font-size: 0.9em;
      margin-top: 8px;
    }

    .bottom-section {
      z-index: 5;
      background: #1a1a1a;
      margin: 20px;
      padding: 15px 25px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .p-price {
      font-weight: 700;
      font-size: 1.8em;
    }

    /* Ramadan Style */
    .ramadan-ribbon {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,255,234,0.4);
      display: none;
      gap: 8px;
      align-items: center;
      font-weight: 800;
      font-size: 0.8em;
    }

    .ramadan-lantern {
      position: absolute;
      bottom: 120px;
      left: 25px;
      z-index: 10;
      font-size: 34px;
      display: none;
    }

    /* Modal */
    #result-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 999999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #result-img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 15px;
      border: 2px solid #00ffea;
    }

    .close-btn {
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: #ff0055;
      color: white;
      font-size: 1.1em;
      width: 250px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="version-tag">Ver 14.0 رمضان 🌙</div>

  <div class="controls">

    <label for="img-upload" class="file-upload-btn">📂 Upload Image</label>
    <input type="file" id="img-upload" accept="image/*" onchange="uploadImage()">

    <input type="text" id="in-title" placeholder="Title" oninput="update()">
    <input type="text" id="in-desc" placeholder="Description" oninput="update()">
    <input type="text" id="in-price" placeholder="Price" oninput="update()">

    <select id="in-theme" onchange="update()">
      <option value="normal">Normal</option>
      <option value="ramadan">Ramadan 🌙</option>
    </select>

    <button onclick="generatePoster()" class="save-btn">✨ GENERATE IMAGE</button>
    <button onclick="downloadLast()" class="download-btn">⬇️ DOWNLOAD LAST</button>
  </div>

  <div id="preview-wrapper">
    <div class="poster-card" id="card-source">

      <div class="bg-gradient"></div>
      <div class="bg-glow"></div>

      <!-- Ramadan -->
      <div class="ramadan-ribbon" id="ramadan-ribbon">🌙 RAMADAN OFFER</div>
      <div class="ramadan-lantern" id="ramadan-lantern">🏮</div>

      <div class="header">
        <div class="brand-title">BAROUD <span style="color:#00ffea;">APP</span></div>
        <div class="brand-subtitle">Digital Store Services</div>
      </div>

      <div class="image-area">
        <div class="status-badge" id="p-badge">AVAILABLE</div>
        <img class="p-img" id="p-img" src="https://via.placeholder.com/300">
      </div>

      <div class="content">
        <h2 class="p-title" id="p-title">Service Name</h2>
        <p class="p-desc" id="p-desc">Description here</p>
      </div>

      <div class="bottom-section">
        <div>ORDER</div>
        <div class="p-price" id="p-price">$0</div>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div id="result-modal">
    <img id="result-img">
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>

<script>
  let LAST_IMG_DATA = null;

  function uploadImage(){
    const file = document.getElementById("img-upload").files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById("p-img").src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function update(){
    document.getElementById("p-title").innerText =
      document.getElementById("in-title").value;

    document.getElementById("p-desc").innerText =
      document.getElementById("in-desc").value;

    let price = document.getElementById("in-price").value;
    document.getElementById("p-price").innerText =
      price.includes("$") ? price : "$" + price;

    let theme = document.getElementById("in-theme").value;

    if(theme === "ramadan"){
      document.getElementById("ramadan-ribbon").style.display = "flex";
      document.getElementById("ramadan-lantern").style.display = "block";
      document.getElementById("p-badge").innerText = "RAMADAN 🌙";
    } else {
      document.getElementById("ramadan-ribbon").style.display = "none";
      document.getElementById("ramadan-lantern").style.display = "none";
      document.getElementById("p-badge").innerText = "AVAILABLE";
    }
  }

  function closeModal(){
    document.getElementById("result-modal").style.display = "none";
  }

  function downloadLast(){
    if(!LAST_IMG_DATA){
      alert("Generate first!");
      return;
    }
    const a = document.createElement("a");
    a.href = LAST_IMG_DATA;
    a.download = "poster.png";
    a.click();
  }

  async function generatePoster(){
    const card = document.getElementById("card-source");

    document.body.classList.add("shooting-mode");

    setTimeout(async () => {

      const canvas = await html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: "#000"
      });

      LAST_IMG_DATA = canvas.toDataURL("image/png");

      document.body.classList.remove("shooting-mode");

      document.getElementById("result-img").src = LAST_IMG_DATA;
      document.getElementById("result-modal").style.display = "flex";

      downloadLast();

    }, 400);
  }
</script>

</body>
</html>
