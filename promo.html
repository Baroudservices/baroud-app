<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud Poster V15 🌙 (Mobile Fix)</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body{
      background:#121212;
      font-family:'Poppins',sans-serif;
      margin:0; padding:20px;
      display:flex; flex-direction:column; align-items:center;
      color:#fff;
      overflow-x:hidden;
      padding-bottom:100px;
    }

    .version-tag{
      background:#ff0055; color:#fff;
      padding:5px 15px; border-radius:20px;
      font-size:.8em; margin-bottom:15px;
      font-weight:bold; border:1px solid #fff;
    }

    .controls{
      background:#1e1e1e;
      padding:20px; border-radius:20px;
      border:1px solid #333;
      width:100%; max-width:350px;
      margin-bottom:30px;
    }

    input, select{
      width:100%;
      padding:12px; margin:8px 0;
      background:#2a2a2a;
      border:1px solid #444;
      color:#fff;
      text-align:center;
      border-radius:10px;
      font-family:'Poppins';
      outline:none;
      font-weight:bold;
      font-size:.9em;
      box-sizing:border-box;
    }

    input[type="file"]{ display:none; }

    .file-upload-btn{
      background:linear-gradient(45deg,#00ffea,#0099ff);
      color:#000;
      padding:12px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
      display:block;
      margin:5px 0;
      font-weight:bold;
      font-size:.9em;
      user-select:none;
    }

    .save-btn{
      background:#00d26a;
      color:#fff;
      padding:15px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
      display:block;
      margin-top:12px;
      font-weight:900;
      font-size:1.1em;
      border:none;
      width:100%;
      box-shadow:0 0 15px rgba(0,210,106,.4);
    }

    .download-btn{
      background:#00ffea;
      color:#000;
      padding:14px;
      border-radius:10px;
      cursor:pointer;
      margin-top:10px;
      font-weight:900;
      font-size:1em;
      border:none;
      width:100%;
    }

    /* Card (Fixed size) */
    .poster-card{
      width:360px; height:640px;
      background:#000;
      border-radius:30px;
      position:relative;
      overflow:hidden;
      box-shadow:0 0 50px rgba(0,0,0,.5);
      display:flex;
      flex-direction:column;
      text-align:center;
      color:#fff;
      margin:auto;
      user-select:none;
      flex-shrink:0;
    }

    /* Preview scale فقط للعرض */
    #preview-wrapper{
      margin-bottom:20px;
      transform-origin:top center;
      transition:transform .3s;
      transform:scale(.9);
    }

    /* Shooting mode: يخفي كل شي ويمنع scale */
    body.shooting-mode{
      padding:0; margin:0;
      background:#000;
      height:100vh; width:100vw;
      overflow:hidden;
      align-items:center;
      justify-content:center;
    }

    body.shooting-mode .controls,
    body.shooting-mode .version-tag,
    body.shooting-mode #result-modal{
      display:none !important;
    }

    body.shooting-mode #preview-wrapper{
      transform:none !important;
      margin:0;
    }

    body.shooting-mode .poster-card{
      border-radius:0;
      box-shadow:none;
    }

    .bg-gradient{
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      background:linear-gradient(180deg,#111 0%,#000 100%);
      z-index:1;
    }

    .bg-glow{
      position:absolute; top:-10%; left:50%;
      transform:translateX(-50%);
      width:300px; height:300px;
      background:rgba(0,140,255,.15);
      filter:blur(80px);
      z-index:1;
    }

    .header{
      z-index:5;
      margin-top:40px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .brand-title{
      font-weight:900;
      font-size:2em;
      letter-spacing:2px;
      text-transform:uppercase;
      line-height:1;
    }

    .brand-subtitle{
      font-size:.7em;
      color:#888;
      letter-spacing:4px;
      margin-top:5px;
      text-transform:uppercase;
    }

    .image-area{
      z-index:5;
      margin:30px auto;
      width:280px; height:280px;
      border-radius:25px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.1);
      position:relative;
      display:flex; justify-content:center; align-items:center;
      box-shadow:0 20px 50px rgba(0,0,0,.6);
      overflow:hidden;
    }

    .p-img{
      width:100%; height:100%;
      object-fit:cover;
    }

    .status-badge{
      position:absolute;
      top:15px; left:15px;
      background:rgba(0,0,0,.6);
      backdrop-filter:blur(5px);
      color:#fff;
      padding:5px 12px;
      border-radius:20px;
      font-size:.7em;
      font-weight:bold;
      border:1px solid rgba(255,255,255,.2);
      text-transform:uppercase;
      z-index:6;
    }

    .content{
      z-index:5;
      padding:0 20px;
      flex-grow:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .p-title{
      font-weight:800;
      font-size:1.8em;
      margin:0;
      line-height:1.2;
    }

    .p-desc{
      color:#888;
      font-size:.9em;
      margin-top:8px;
      font-weight:400;
    }

    .bottom-section{
      z-index:5;
      background:#1a1a1a;
      margin:20px;
      padding:15px 25px;
      border-radius:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid #333;
    }

    .action-btn{
      background:#fff; color:#000;
      padding:10px 20px;
      border-radius:12px;
      font-weight:800;
      font-size:.9em;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .whatsapp-icon{
      width:10px; height:10px;
      background:#00d26a;
      border-radius:50%;
      display:inline-block;
    }

    .price-box{ text-align:right; }
    .price-label{
      color:#555;
      font-size:.6em;
      display:block;
      letter-spacing:1px;
      font-weight:bold;
    }
    .p-price{
      font-weight:700;
      font-size:1.8em;
      color:#fff;
      line-height:1;
    }

    .footer-area{
      z-index:5;
      margin-bottom:30px;
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .footer-number{
      color:#666;
      font-size:.9em;
      letter-spacing:2px;
      font-weight:600;
    }

    .footer-link{
      color:#00ffea;
      font-size:.7em;
      letter-spacing:2px;
      text-transform:uppercase;
      font-weight:bold;
      text-decoration:none;
    }

    /* Ramadan elements */
    .ramadan-ribbon{
      position:absolute;
      top:18px; right:18px;
      z-index:10;
      padding:10px 14px;
      border-radius:16px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(0,255,234,.35);
      backdrop-filter:blur(6px);
      display:none;
      gap:8px;
      align-items:center;
      font-weight:800;
      letter-spacing:1px;
      font-size:.8em;
    }
    .ramadan-ribbon .txt{
      color:#00ffea;
      text-transform:uppercase;
    }

    .ramadan-lantern{
      position:absolute;
      bottom:118px;
      left:22px;
      z-index:10;
      font-size:34px;
      display:none;
      opacity:.95;
      filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));
    }

    /* Modal */
    #result-modal{
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,.95);
      z-index:999999;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow-y:auto;
      padding:20px;
      box-sizing:border-box;
    }

    #result-img{
      max-width:92%;
      max-height:80vh;
      border:2px solid #00ffea;
      border-radius:15px;
      box-shadow:0 0 30px rgba(0,255,234,.3);
      margin-bottom:16px;
    }

    .hint-text{
      color:#00ffea;
      margin-bottom:14px;
      font-size:1em;
      font-weight:bold;
      text-align:center;
    }

    .close-btn{
      background:#ff0055;
      color:#fff;
      width:100%;
      padding:15px;
      border-radius:50px;
      border:none;
      font-weight:bold;
      font-size:1.1em;
      cursor:pointer;
      max-width:300px;
    }
  </style>
</head>

<body>

  <div class="version-tag">Ver 15.0 (Mobile Fixed) 🌙</div>

  <div class="controls">
    <label for="img-upload" class="file-upload-btn">📂 اختر صورة من الاستديو</label>
    <input type="file" id="img-upload" accept="image/*" onchange="uploadImage()">

    <input type="text" id="in-img" placeholder="Paste Image URL (optional)" oninput="update()">

    <hr style="border:0;border-top:1px solid #333;margin:15px 0;">

    <input type="text" id="in-title" placeholder="Title" oninput="update()">
    <input type="text" id="in-desc" placeholder="Desc" oninput="update()">
    <input type="text" id="in-price" placeholder="Price (e.g. 5)" oninput="update()">

    <select id="in-badge" onchange="update()">
      <option value="AVAILABLE NOW">AVAILABLE NOW</option>
      <option value="BEST SELLER 🔥">BEST SELLER 🔥</option>
      <option value="LIMITED OFFER ⏳">LIMITED OFFER ⏳</option>
    </select>

    <select id="in-theme" onchange="update()">
      <option value="normal">Normal</option>
      <option value="ramadan">Ramadan 🌙</option>
    </select>

    <button onclick="generatePoster()" class="save-btn" id="gen-btn">✨ GENERATE IMAGE</button>
    <button onclick="downloadLast()" class="download-btn">⬇️ DOWNLOAD LAST</button>
  </div>

  <div id="preview-wrapper">
    <div class="poster-card" id="card-source">
      <div class="bg-gradient"></div>
      <div class="bg-glow"></div>

      <!-- Ramadan -->
      <div class="ramadan-ribbon" id="ramadan-ribbon">
        <span>🌙</span> <span class="txt">RAMADAN OFFER</span>
      </div>
      <div class="ramadan-lantern" id="ramadan-lantern">🏮</div>

      <div class="header">
        <div class="brand-title">BAROUD <span style="color:#00ffea">APP</span></div>
        <div class="brand-subtitle">Digital Store Services</div>
      </div>

      <div class="image-area">
        <div class="status-badge" id="p-badge">AVAILABLE NOW</div>
        <img class="p-img" id="p-img" src="https://via.placeholder.com/300" alt="Product">
      </div>

      <div class="content">
        <div class="p-title" id="p-title">Service Name</div>
        <div class="p-desc" id="p-desc">Description goes here</div>
      </div>

      <div class="bottom-section">
        <div class="action-btn"><span class="whatsapp-icon"></span> ORDER</div>
        <div class="price-box">
          <span class="price-label">PRICE</span>
          <span class="p-price" id="p-price">$0</span>
        </div>
      </div>

      <div class="footer-area">
        <div class="footer-number">+961 70 385 398</div>
        <a class="footer-link" href="#" onclick="return false;">WWW.BAROUDAPP.COM</a>
      </div>

    </div>
  </div>

  <div id="result-modal">
    <p class="hint-text">✅ تم! إذا ما اشتغل التحميل، اضغط مطوّلًا على الصورة واحفظها</p>
    <img id="result-img" src="" alt="Generated Poster">
    <button class="close-btn" onclick="closeModal()">إغلاق / خروج</button>
  </div>

  <script>
    let LAST_BLOB = null;
    let LAST_OBJ_URL = null;

    function cleanupPreviewUrl(){
      if(LAST_OBJ_URL){
        URL.revokeObjectURL(LAST_OBJ_URL);
        LAST_OBJ_URL = null;
      }
    }

    function uploadImage(){
      const file = document.getElementById('img-upload').files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = function(e){
          document.getElementById('p-img').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function update(){
      const imgUrl = document.getElementById('in-img').value.trim();
      const title  = document.getElementById('in-title').value;
      const desc   = document.getElementById('in-desc').value;
      const price  = document.getElementById('in-price').value;
      const badge  = document.getElementById('in-badge').value;
      const theme  = document.getElementById('in-theme').value;

      const img = document.getElementById('p-img');

      if(imgUrl){
        img.crossOrigin = "anonymous";
        img.referrerPolicy = "no-referrer";
        img.src = imgUrl;
      }

      if(title) document.getElementById('p-title').innerText = title;
      if(desc)  document.getElementById('p-desc').innerText  = desc;

      if(price){
        document.getElementById('p-price').innerText = price.includes('$') ? price : ('$' + price);
      }

      // Badge + Ramadan
      if(theme === "ramadan"){
        document.getElementById('ramadan-ribbon').style.display = "flex";
        document.getElementById('ramadan-lantern').style.display = "block";
        document.getElementById('p-badge').innerText = "RAMADAN OFFER 🌙";
      }else{
        document.getElementById('ramadan-ribbon').style.display = "none";
        document.getElementById('ramadan-lantern').style.display = "none";
        document.getElementById('p-badge').innerText = badge;
      }
    }

    function closeModal(){
      document.getElementById('result-modal').style.display = 'none';
      document.body.classList.remove('shooting-mode');
      cleanupPreviewUrl();
      window.scrollTo(0,0);
    }

    function downloadLast(){
      if(!LAST_BLOB){
        alert("Generate image first ✅");
        return;
      }
      const url = URL.createObjectURL(LAST_BLOB);
      const a = document.createElement("a");
      a.href = url;
      a.download = "baroud-poster.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    }

    async function generatePoster(){
      const btn = document.getElementById('gen-btn');
      const card = document.getElementById('card-source');
      const img = document.getElementById('p-img');

      btn.innerText = "⏳ جاري التحضير...";

      // دخول وضع التصوير
      document.body.classList.add('shooting-mode');
      window.scrollTo(0,0);

      try{
        // انتظر الخطوط
        if(document.fonts && document.fonts.ready){
          await document.fonts.ready;
        }

        // انتظر تحميل الصورة
        if(img && !img.complete){
          await new Promise(res=>{
            img.onload = ()=>res();
            img.onerror = ()=>res();
          });
        }

        // انتظر استقرار الستايل (مهم على Android)
        await new Promise(res=>setTimeout(res, 900));

        const canvas = await html2canvas(card, {
          scale: 3,
          useCORS: true,
          allowTaint: false,
          backgroundColor: "#000",
          logging: false,
          scrollX: 0,
          scrollY: 0
        });

        // رجّع الوضع الطبيعي
        document.body.classList.remove('shooting-mode');
        btn.innerText = "✨ GENERATE IMAGE";

        // حوّلها Blob (أفضل للموبايل)
        canvas.toBlob(blob=>{
          if(!blob){
            alert("Failed to export image. Try again.");
            return;
          }

          LAST_BLOB = blob;

          // عرضها بالـ Modal
          cleanupPreviewUrl();
          LAST_OBJ_URL = URL.createObjectURL(blob);

          document.getElementById('result-img').src = LAST_OBJ_URL;
          document.getElementById('result-modal').style.display = 'flex';

        }, "image/png");

      }catch(err){
        alert("Error: " + err);
        document.body.classList.remove('shooting-mode');
        btn.innerText = "✨ GENERATE IMAGE";
      }
    }
  </script>
</body>
</html>
