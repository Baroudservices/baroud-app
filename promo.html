<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baroud Promo Generator 🛒</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 10px;
            text-align: center;
        }

        /* --- لوحة التحكم (لتكتب المعلومات) --- */
        .controls {
            background: #222; padding: 15px; border-radius: 15px;
            margin-bottom: 20px; border: 1px solid #444; text-align: right;
        }
        .controls h3 { text-align: center; color: #00ffea; margin-top: 0; }
        input, select {
            width: 100%; padding: 10px; margin: 5px 0;
            background: #000; border: 1px solid #555;
            color: #fff; text-align: center; border-radius: 8px;
            box-sizing: border-box; font-size: 1em;
        }

        /* --- كرت الدعاية (النتيجة) --- */
        .promo-card {
            width: 100%;
            max-width: 360px;   /* عرض الموبايل */
            height: 640px;      /* طول الستوري (9:16) */
            background: linear-gradient(160deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 2px solid #333;
            border-radius: 20px;
            margin: auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 30px 20px; box-sizing: border-box;
        }

        /* خلفية نيون خفيفة */
        .glow-bg {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 60%;
            background: radial-gradient(circle, rgba(0,255,234,0.15) 0%, transparent 70%);
            z-index: 0;
        }

        /* رأس الصفحة */
        .header { z-index: 2; text-align: center; width: 100%; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .app-name { font-family: 'Orbitron'; font-size: 1.8em; color: #fff; letter-spacing: 2px; margin: 0; }
        .sub-text { font-size: 0.8em; color: #888; letter-spacing: 4px; text-transform: uppercase; }

        /* صورة الخدمة */
        .img-box {
            z-index: 2;
            width: 220px; height: 220px;
            background: #000;
            border-radius: 30px;
            border: 3px solid #00ffea;
            box-shadow: 0 0 25px rgba(0, 255, 234, 0.3);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        #p-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* العلامة المميزة (التاج) */
        .badge {
            position: absolute; bottom: -15px; background: #00ffea; color: #000;
            padding: 5px 20px; border-radius: 20px; font-weight: bold; font-family: 'Orbitron';
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 0.9em;
        }

        /* تفاصيل العرض */
        .info { z-index: 2; text-align: center; margin-top: 10px; }
        #p-title { font-size: 2em; font-weight: 800; margin: 0; color: #fff; line-height: 1.2; }
        #p-desc { color: #aaa; margin: 5px 0; font-size: 1em; }

        /* السعر */
        .price-tag {
            z-index: 2;
            font-family: 'Orbitron'; font-size: 3.5em; color: #00ffea;
            text-shadow: 0 0 20px rgba(0, 255, 234, 0.6);
            margin: 10px 0; font-weight: bold;
        }

        /* الفوتر (رقمك) */
        .footer {
            z-index: 2; width: 100%;
            background: #222; padding: 12px; border-radius: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            border: 1px solid #444;
        }
        .whatsapp-btn { background: #25d366; color: #fff; padding: 5px 12px; border-radius: 50px; font-weight: bold; font-size: 0.9em; }
        .number { font-family: 'Orbitron'; font-size: 1.2em; letter-spacing: 1px; color: #fff; }

    </style>
</head>
<body>

    <div class="controls">
        <h3>🛠️ مصنع إعلانات الخدمات</h3>
        
        <input type="text" id="in-img" placeholder="رابط صورة الخدمة (Netflix, PUBG...)" oninput="update()">
        
        <input type="text" id="in-title" placeholder="اسم الخدمة (مثلاً: Netflix 4K)" oninput="update()">
        
        <input type="text" id="in-desc" placeholder="وصف صغير (مثلاً: اشتراك شهر كامل - ضمان)" oninput="update()">
        
        <input type="text" id="in-price" placeholder="السعر ($)" oninput="update()">
        
        <select id="in-badge" onchange="update()">
            <option value="PREMIUM">PREMIUM ⭐</option>
            <option value="BEST SELLER">BEST SELLER 🔥</option>
            <option value="INSTANT DELIVERY">تسليم فوري ⚡</option>
            <option value="WARRANTY">كفالة كاملة 🛡️</option>
        </select>
    </div>

    <div class="promo-card">
        <div class="glow-bg"></div>

        <div class="header">
            <h1 class="app-name">BAROUD <span style="color:#00ffea">APP</span></h1>
            <div class="sub-text">DIGITAL STORE SERVICES</div>
        </div>

        <div class="img-box">
            <img id="p-img" src="https://via.placeholder.com/300?text=Service" alt="Service">
            <div class="badge" id="p-badge">PREMIUM ⭐</div>
        </div>

        <div class="info">
            <h2 id="p-title">اسم الخدمة</h2>
            <p id="p-desc">وصف الخدمة هنا</p>
        </div>

        <div class="price-tag" id="p-price">$0</div>

        <div class="footer">
            <div class="whatsapp-btn">ORDER NOW</div>
            <div class="number">70 385 398</div>
        </div>
    </div>

<script>
    function update() {
        // جيب المعلومات
        const img = document.getElementById('in-img').value;
        const title = document.getElementById('in-title').value;
        const desc = document.getElementById('in-desc').value;
        const price = document.getElementById('in-price').value;
        const badge = document.getElementById('in-badge').value;

        // عبيهم بالكرت
        if(img) document.getElementById('p-img').src = img;
        if(title) document.getElementById('p-title').innerText = title;
        if(desc) document.getElementById('p-desc').innerText = desc;
        if(price) document.getElementById('p-price').innerText = '$' + price;
        document.getElementById('p-badge').innerText = badge;
    }
</script>

</body>
</html>
