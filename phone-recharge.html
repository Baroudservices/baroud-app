<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baroud | Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --neon-blue: #38bdf8; --bg-dark: #020508; }
    body { 
      margin: 0; 
      font-family: 'Cairo', sans-serif; 
      background: var(--bg-dark); 
      color: #fff; 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center;
      overflow: hidden;
    }
    .m-box { padding: 20px; max-width: 400px; }
    .icon { 
      font-size: 60px; 
      margin-bottom: 20px; 
      filter: drop-shadow(0 0 10px var(--neon-blue));
      animation: pulse 2s infinite;
    }
    h1 { font-family: 'Orbitron'; font-weight: 900; color: var(--neon-blue); letter-spacing: 2px; font-size: 24px; }
    p { opacity: 0.7; font-size: 14px; line-height: 1.6; }
    .loader {
      width: 40px; height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.1);
      border-top: 3px solid var(--neon-blue);
      border-radius: 50%;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<div class="m-box">
  <div class="icon">🛠️</div>
  <h1>UNDER MAINTENANCE</h1>
  <p>عم نحدّث أسعار التشريج ونطور السستم كرمال نخدمكم بشكل أسرع. <br> دقائق وبنرجع معكم!</p>
  <div class="loader"></div>
  <p style="font-size: 10px; font-family: 'Orbitron'; margin-top: 30px; opacity: 0.3;">BAROUD APP v2.0</p>
</div>

</body>
</html>
