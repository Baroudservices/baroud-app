<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Recharge System</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --neon-blue: #38bdf8; --bg-dark: #020508; --card-bg: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: #fff; min-height: 100vh; padding: 15px; }
    .wrap { max-width: 450px; margin: 0 auto; padding-bottom: 50px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .balance-box { background: rgba(56, 189, 248, 0.1); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); font-family: 'Orbitron'; font-size: 13px; color: var(--neon-blue); font-weight: 900; }
    
    /* إلغاء السلايد وجعل الأقسام تظهر بصفوف */
    .f-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .f-pill { padding: 8px 5px; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--border); font-size: 10px; font-weight: 900; cursor: pointer; text-align: center; transition: 0.3s; font-family: 'Orbitron'; }
    .f-pill.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .card-info { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid var(--border); }
    .card-title { font-weight: 700; font-size: 12px; }
    .card-price { color: var(--neon-blue); font-family: 'Orbitron'; font-weight: 900; font-size: 14px; }
    .buy-btn { background: var(--neon-blue); color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 900; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; }

    .ct-container { background: rgba(56, 189, 248, 0.05); border: 1px dashed var(--neon-blue); border-radius: 20px; padding: 15px; }
    .ct-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 900; outline: none; margin-bottom: 10px; text-align: center; }
    .ct-res { text-align: center; font-size: 28px; font-weight: 900; color: var(--neon-blue); margin: 10px 0; font-family: 'Orbitron'; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="top-nav">
    <div onclick="history.back()" style="cursor:pointer; font-size: 20px;">←</div>
    <div class="balance-box" id="userBalance">0.00 🇱🇧</div>
  </div>

  <h2 id="pageTitle" style="font-family:'Orbitron'; font-weight:900; font-size:20px; margin-bottom:15px;">RECHARGE</h2>
  
  <div class="f-grid">
    <div class="f-pill active" data-cat="ALFA CARDS">Alfa Cards</div>
    <div class="f-pill" data-cat="TOUCH CARDS">Touch Cards</div>
    <div class="f-pill" data-cat="INTERNET">Internet</div>
    <div class="f-pill" data-cat="USHARE">uShare</div>
    <div class="f-pill" data-cat="ALFA CREDIT">Alfa Credit</div>
    <div class="f-pill" data-cat="MTC CREDIT">Mtc Credit</div>
  </div>

  <div id="product-list"></div>

  <div id="ct-panel" style="display:none;">
    <div class="ct-container">
      <input type="number" id="ctAmt" class="ct-input" placeholder="Amount ($)">
      <input type="number" id="ctPhone" class="ct-input" placeholder="Phone Number">
      <div class="ct-res" id="ctTotalDisplay">$0.00</div>
      <button class="buy-btn" style="width:100%; padding:12px; font-size:12px;">CONFIRM TRANSFER</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let activeFilter = "ALFA CARDS";

  async function loadBalance() {
    const { data: { session } } = await sb.auth.getSession();
    if(session) {
      const { data } = await sb.from('profiles').select('balance').eq('id', session.user.id).single();
      if(data) document.getElementById('userBalance').innerText = `${data.balance.toFixed(2)} 🇱🇧`;
    }
  }

  async function fetchPlans() {
    const listEl = document.getElementById('product-list');
    const ctEl = document.getElementById('ct-panel');
    
    if(activeFilter.includes("CREDIT")) {
      listEl.innerHTML = ""; ctEl.style.display = "block"; return;
    }
    
    ctEl.style.display = "none";
    listEl.innerHTML = "<p style='text-align:center; opacity:0.3; font-size:12px; padding:20px;'>Loading...</p>";

    // الربط بين الجداول لجلب الـ Plans بناءً على نوع المنتج
    const { data: plans, error } = await sb.from('product_plan_prices')
      .select(`*, products!inner(title, category)`)
      .eq('products.category', 'Phone recharge')
      .ilike('products.title', `%${activeFilter.split(' ')[0]}%`) // يأخذ أول كلمة (Alfa أو Touch)
      .eq('active', true);

    if(!plans || plans.length === 0) {
      listEl.innerHTML = "<p style='text-align:center; opacity:0.5; padding:20px;'>No Items Found.</p>";
      return;
    }

    listEl.innerHTML = plans.map(p => `
      <div class="card">
        <div class="card-info">
          <div class="card-icon">${activeFilter.includes('ALFA') ? '🔴' : '🔵'}</div>
          <div>
            <div class="card-title">${p.plan_label}</div>
            <div class="card-price">$${p.price.toFixed(2)}</div>
          </div>
        </div>
        <button class="buy-btn" onclick="location.href='order.html?plan_id=${p.id}'">BUY</button>
      </div>
    `).join('');
  }

  document.getElementById('ctAmt').oninput = (e) => {
    const val = parseFloat(e.target.value) || 0;
    const rate = activeFilter === 'ALFA CREDIT' ? 1.44 : 1.39;
    document.getElementById('ctTotalDisplay').innerText = `$${(val * rate).toFixed(2)}`;
  };

  document.querySelectorAll('.f-pill').forEach(pill => {
    pill.onclick = () => {
      document.querySelectorAll('.f-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = pill.dataset.cat;
      fetchPlans();
    };
  });

  loadBalance();
  fetchPlans();
</script>
</body>
</html>
