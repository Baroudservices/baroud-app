<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Recharge</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-blue: #38bdf8;
      --neon-pink: #f472b6;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    /* ===== HEADER & WALLET ===== */
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .back-btn {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .wallet-status {
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 8px 15px; border-radius: 12px; display: flex; align-items: center; gap: 8px;
    }
    .balance-val { color: var(--neon-blue); font-weight: 900; font-size: 14px; }

    /* ===== FILTERS ===== */
    .filters-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0 15px; scrollbar-width: none; }
    .filters-scroll::-webkit-scrollbar { display: none; }
    .f-pill {
      flex: 0 0 auto; padding: 10px 20px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      font-size: 12px; font-weight: 900; cursor: pointer; transition: 0.3s;
    }
    .f-pill.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); }

    /* ===== PRODUCT LIST ===== */
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 15px; display: flex; align-items: center; justify-content: space-between;
    }
    .item-info { display: flex; align-items: center; gap: 15px; }
    .item-icon { width: 45px; height: 45px; background: rgba(255,255,255,0.03); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .item-title { font-weight: 900; font-size: 14px; color: #fff; }
    .item-price { font-weight: 900; color: var(--neon-blue); font-size: 15px; }

    .buy-btn {
      background: linear-gradient(90deg, #0aa0ff, #2a74ff); border: none;
      color: #fff; padding: 8px 18px; border-radius: 10px; font-weight: 900; font-size: 12px; cursor: pointer;
    }

    /* ===== CREDIT TRANSFER SECTION ===== */
    .ct-card { background: rgba(56, 189, 248, 0.05); border: 1px dashed var(--neon-blue); border-radius: 24px; padding: 20px; margin-top: 10px; }
    .ct-input-group { margin-bottom: 15px; }
    .ct-label { font-size: 11px; opacity: 0.6; margin-bottom: 8px; display: block; font-family: 'Cairo'; }
    .ct-input {
      width: 100%; background: var(--glass); border: 1px solid var(--glass-border);
      padding: 14px; border-radius: 14px; color: #fff; font-weight: 900; font-size: 16px; outline: none;
    }
    .ct-total-box { text-align: center; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 15px; margin-top: 15px; }

    /* ===== MODAL ===== */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #0f172a; border: 1px solid var(--neon-blue); border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; }
    .m-input { width: 100%; background: var(--glass); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: #fff; margin: 10px 0; outline: none; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top-row">
      <div class="back-btn" onclick="location.href='services.html'">←</div>
      <div class="wallet-status">
        <span style="color:#ffd700">★</span>
        <span class="balance-val" id="userBalance">0.00 🇱🇧</span>
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <h2 style="margin:0; font-weight:900; font-size:22px; letter-spacing:1px;">RECHARGE</h2>
      <p style="margin:5px 0 0; font-family:'Cairo'; font-size:12px; opacity:0.6;">Alfa, Touch, and Credit Transfer</p>
    </div>

    <div class="filters-scroll" id="mainFilters">
      <div class="f-pill active" data-mode="ALFA">ALFA</div>
      <div class="f-pill" data-mode="MTC">TOUCH</div>
      <div class="f-pill" data-mode="CREDIT_TRANSFER">CREDIT TRANSFER</div>
    </div>

    <div class="filters-scroll" id="subFilters">
      <div class="f-pill active" data-sub="CARDS">Cards</div>
      <div class="f-pill" data-sub="USHARE">uShare</div>
      <div class="f-pill" data-sub="INTERNET">Internet</div>
    </div>

    <div id="rechargeList" class="list"></div>

    <div id="ctPanel" class="ct-card" style="display:none;">
      <div class="ct-input-group">
        <span class="ct-label">Amount to Send ($)</span>
        <input type="number" id="ctAmt" class="ct-input" placeholder="0.00">
      </div>
      <div class="ct-input-group">
        <span class="ct-label">Recipient Phone Number</span>
        <input type="number" id="ctPhone" class="ct-input" placeholder="70123456">
      </div>
      <div class="ct-total-box">
        <div style="font-size:11px; opacity:0.5; margin-bottom:5px;">Total Cost</div>
        <div style="font-size:24px; font-weight:900; color:var(--neon-blue);" id="ctTotalDisplay">$0.00</div>
      </div>
      <button class="buy-btn" id="ctBuyBtn" style="width:100%; margin-top:15px; padding:15px;">CONFIRM TRANSFER</button>
    </div>
  </div>

  <div class="modal" id="buyModal">
    <div class="modal-content">
      <h3 style="margin:0; font-weight:900; color:var(--neon-blue); text-align:center;">CONFIRM ORDER</h3>
      <div id="modalInfo" style="text-align:center; margin:15px 0; font-size:14px; opacity:0.8;"></div>
      <input type="number" id="mPhone" class="m-input" placeholder="Phone Number">
      <input type="text" id="mNote" class="m-input" placeholder="Note (Optional)">
      <div id="mError" style="color:#ef4444; font-size:11px; text-align:center; margin-bottom:10px;"></div>
      <div style="display:flex; gap:10px;">
        <button class="f-pill" style="flex:1;" onclick="closeModal()">CANCEL</button>
        <button class="buy-btn" id="confirmBtn" style="flex:1;">BUY NOW</button>
      </div>
    </div>
  </div>
 <div id="maintenance-screen" style="display: none; position: fixed; inset: 0; background: #020508; z-index: 999999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; font-family: 'Orbitron', 'Cairo', sans-serif;">
    <div style="font-size: 60px; margin-bottom: 20px;">🛠️</div>
    <h1 style="color: #00f2ff; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">UNDER MAINTENANCE</h1>
    <p style="color: #fff; font-family: 'Cairo'; opacity: 0.8; max-width: 300px; line-height: 1.6;">
        نحن نقوم بتحديث الخدمات لنمنحك تجربة أفضل. <br> 
        سنعود خلال وقت قصير جداً!
    </p>
    <div style="margin-top: 30px; font-size: 10px; color: #fff; opacity: 0.3; letter-spacing: 5px;">BAROUDAPP.COM</div>
</div>

<script>
    // هيدا هو المفتاح:
    // حط false عشان تفتح الصفحة طبيعي
    // حط true عشان تسكر الصفحة وتعمل صيانة
    const maintenanceMode = true; 

    if (maintenanceMode) {
        document.getElementById('maintenance-screen').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
</script>

<script>
    // حط false لفتح الصفحة، و true للصيانة
    const maintenanceMode = false; 

    if (maintenanceMode) {
        document.getElementById('maintenance-screen').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentMode = "ALFA";
  let currentSub = "CARDS";
  let activeProduct = null;
  let allPlans = [];

  async function updateBalance() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data } = await sb.from('profiles').select('balance').eq('id', session.user.id).single();
      if(data) document.getElementById('userBalance').innerText = `${Number(data.balance || 0).toFixed(2)} 🇱🇧`;
    }
  }

  async function loadItems() {
    const list = document.getElementById('rechargeList');
    const ctPanel = document.getElementById('ctPanel');
    const subFilters = document.getElementById('subFilters');

    if (currentMode === 'CREDIT_TRANSFER') {
      list.innerHTML = "";
      subFilters.style.display = "none";
      ctPanel.style.display = "block";
      return;
    }

    ctPanel.style.display = "none";
    subFilters.style.display = "flex";
    list.innerHTML = "<div style='text-align:center; opacity:0.5; padding:20px;'>Searching for " + currentMode + " " + currentSub + "...</div>";

    // تصحيح البحث: منفتش على النوعين Alfa و MTC حسب الفئة المختارة
    let searchQuery = `%${currentMode}%${currentSub}%`;
    
    // سحب المنتجات التي تطابق الفئة
    const { data: prods, error: err } = await sb
        .from('products')
        .select('id, title')
        .ilike('title', searchQuery)
        .eq('active', true);

    if (err) { console.error(err); return; }

    if (prods && prods.length > 0) {
      // مناخد أول منتج بيطلع معنا كـ Active Product
      activeProduct = prods[0];
      
      // سحب كل الـ Plans لهالمنتجات
      const prodIds = prods.map(p => p.id);
      const { data: plans } = await sb
        .from('product_plan_prices')
        .select('*')
        .in('product_id', prodIds)
        .eq('active', true)
        .order('price', {ascending:true});

      allPlans = plans || [];
      renderPlans(allPlans);
    } else {
      list.innerHTML = `<div style='text-align:center; opacity:0.3; padding:40px; font-size:12px;'>
        No products found for ${currentMode} ${currentSub}<br>
        Check names in Database
      </div>`;
    }
  }

  function renderPlans(plans) {
    const list = document.getElementById('rechargeList');
    if(plans.length === 0) {
        list.innerHTML = "<div style='text-align:center; opacity:0.5;'>No plans available.</div>";
        return;
    }
    list.innerHTML = plans.map(p => `
      <div class="item-card">
        <div class="item-info">
          <div class="item-icon">${currentMode === 'ALFA' ? '🔴' : '🔵'}</div>
          <div>
            <div class="item-title">${p.plan_label}</div>
            <div class="item-price">$${Number(p.price).toFixed(2)}</div>
          </div>
        </div>
        <button class="buy-btn" onclick="openBuyModal('${p.plan_label}', ${p.price}, ${p.product_id})">BUY</button>
      </div>
    `).join('');
  }

  // Credit Transfer logic
  const ctAmtInput = document.getElementById('ctAmt');
  if(ctAmtInput) {
      ctAmtInput.oninput = () => {
        const val = parseFloat(ctAmtInput.value) || 0;
        const multiplier = currentMode === 'ALFA' ? 1.30 : 1.25; 
        document.getElementById('ctTotalDisplay').innerText = `$${(val * multiplier).toFixed(2)}`;
      };
  }

  function openBuyModal(label, price, prodId) {
    activeProduct = { id: prodId, selectedPlan: label, selectedPrice: price };
    document.getElementById('modalInfo').innerText = `${label} - $${price.toFixed(2)}`;
    document.getElementById('buyModal').style.display = 'flex';
  }

  function closeModal() { document.getElementById('buyModal').style.display = 'none'; }

  // Listeners
  document.querySelectorAll('#mainFilters .f-pill').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#mainFilters .f-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      loadItems();
    }
  });

  document.querySelectorAll('#subFilters .f-pill').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#subFilters .f-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSub = btn.dataset.sub;
      loadItems();
    }
  });

  updateBalance();
  loadItems();
</script>

</body>
</html>
