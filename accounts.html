<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Accounts</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --neon-cyan: #00f2ff;
      --neon-green: #2ecc71; /* لون الموزع */
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; text-decoration: none;
    }
    .page-title { font-weight: 900; font-size: 20px; letter-spacing: 2px; }

    .search-container {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px 20px; margin-bottom: 25px;
      display: flex; align-items: center;
    }
    .search-container input {
      background: none; border: none; color: #fff; width: 100%;
      font-family: 'Cairo'; font-size: 15px; outline: none;
    }

    .products-list { display: flex; flex-direction: column; gap: 15px; }
    
    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px;
      display: flex; align-items: center; gap: 15px;
      transition: 0.3s; cursor: pointer;
    }
    .card:active { transform: scale(0.98); border-color: var(--neon-cyan); }

    .card-img { width: 60px; height: 60px; border-radius: 15px; object-fit: cover; background: #000; }

    .card-body { flex: 1; }
    .card-name { font-weight: 900; font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
    
    .badge-row { display: flex; gap: 5px; margin-top: 2px; }
    .pill { 
      font-size: 8px; padding: 2px 6px; border-radius: 5px; 
      background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.1);
      font-weight: 700; color: var(--neon-cyan);
    }
    /* ستايل الموزع */
    .pill.reseller-pill { color: var(--neon-green); border-color: var(--neon-green); background: rgba(46, 204, 113, 0.05); }

    .card-footer { text-align: right; }
    .card-price { color: var(--neon-cyan); font-weight: 900; font-size: 15px; display: block; }
    .reseller-price { color: var(--neon-green) !important; }
    
    .open-btn {
      margin-top: 4px; padding: 4px 10px; border-radius: 8px; background: var(--neon-cyan);
      color: #000; font-weight: 900; font-size: 9px; border: none;
    }
    .reseller-btn { background: var(--neon-green); }

    .shimmer-card {
      height: 85px; width: 100%; border-radius: 20px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%; animation: loading 1.5s infinite;
      margin-bottom: 15px;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .footer-text { text-align: center; margin-top: 40px; opacity: 0.1; font-size: 10px; letter-spacing: 5px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top-nav">
      <div class="btn-circle" onclick="history.back()">←</div>
      <div class="page-title">ACCOUNTS</div>
      <div class="btn-circle" onclick="location.href='services.html'">🏠</div>
    </div>

    <div class="search-container">
      <input type="text" id="q" placeholder="Search (Netflix, Shahid, IPTV...)">
    </div>

    <div class="products-list" id="grid"></div>

    <div class="footer-text">BAROUDAPP.COM</div>
  </div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  let userRole = 'user'; // الافتراضي

  function showLoading() {
    grid.innerHTML = Array(5).fill('<div class="shimmer-card"></div>').join('');
  }

  function render(list) {
    grid.innerHTML = "";
    if(!list.length) {
      grid.innerHTML = `<div style="text-align:center; opacity:0.5; padding:50px; font-family:'Cairo';">لم يتم العثور على نتائج</div>`;
      return;
    }

    list.forEach(it => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => location.href = `account.html?id=${it.id}`;
      
      // منطق السعر: إذا كان موزع استعمل السعر التاني
      const displayPrice = (userRole === 'reseller') ? (it.reseller_price || it.price) : it.price;
      const isResellerStyle = (userRole === 'reseller') ? 'reseller-price' : '';

      card.innerHTML = `
        <img class="card-img" src="assets/products/${it.id}.jpg" onerror="this.src='https://placehold.co/100x100/020508/00f2ff?text=${encodeURIComponent(it.title)}'">
        <div class="card-body">
          <div class="card-name">${it.title}</div>
          <div class="badge-row">
            <span class="pill ${userRole === 'reseller' ? 'reseller-pill' : ''}">${userRole === 'reseller' ? 'VIP PRICE' : 'PREMIUM'}</span>
            <span class="pill">INSTANT</span>
          </div>
        </div>
        <div class="card-footer">
          <div class="card-price ${isResellerStyle}">$${Number(displayPrice).toFixed(2)}</div>
          <button class="open-btn ${userRole === 'reseller' ? 'reseller-btn' : ''}">OPEN</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function getUserRole() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: profile } = await sb.from("profiles").select("role").eq("id", session.user.id).single();
      if (profile) userRole = profile.role;
    }
  }

  async function loadProducts() {
    // جلب المنتجات مع كل الأعمدة (بما فيها السعر التاني)
    const { data, error } = await sb
      .from("products_with_min_price")
      .select("id, title, category, min_price, reseller_price")
      .eq("active", true)
      .eq("category", "Accounts")
      .order('title', { ascending: true });

    if(error) throw error;
    return data.map(p => ({
      id: p.id,
      title: p.title,
      price: p.min_price || 0,
      reseller_price: p.reseller_price || 0
    }));
  }

  let allProducts = [];
  (async () => {
    showLoading();
    try {
      await getUserRole(); // أول خطوة نعرف مين الزبون
      allProducts = await loadProducts();
      render(allProducts);

      q.oninput = () => {
        const val = q.value.toLowerCase().trim();
        render(allProducts.filter(p => p.title.toLowerCase().includes(val)));
      };
    } catch(e) {
      console.error(e);
      grid.innerHTML = `<div style="text-align:center; color:#ff4444; padding:20px;">Error loading data.</div>`;
    }
  })();
</script>
</body>
</html>
