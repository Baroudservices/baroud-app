<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Accounts</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --neon-cyan: #00f2ff;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 15px;
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding-bottom: 100px; }

    /* ===== TOP NAVIGATION ===== */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 20px;
    }
    .back-btn {
      background: var(--glass); border: 1px solid var(--glass-border);
      color: #fff; padding: 10px 15px; border-radius: 12px;
      font-weight: 700; cursor: pointer; font-family: 'Cairo';
    }
    .page-title { font-weight: 900; font-size: 22px; letter-spacing: 2px; }

    /* ===== SEARCH BAR ===== */
    .search-box {
      background: #fff; border-radius: 16px; padding: 5px 20px;
      margin-bottom: 25px; display: flex; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .search-box input {
      width: 100%; height: 50px; background: none; border: none;
      color: #000; font-size: 15px; font-weight: 700; font-family: 'Cairo';
      outline: none;
    }

    /* ===== GRID & CARDS ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 24px; overflow: hidden; position: relative;
      transition: 0.3s; cursor: pointer; display: flex; flex-direction: column;
    }
    .card:active { transform: scale(0.96); border-color: var(--neon-cyan); }

    .img-wrap { width: 100%; height: 130px; background: #000; overflow: hidden; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
    .card-name { font-weight: 900; font-size: 14px; line-height: 1.2; text-transform: uppercase; }
    
    .badge-row { display: flex; gap: 5px; }
    .pill { 
      font-size: 9px; padding: 3px 8px; border-radius: 6px; 
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      font-weight: 700;
    }

    .price-row {
      margin-top: auto; display: flex; justify-content: space-between;
      align-items: center; padding-top: 5px;
    }
    .price-tag { font-weight: 900; font-size: 15px; color: var(--neon-cyan); }
    .open-btn {
      background: var(--neon-cyan); color: #000; border: none;
      padding: 8px 12px; border-radius: 10px; font-weight: 900; font-size: 10px;
    }

    /* ===== SKELETON LOADING ===== */
    .skeleton { background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
    .skeleton::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .footer { text-align: center; margin-top: 40px; opacity: 0.1; font-size: 10px; letter-spacing: 5px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top-nav">
      <button class="back-btn" onclick="history.back()">Back</button>
      <div class="page-title">ACCOUNTS</div>
      <div style="width: 50px;"></div> </div>

    <div class="search-box">
      <input id="q" placeholder="Search (Netflix, Shahid, IPTV...)">
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">BAROUDAPP.COM</div>
  </div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");

  // Show Skeletons
  function showLoading() {
    grid.innerHTML = Array(6).fill(0).map(() => `
      <div class="card">
        <div class="img-wrap skeleton"></div>
        <div class="card-body">
          <div class="skeleton" style="height:15px; width:80%; border-radius:4px;"></div>
          <div class="skeleton" style="height:10px; width:40%; border-radius:4px; margin-top:10px;"></div>
          <div class="price-row">
            <div class="skeleton" style="height:20px; width:30%; border-radius:4px;"></div>
            <div class="skeleton" style="height:30px; width:40%; border-radius:10px;"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function render(list) {
    grid.innerHTML = "";
    if(!list.length) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; opacity:0.5; padding:50px;">No matches found.</div>`;
      return;
    }

    list.forEach(it => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => location.href = `account.html?id=${it.id}`;
      
      card.innerHTML = `
        <div class="img-wrap">
          <img src="assets/products/${it.id}.jpg" onerror="this.src='https://placehold.co/400x300/020508/00f2ff?text=${it.title}'">
        </div>
        <div class="card-body">
          <div class="card-name">${it.title}</div>
          <div class="badge-row">
            <span class="pill">INSTANT</span>
            <span class="pill">${it.category || 'ACCOUNT'}</span>
          </div>
          <div class="price-row">
            <div class="price-tag">$${Number(it.price).toFixed(2)}</div>
            <button class="open-btn">OPEN</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function loadProducts() {
    const { data, error } = await sb
      .from("products_with_min_price")
      .select("id, title, category, min_price")
      .eq("active", true)
      .eq("category", "Accounts")
      .order('title', { ascending: true });

    if(error) throw error;
    return data.map(p => ({
      id: p.id,
      title: p.title,
      category: p.category,
      price: p.min_price || 0
    }));
  }

  let allProducts = [];
  (async () => {
    showLoading();
    try {
      allProducts = await loadProducts();
      render(allProducts);

      q.oninput = () => {
        const val = q.value.toLowerCase().trim();
        render(allProducts.filter(p => p.title.toLowerCase().includes(val)));
      };
    } catch(e) {
      grid.innerHTML = `<div style="grid-column: 1/-1; color:red; text-align:center;">Error loading data.</div>`;
    }
  })();
</script>
</body>
</html>
