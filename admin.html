<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Deposit Requests</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">

<style>
:root {
  --neon-blue: #0aa0ff;
  --neon-green: #22c55e;
  --neon-red: #ef4444;
  --neon-yellow: #fbbf24;
  --bg-dark: #060b14;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
}

body {
  margin:0; font-family: 'Cairo', sans-serif;
  background: var(--bg-dark); color: #fff; padding: 15px;
}

.wrap { max-width: 1100px; margin: auto; }

/* HEADER */
.top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border);
}
h2 { margin: 0; font-family: 'Orbitron'; font-size: 18px; color: var(--neon-blue); letter-spacing: 1px; }

.btn {
  padding: 10px 18px; border-radius: 12px; border: 1px solid var(--glass-border);
  cursor: pointer; background: var(--glass); color: #fff; font-weight: 700; font-size: 13px;
}
.btn:hover { background: rgba(255,255,255,0.1); }

/* TABLE STYLE */
.table-card {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 20px; overflow-x: auto; backdrop-filter: blur(10px);
}

table { width: 100%; border-collapse: collapse; min-width: 800px; }
th { 
  background: rgba(0,0,0,0.2); color: var(--neon-blue); text-transform: uppercase; 
  font-size: 11px; font-weight: 900; padding: 15px 10px; text-align: left;
}
td { padding: 15px 10px; border-bottom: 1px solid var(--glass-border); font-size: 13px; }

/* STATUS COLORS */
.status { font-weight: 900; font-size: 11px; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; }
.ok { color: var(--neon-green); background: rgba(34, 197, 94, 0.1); box-shadow: 0 0 8px rgba(34, 197, 94, 0.2); }
.no { color: var(--neon-red); background: rgba(239, 68, 68, 0.1); box-shadow: 0 0 8px rgba(239, 68, 68, 0.2); }
.pending { color: var(--neon-yellow); background: rgba(251, 191, 36, 0.1); box-shadow: 0 0 8px rgba(251, 191, 36, 0.2); }

/* ACTION BUTTONS */
.actionBtn {
  width: 35px; height: 35px; border-radius: 10px; border: 1px solid var(--glass-border);
  cursor: pointer; color: #fff; display: inline-flex; align-items: center; justify-content: center;
  transition: 0.2s; font-weight: bold;
}
.okBtn { background: rgba(34, 197, 94, 0.15); color: var(--neon-green); border-color: rgba(34, 197, 94, 0.3); }
.noBtn { background: rgba(239, 68, 68, 0.15); color: var(--neon-red); border-color: rgba(239, 68, 68, 0.3); }
.viewBtn { 
    background: var(--neon-blue); color: #fff; text-decoration: none; font-size: 10px; 
    padding: 5px 10px; border-radius: 8px; font-weight: 900;
}

.actionBtn:hover { transform: scale(1.1); }

.small { opacity: 0.5; font-size: 11px; }
.notice {
  margin-bottom: 15px; padding: 12px; border-radius: 12px;
  background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
  color: #fca5a5; font-size: 12px; font-weight: 700;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <h2>DEPOSIT REQUESTS</h2>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="btnRefresh">Refresh</button>
      <button class="btn" id="btnLogout" style="color:var(--neon-red)">Logout</button>
    </div>
  </div>

  <div id="notice" class="notice" style="display:none;"></div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th style="width:60px">ID</th>
          <th>User</th>
          <th>Amount</th>
          <th>Method</th>
          <th>Status</th>
          <th>Transfer #</th>
          <th>Receipt</th>
          <th style="width:100px">Action</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p id="empty" style="display:none; text-align:center; opacity:0.5; margin-top:30px;">No deposit requests found.</p>
</div>

<script>
/* نفس الـ Logic البرمجي تبعك من دون تعديل على الوظائف لضمان استقرار الربط مع Supabase */
const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const rowsEl = document.getElementById("rows");
const emptyEl = document.getElementById("empty");
const btnRefresh = document.getElementById("btnRefresh");
const btnLogout = document.getElementById("btnLogout");
const noticeEl = document.getElementById("notice");

function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function showNotice(text){
  noticeEl.style.display = text ? "block" : "none";
  noticeEl.textContent = text || "";
}

async function requireSession(){
  const { data: s } = await sb.auth.getSession();
  if(!s?.session) { location.href="login.html"; return null; }
  return s.session;
}

async function requireAdmin(session){
  const { data: profile } = await sb.from("profiles").select("is_admin").eq("id", session.user.id).single();
  return profile?.is_admin === true;
}

async function load(){
  showNotice("");
  rowsEl.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:40px;">Loading Data...</td></tr>`;
  
  try{
    const session = await requireSession();
    if(!session) return;
    if(!(await requireAdmin(session))) return;

    const { data, error } = await sb.from("deposits").select("*").order("created_at", { ascending:false });
    if(error) throw error;

    if(!data.length){
      rowsEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";
    rowsEl.innerHTML = data.map(d => {
      const st = (d.status || "pending").toLowerCase();
      const stClass = st === "approved" ? "ok" : st === "rejected" ? "no" : "pending";
      const receipt = d.receipt_url || d.receipt_path || "";
      
      return `
        <tr>
          <td class="small">#${d.id}</td>
          <td><div style="font-weight:700">${d.user_id.slice(0,8)}...</div></td>
          <td style="color:var(--neon-blue); font-weight:900">$${d.amount}</td>
          <td><span class="small">${esc(d.method)}</span></td>
          <td><span class="status ${stClass}">${st}</span></td>
          <td><span style="font-family:monospace; font-weight:900">${esc(d.transfer_number || "—")}</span></td>
          <td>
            ${receipt ? `<a class="viewBtn" href="${esc(receipt)}" target="_blank">VIEW</a>` : `<span class="small">—</span>`}
          </td>
          <td>
            <div style="display:flex; gap:5px;">
              <button class="actionBtn okBtn" data-id="${d.id}" data-status="approved">✔</button>
              <button class="actionBtn noBtn" data-id="${d.id}" data-status="rejected">✖</button>
            </div>
          </td>
        </tr>`;
    }).join("");

  } catch(e) {
    rowsEl.innerHTML = `<tr><td colspan="8" style="color:var(--neon-red); text-align:center;">Error loading deposits.</td></tr>`;
  }
}

async function setStatus(rawId, status){
  try {
    setBusy(true);
    const { error } = await sb.from("deposits").update({ 
        status, 
        updated_at: new Date().toISOString(),
        approved_at: status === "approved" ? new Date().toISOString() : null 
    }).eq("id", rawId);

    if(error) throw error;
    await load();
  } catch(e) {
    alert("Update failed: " + e.message);
  } finally {
    setBusy(false);
  }
}

function setBusy(isBusy){
  btnRefresh.disabled = isBusy;
  rowsEl.querySelectorAll("button").forEach(b => b.disabled = isBusy);
}

rowsEl.addEventListener("click", (ev)=>{
  const btn = ev.target.closest("button[data-id]");
  if(btn) setStatus(btn.dataset.id, btn.dataset.status);
});

btnRefresh.onclick = load;
btnLogout.onclick = async () => { await sb.auth.signOut(); location.href="login.html"; };

load();
</script>
</body>
</html>
