<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Binance Deposit</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-yellow: #f3ba2f; /* لون بينانس الرسمي */
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px; }

    /* ===== TOPBAR ===== */
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .back-btn {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .balance-pill {
      background: var(--glass); padding: 8px 15px; border-radius: 20px;
      border: 1px solid var(--glass-border); font-weight: 900; font-size: 14px;
    }

    /* ===== HERO CARD ===== */
    .hero {
      background: linear-gradient(135deg, rgba(243,186,47,0.1) 0%, rgba(0,0,0,0) 100%);
      border: 1px solid rgba(243,186,47,0.2);
      border-radius: 24px; padding: 20px; margin-bottom: 20px;
    }
    .hero h1 { margin: 0; font-size: 20px; color: var(--neon-yellow); }
    .hero p { margin: 5px 0 0; font-size: 12px; opacity: 0.7; font-family: 'Cairo'; }

    /* ===== INPUT GROUP ===== */
    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 18px; margin-bottom: 15px;
    }
    .label { font-size: 12px; font-weight: 700; opacity: 0.6; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    
    .value-box {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,0.3); padding: 12px 15px; border-radius: 15px;
      border: 1px solid var(--glass-border); font-family: monospace; font-size: 18px;
    }
    .copy-btn {
      background: var(--neon-yellow); color: #000; border: none;
      padding: 6px 12px; border-radius: 8px; font-weight: 900; font-size: 11px; cursor: pointer;
    }

    .input-field {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      padding: 15px; border-radius: 15px; color: #fff; font-weight: 900;
      font-size: 16px; outline: none; margin-bottom: 15px;
    }
    .input-field:focus { border-color: var(--neon-yellow); }

    /* ===== FILE UPLOAD ===== */
    .file-area {
      border: 2px dashed var(--glass-border); border-radius: 15px;
      padding: 20px; text-align: center; cursor: pointer; transition: 0.3s;
    }
    .file-area:active { background: rgba(255,255,255,0.02); }
    .preview-img { width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid var(--neon-yellow); }

    .action-btn {
      width: 100%; padding: 18px; border-radius: 18px; border: none;
      background: var(--neon-yellow); color: #000; font-weight: 900;
      font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    .action-btn:disabled { opacity: 0.5; filter: grayscale(1); }

    .status-msg { text-align: center; margin-top: 15px; font-size: 13px; font-family: 'Cairo'; font-weight: 700; }
    .status-msg.ok { color: #00ff88; }
    .status-msg.err { color: #ff4d4d; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <div class="back-btn" onclick="history.back()">←</div>
      <div class="balance-pill" id="balanceText">0.00 🇱🇧</div>
    </div>

    <div class="hero">
      <h1>Binance Pay</h1>
      <p>حوّل المبلغ المطلوب وارفع صورة الإيصال</p>
    </div>

    <div class="card">
      <div class="label">Binance ID / Number</div>
      <div class="value-box">
        <span id="targetNo">300169104</span>
        <button class="copy-btn" onclick="copyNum()">COPY</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Deposit Amount ($)</div>
      <input type="number" id="amt" class="input-field" placeholder="0.00" inputmode="decimal">

      <div class="label">Payment Receipt</div>
      <label class="file-area" for="fileInput">
        <div id="fileText" style="font-family:'Cairo'; font-size: 14px;">اضغط هنا لرفع صورة الوصل</div>
        <img id="prev" class="preview-img">
      </label>
      <input type="file" id="fileInput" hidden accept="image/*">

      <button class="action-btn" id="submitBtn">SEND REQUEST</button>
      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // التحقق من الرصيد والجلسة
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.replace('login.html'); return; }

      const { data } = await sb.from('profiles').select('balance').eq('id', session.user.id).single();
      if (data) document.getElementById('balanceText').innerText = `${data.balance.toFixed(2)} 🇱🇧`;
    }

    function copyNum() {
      navigator.clipboard.writeText("300169104");
      document.getElementById('status').innerText = "تم النسخ ✅";
      setTimeout(() => document.getElementById('status').innerText = "", 2000);
    }

    // معاينة الصورة
    document.getElementById('fileInput').onchange = function() {
      const file = this.files[0];
      if (file) {
        document.getElementById('fileText').innerText = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.getElementById('prev');
          img.src = e.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('submitBtn').onclick = async function() {
      const btn = this;
      const status = document.getElementById('status');
      const amount = parseFloat(document.getElementById('amt').value);
      const file = document.getElementById('fileInput').files[0];

      if (!amount || amount <= 0) { status.innerText = "يرجى إدخال مبلغ صحيح"; return; }
      if (!file) { status.innerText = "يرجى إرفاق صورة الوصل"; return; }

      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";

      try {
        const { data: { user } } = await sb.auth.getUser();
        
        // 1. رفع الصورة
        const fileName = `${user.id}/${Date.now()}.jpg`;
        const { data: upData, error: upErr } = await sb.storage.from('receipts').upload(fileName, file);
        if (upErr) throw upErr;

        const { data: { publicUrl } } = sb.storage.from('receipts').getPublicUrl(fileName);

        // 2. تسجيل الطلب
        const { error: dbErr } = await sb.from('deposits').insert({
          user_id: user.id,
          amount: amount,
          method: 'binance',
          receipt_url: publicUrl,
          status: 'pending'
        });

        if (dbErr) throw dbErr;

        status.className = "status-msg ok";
        status.innerText = "تم إرسال الطلب بنجاح! سيتم شحن رصيدك قريباً.";
        btn.innerText = "DONE ✅";
        
      } catch (err) {
        status.className = "status-msg err";
        status.innerText = "حدث خطأ: " + err.message;
        btn.disabled = false;
        btn.innerText = "SEND REQUEST";
      }
    };

    init();
  </script>
</body>
</html>
