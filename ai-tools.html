<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | AI Tools</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; padding: 0; background: var(--bg-dark); color: #fff; 
      font-family: 'Cairo', sans-serif; overflow-x: hidden;
    }
    
    .wrap { width: 100%; max-width: 450px; margin: 0 auto; padding: 0 15px 120px; }

    /* Header */
    .page-header {
      padding: 30px 0; display: flex; align-items: center; gap: 15px;
    }
    .back-btn {
      width: 40px; height: 40px; background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 50%; color: #fff; text-decoration: none;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .title-box h1 { margin: 0; font-family: 'Orbitron'; font-size: 22px; color: var(--neon-cyan); letter-spacing: 1px; }
    .title-box p { margin: 0; font-size: 12px; opacity: 0.6; }

    /* Products List */
    .products-list { display: flex; flex-direction: column; gap: 15px; }
    
    .item-card {
      background: var(--glass); border-radius: 20px; border: 1px solid var(--glass-border);
      padding: 15px; display: flex; align-items: center; gap: 15px;
      transition: 0.3s; text-decoration: none; color: white;
    }
    .item-card:active { transform: scale(0.98); border-color: var(--neon-cyan); }
    
    .item-img { width: 65px; height: 65px; border-radius: 15px; object-fit: cover; background: #111; }
    
    .item-info { flex: 1; }
    .item-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .item-desc { font-size: 11px; opacity: 0.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .item-price { text-align: right; }
    .price-val { display: block; font-family: 'Orbitron'; font-weight: 900; color: var(--neon-cyan); font-size: 14px; }
    .price-unit { font-size: 9px; opacity: 0.6; }

    /* Loading state */
    .loader { text-align: center; padding: 50px; display: none; }
    .empty-state { text-align: center; padding: 50px; opacity: 0.5; display: none; }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="page-header">
      <a href="services.html" class="back-btn">←</a>
      <div class="title-box">
        <h1>AI TOOLS</h1>
        <p>Premium Artificial Intelligence Accounts</p>
      </div>
    </header>

    <div id="loader" class="loader">
        <div style="font-size: 30px; animation: spin 1s linear infinite;">⌛</div>
    </div>

    <div id="emptyState" class="empty-state">
        <p>No AI tools available right now.</p>
    </div>

    <div id="aiProducts" class="products-list">
        </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchAiTools() {
      const loader = document.getElementById('loader');
      const container = document.getElementById('aiProducts');
      const emptyState = document.getElementById('emptyState');

      loader.style.display = 'block';
      
      // سحب المنتجات التي تنتمي لـ Category "ai"
      const { data, error } = await sb
        .from('products') 
        .select('*')
        .eq('category', 'ai') // التصفية حسب الفئة
        .order('created_at', { ascending: false });

      loader.style.display = 'none';

      if (error || !data || data.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      container.innerHTML = data.map(item => `
        <a href="product-details.html?id=${item.id}" class="item-card">
          <img src="${item.image_url || 'https://placehold.co/100x100/020508/00f2ff?text=AI'}" class="item-img" alt="${item.name}">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.description || 'Premium AI Subscription'}</div>
          </div>
          <div class="item-price">
            <span class="price-val">${item.price.toFixed(2)}</span>
            <span class="price-unit">🇱🇧 / mo</span>
          </div>
        </a>
      `).join('');
    }

    fetchAiTools();
  </script>

  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</body>
</html>
