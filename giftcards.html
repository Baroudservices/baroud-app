<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Gift Cards</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-purple: #a855f7;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    /* ===== TOP BAR ===== */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; text-decoration: none;
    }

    /* ===== HERO ===== */
    .hero {
      background: linear-gradient(135deg, rgba(168,85,247,0.15) 0%, rgba(0,0,0,0) 100%);
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 24px; padding: 20px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hero h1 { margin: 0; font-size: 20px; letter-spacing: 1px; color: var(--neon-purple); }
    .hero p { margin: 5px 0 0; font-size: 11px; opacity: 0.6; font-family: 'Cairo'; }

    /* ===== SEARCH ===== */
    .search-container {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 14px 20px; margin-bottom: 20px;
      display: flex; align-items: center;
    }
    .search-container input {
      background: none; border: none; color: #fff; width: 100%;
      font-family: 'Cairo'; font-size: 15px; outline: none;
    }

    /* ===== GRID ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 22px; overflow: hidden; transition: 0.3s; cursor: pointer;
    }
    .card:active { transform: scale(0.96); border-color: var(--neon-purple); }

    .card-img { width: 100%; height: 125px; object-fit: cover; filter: brightness(0.9); }
    
    .card-body { padding: 12px; }
    .card-name { font-weight: 900; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .pill { font-size: 9px; padding: 4px 10px; border-radius: 8px; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.2); color: var(--neon-purple); font-weight: 700; margin-bottom: 10px; display: inline-block; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-price { color: #fff; font-weight: 900; font-size: 16px; }
    
    .open-btn {
      padding: 6px 12px; border-radius: 10px; background: var(--neon-purple);
      color: #fff; font-weight: 900; font-size: 11px; border: none;
    }

    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%; animation: load 1.5s infinite;
    }
    @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top">
      <div class="btn-circle" onclick="history.back()">←</div>
      <div style="font-weight: 900; letter-spacing: 2px;">GIFT CARDS</div>
      <div class="btn-circle" onclick="location.href='services.html'">🏠</div>
    </div>

    <div class="hero">
      <div>
        <h1>Digital Cards</h1>
        <p>iTunes, Razer, Steam & more</p>
      </div>
      <div style="font-size: 24px;">🎁</div>
    </div>

    <div class="search-container">
      <input type="text" id="q" placeholder="Search cards...">
    </div>

    <div class="grid" id="grid">
      <div class="card shimmer" style="height: 210px;"></div>
      <div class="card shimmer" style="height: 210px;"></div>
    </div>
  </div>
  <div id="maintenance-screen" style="
    position: fixed; 
    inset: 0; 
    background: #020508; 
    z-index: 999999; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    padding: 20px;
    font-family: 'Orbitron', 'Cairo', sans-serif;">
    
    <div style="font-size: 60px; margin-bottom: 20px;">🛠️</div>
    
    <h1 style="color: #00f2ff; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">UNDER MAINTENANCE</h1>
    
    <p style="color: #fff; font-family: 'Cairo'; opacity: 0.8; max-width: 300px; line-height: 1.6;">
        نحن نقوم بتحديث الخدمات لنمنحك تجربة أفضل. <br> 
        سنعود خلال وقت قصير جداً!
    </p>

    <div style="margin-top: 30px; font-size: 10px; color: #fff; opacity: 0.3; letter-spacing: 5px;">
        BAROUDAPP.COM
    </div>
</div>

<style>
    /* منع الـ Scroll لما تكون الصيانة شغال */
    body { overflow: hidden !important; }
</style>


<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allGifts = [];

  async function loadData() {
    try {
      // محاولة الجلب حسب الـ View الموحد لضمان أفضل أداء
      const { data, error } = await sb
        .from("products_with_min_price")
        .select("id, title, category, min_price")
        .eq("active", true)
        .ilike("category", "%gift%")
        .order('title', { ascending: true });

      if (error) throw error;
      allGifts = data;
      render(allGifts);
    } catch (e) {
      document.getElementById("grid").innerHTML = `<div style="grid-column: 1/-1; text-align: center; opacity: 0.5;">Error loading cards.</div>`;
    }
  }

  function render(list) {
    const grid = document.getElementById("grid");
    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; opacity: 0.5; padding: 40px;">No cards found.</div>`;
      return;
    }

    grid.innerHTML = list.map(item => `
      <div class="card" onclick="location.href='account.html?id=${item.id}'">
        <img class="card-img" src="assets/products/${item.id}.jpg" onerror="this.src='assets/products/default.png'">
        <div class="card-body">
          <div class="card-name">${item.title}</div>
          <span class="pill">INSTANT</span>
          <div class="card-footer">
            <div class="card-price">$${Number(item.min_price || 0).toFixed(2)}</div>
            <button class="open-btn">OPEN</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById("q").oninput = (e) => {
    const term = e.target.value.toLowerCase().trim();
    render(allGifts.filter(g => g.title.toLowerCase().includes(term)));
  };

  loadData();
</script>
</body>
</html>
