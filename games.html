<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Games</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-blue: #1bc7ff;
      --neon-green: #2ecc71; /* لون الموزع */
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; text-decoration: none;
    }
    .page-title { font-weight: 900; font-size: 18px; letter-spacing: 2px; }

    .search-container {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px 20px; margin-bottom: 25px;
      display: flex; align-items: center;
    }
    .search-container input {
      background: none; border: none; color: #fff; width: 100%;
      font-family: 'Cairo'; font-size: 15px; outline: none;
    }

    .products-list { display: flex; flex-direction: column; gap: 15px; }

    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px;
      display: flex; align-items: center; gap: 15px;
      transition: 0.3s; cursor: pointer;
    }
    .card:active { transform: scale(0.98); }
    .user-card:active { border-color: var(--neon-blue); }
    .reseller-card:active { border-color: var(--neon-green); }

    .card-img { width: 65px; height: 65px; border-radius: 15px; object-fit: cover; background: #000; }
    
    .card-body { flex: 1; }
    .card-name { font-weight: 900; font-size: 15px; margin-bottom: 4px; text-transform: uppercase; }
    
    .badge-row { display: flex; gap: 5px; }
    .pill { font-size: 8px; padding: 2px 8px; border-radius: 5px; font-weight: 700; }
    .user-pill { background: rgba(27, 199, 255, 0.05); border: 1px solid rgba(27, 199, 255, 0.1); color: var(--neon-blue); }
    .reseller-pill { background: rgba(46, 204, 113, 0.05); border: 1px solid rgba(46, 204, 113, 0.1); color: var(--neon-green); }

    .card-footer { text-align: right; }
    .card-price { font-weight: 900; font-size: 16px; display: block; margin-bottom: 4px; color: #fff; }
    .reseller-price { color: var(--neon-green) !important; }
    .card-price span { font-size: 10px; opacity: 0.5; margin-right: 2px; }
    
    .open-btn {
      padding: 5px 12px; border-radius: 8px; font-weight: 900; font-size: 10px; border: none; color: #fff;
    }
    .user-btn { background: linear-gradient(90deg, #0aa0ff, #2a74ff); }
    .reseller-btn { background: var(--neon-green); color: #000; }

    .shimmer-card {
      height: 90px; width: 100%; border-radius: 20px;
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%; animation: loading 1.5s infinite;
      margin-bottom: 15px;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top">
      <div class="btn-circle" onclick="history.back()">←</div>
      <div class="page-title">GAMES</div>
      <div class="btn-circle" onclick="location.href='services.html'">🏠</div>
    </div>

    <div class="search-container">
      <input type="text" id="q" placeholder="Search (PUBG, Free Fire, Jawaker...)">
    </div>

    <div class="products-list" id="grid"></div>
  </div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  let allGames = [];
  let userRole = 'user';

  async function getUserRole() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: profile } = await sb.from("profiles").select("role").eq("id", session.user.id).single();
      if (profile) userRole = profile.role;
    }
  }

  async function loadGames() {
    grid.innerHTML = Array(3).fill('<div class="shimmer-card"></div>').join('');
    try {
      await getUserRole();
      const { data, error } = await sb
        .from("products_with_min_price")
        .select("id, title, category, min_price, reseller_min_price")
        .eq("active", true)
        .eq("category", "Games")
        .order('title', { ascending: true });

      if (error) throw error;
      allGames = data;
      render(allGames);
    } catch (e) {
      grid.innerHTML = `<div style="text-align: center; opacity: 0.5;">Failed to load games.</div>`;
    }
  }

  function render(list) {
    if (list.length === 0) {
      grid.innerHTML = `<div style="text-align: center; opacity: 0.5; padding: 40px;">No games found.</div>`;
      return;
    }

    const isReseller = (userRole === 'reseller');

    grid.innerHTML = list.map(item => {
      const displayPrice = isReseller ? (item.reseller_min_price || item.min_price) : item.min_price;
      
      return `
        <div class="card ${isReseller ? 'reseller-card' : 'user-card'}" onclick="location.href='account.html?id=${item.id}'">
          <img class="card-img" src="assets/products/${item.id}.jpg" onerror="this.src='https://placehold.co/100x100/020508/1bc7ff?text=GAME'">
          <div class="card-body">
            <div class="card-name">${item.title}</div>
            <div class="badge-row">
              <span class="pill ${isReseller ? 'reseller-pill' : 'user-pill'}">${isReseller ? 'VIP PRICE' : 'TOP UP'}</span>
              <span class="pill" style="color:#00ff88; background:rgba(0,255,136,0.05); border-color:rgba(0,255,136,0.1)">FAST</span>
            </div>
          </div>
          <div class="card-footer">
            <div class="card-price ${isReseller ? 'reseller-price' : ''}"><span>$</span>${Number(displayPrice || 0).toFixed(2)}</div>
            <button class="open-btn ${isReseller ? 'reseller-btn' : 'user-btn'}">OPEN</button>
          </div>
        </div>
      `;
    }).join('');
  }

  q.oninput = (e) => {
    const v = e.target.value.toLowerCase().trim();
    render(allGames.filter(g => g.title.toLowerCase().includes(v)));
  };

  loadGames();
</script>
</body>
</html>
