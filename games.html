<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Games</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-blue: #1bc7ff;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    /* ===== HEADER ===== */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; text-decoration: none;
    }

    /* ===== SEARCH BOX ===== */
    .search-box {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 14px 20px; margin-bottom: 20px;
      display: flex; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .search-box input {
      background: none; border: none; color: #fff; width: 100%;
      font-family: 'Cairo'; font-size: 15px; outline: none;
    }

    /* ===== GAMES GRID ===== */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 22px; overflow: hidden; position: relative;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;
    }
    .card:active { transform: scale(0.96); border-color: var(--neon-blue); }

    .card-img { width: 100%; height: 130px; object-fit: cover; filter: brightness(0.85); transition: 0.3s; }
    .card:hover .card-img { filter: brightness(1); }
    
    .card-body { padding: 12px; }
    .card-name { font-weight: 900; font-size: 14px; margin-bottom: 6px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px; }
    
    .meta-pills { display: flex; gap: 5px; margin-bottom: 10px; }
    .pill { font-size: 9px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--neon-blue); font-weight: 700; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    .card-price { color: #fff; font-weight: 900; font-size: 15px; }
    .card-price span { font-size: 10px; opacity: 0.5; margin-right: 2px; }
    
    .open-btn {
      padding: 7px 14px; border-radius: 10px; background: linear-gradient(90deg, #0aa0ff, #2a74ff);
      color: #fff; font-weight: 900; font-size: 11px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Loading Shimmer */
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%; animation: loading 1.5s infinite;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top">
      <div class="btn-circle" onclick="history.back()">←</div>
      <div style="font-weight: 900; letter-spacing: 2px; font-size: 18px;">GAMES</div>
      <div class="btn-circle" onclick="location.href='services.html'">🏠</div>
    </div>

    <div class="search-box">
      <input type="text" id="q" placeholder="Search (PUBG, Free Fire, Jawaker...)">
    </div>

    <div class="grid" id="grid">
      <div class="card shimmer" style="height: 220px;"></div>
      <div class="card shimmer" style="height: 220px;"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  let allGames = [];

  async function loadGames() {
    try {
      // جلب الألعاب النشطة مع أقل سعر متوفر
      const { data, error } = await sb
        .from("products_with_min_price")
        .select("id, title, category, min_price")
        .eq("active", true)
        .eq("category", "Games")
        .order('title', { ascending: true });

      if (error) throw error;
      allGames = data;
      render(allGames);
    } catch (e) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; opacity: 0.5;">Failed to load games.</div>`;
    }
  }

  function render(list) {
    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; opacity: 0.5; padding: 40px;">No games found.</div>`;
      return;
    }

    grid.innerHTML = list.map(item => `
      <div class="card" onclick="location.href='account.html?id=${item.id}'">
        <img class="card-img" src="assets/products/${item.id}.jpg" onerror="this.src='assets/products/default.png'">
        <div class="card-body">
          <div class="card-name">${item.title}</div>
          <div class="meta-pills">
            <span class="pill">${item.category}</span>
            <span class="pill" style="color:#00ff88">Active</span>
          </div>
          <div class="card-footer">
            <div class="card-price"><span>$</span>${Number(item.min_price || 0).toFixed(2)}</div>
            <button class="open-btn">OPEN</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Real-time Search
  q.oninput = (e) => {
    const v = e.target.value.toLowerCase().trim();
    const filtered = allGames.filter(g => 
      g.title.toLowerCase().includes(v) || 
      g.category.toLowerCase().includes(v)
    );
    render(filtered);
  };

  loadGames();
</script>
</body>
</html>
