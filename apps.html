<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Baroud | Apps</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Orbitron', 'Cairo', sans-serif;
      background: var(--bg-dark); color: #fff;
      min-height: 100vh;
    }

    .wrap { max-width: 450px; margin: 0 auto; padding: 20px 15px 100px; }

    /* ===== HEADER ===== */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-circle {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; text-decoration: none;
    }

    /* ===== SEARCH ===== */
    .search-container {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px 20px; margin-bottom: 20px;
      display: flex; align-items: center;
    }
    .search-container input {
      background: none; border: none; color: #fff; width: 100%;
      font-family: 'Cairo'; font-size: 15px; outline: none;
    }

    /* ===== LIST VIEW (MODIFIED) ===== */
    .products-list { display: flex; flex-direction: column; gap: 15px; }

    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px;
      display: flex; align-items: center; gap: 15px;
      transition: 0.3s; cursor: pointer;
    }
    .card:active { transform: scale(0.98); border-color: var(--neon-cyan); }

    .card-img { width: 60px; height: 60px; border-radius: 15px; object-fit: cover; background: #000; }
    
    .card-body { flex: 1; }
    .card-name { font-weight: 900; font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
    .card-sub { font-size: 10px; opacity: 0.5; font-family: 'Cairo'; }
    
    .card-footer { text-align: right; }
    .card-price { color: var(--neon-cyan); font-weight: 900; font-size: 15px; display: block; }
    
    .open-btn {
      margin-top: 4px; padding: 4px 10px; border-radius: 8px; background: var(--neon-cyan);
      color: #000; font-weight: 900; font-size: 9px; border: none; cursor: pointer;
    }

    /* ===== LOADING SHIMMER ===== */
    .shimmer {
      height: 85px; width: 100%; border-radius: 20px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%; animation: loading 1.5s infinite;
      margin-bottom: 15px;
    }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top">
      <div class="btn-circle" onclick="history.back()">←</div>
      <div style="font-weight: 900; letter-spacing: 2px;">APPS</div>
      <div class="btn-circle" onclick="location.href='services.html'">🏠</div>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search Apps...">
    </div>

    <div class="products-list" id="productGrid">
      <div class="shimmer"></div>
      <div class="shimmer"></div>
      <div class="shimmer"></div>
    </div>
  </div>

<div id="maintenance-screen" style="display: none; position: fixed; inset: 0; background: #020508; z-index: 999999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; font-family: 'Orbitron', 'Cairo', sans-serif;">
    <div style="font-size: 60px; margin-bottom: 20px;">🛠️</div>
    <h1 style="color: #00f2ff; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">UNDER MAINTENANCE</h1>
    <p style="color: #fff; font-family: 'Cairo'; opacity: 0.8; max-width: 300px; line-height: 1.6;">
        نحن نقوم بتحديث الخدمات لنمنحك تجربة أفضل. <br> 
        سنعود خلال وقت قصير جداً!
    </p>
    <div style="margin-top: 30px; font-size: 10px; color: #fff; opacity: 0.3; letter-spacing: 5px;">BAROUDAPP.COM</div>
</div>

<script>
    const maintenanceMode = false; 
    if (maintenanceMode) {
        document.getElementById('maintenance-screen').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    async function loadProducts() {
      try {
        const { data, error } = await sb
          .from("products_with_min_price")
          .select("id, title, category, min_price")
          .eq("active", true)
          .eq("category", "Apps")
          .order('title', { ascending: true });

        if (error) throw error;
        allProducts = data;
        render(allProducts);
      } catch (e) {
        document.getElementById("productGrid").innerHTML = `<div style="text-align: center; opacity: 0.5;">Error loading apps.</div>`;
      }
    }

    function render(list) {
      const grid = document.getElementById("productGrid");
      if (list.length === 0) {
        grid.innerHTML = `<div style="text-align: center; opacity: 0.5; padding: 40px;">No matches found.</div>`;
        return;
      }

      grid.innerHTML = list.map(item => `
        <div class="card" onclick="location.href='account.html?id=${item.id}'">
          <img class="card-img" src="assets/products/${item.id}.jpg" onerror="this.src='assets/products/default.png'">
          <div class="card-body">
            <div class="card-name">${item.title}</div>
            <div class="card-sub">Premium Subscription</div>
          </div>
          <div class="card-footer">
            <div class="card-price">$${Number(item.min_price || 0).toFixed(2)}</div>
            <button class="open-btn">OPEN</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById("searchInput").oninput = (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => p.title.toLowerCase().includes(term));
      render(filtered);
    };

    loadProducts();
</script>
</body>
</html>
