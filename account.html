<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baroud | Account Details</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --neon-green: #2ecc71; /* لون الموزع */
      --bg-dark: #020508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; padding: 0; background: var(--bg-dark); color: #fff; 
      font-family: 'Orbitron', 'Cairo', sans-serif; 
    }
    
    .wrap { width: 100%; max-width: 450px; margin: 0 auto; padding: 20px 15px 120px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back-circle { 
      width: 40px; height: 40px; background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; text-decoration: none; font-size: 20px;
    }

    .hero-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 30px; overflow: hidden; margin-bottom: 20px;
    }
    .hero-img { width: 100%; height: 200px; object-fit: cover; background: #000; }
    .hero-info { padding: 15px 20px; }
    .product-title { font-weight: 900; font-size: 20px; text-transform: uppercase; }
    .price-tag { color: var(--neon-cyan); font-weight: 900; font-size: 18px; }
    .reseller-color { color: var(--neon-green) !important; }

    .section-box {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 20px; margin-bottom: 15px;
    }
    .section-box h3 { margin: 0 0 15px; font-size: 12px; letter-spacing: 2px; opacity: 0.5; }

    .input-group { margin-bottom: 15px; }
    label { display: block; font-family: 'Cairo'; font-size: 11px; margin-bottom: 6px; opacity: 0.7; font-weight: 700; }
    input, textarea {
      width: 100%; padding: 14px; border-radius: 12px;
      background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
      color: #fff; font-family: 'Cairo'; font-size: 14px;
    }

    .plan-selector {
      width: 100%; padding: 15px; border-radius: 12px;
      background: var(--neon-cyan); color: #000; border: none;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; font-weight: 900; font-size: 14px;
    }
    .reseller-bg { background: var(--neon-green) !important; }

    .buy-btn {
      width: 100%; padding: 18px; border-radius: 18px; border: none;
      background: linear-gradient(90deg, #00f2ff, #0072ff);
      color: #fff; font-weight: 900; font-size: 16px; cursor: pointer;
    }
    .buy-btn.reseller-btn { background: linear-gradient(90deg, #2ecc71, #27ae60); }
    .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2000; backdrop-filter: blur(4px); }
    .bottom-sheet {
      position: fixed; bottom: -100%; left: 0; width: 100%;
      background: #060a0f; border-radius: 25px 25px 0 0;
      z-index: 2100; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 25px 20px; border-top: 1px solid var(--glass-border);
    }
    .bottom-sheet.active { bottom: 0; }
    
    #plansContainer { max-height: 380px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
    .plan-option {
      padding: 12px 15px; border-radius: 10px; background: rgba(255,255,255,0.02);
      border: 1px solid var(--glass-border); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .plan-option.selected { border-color: var(--neon-cyan); background: rgba(0, 242, 255, 0.05); }
    .plan-option.selected.reseller-border { border-color: var(--neon-green); background: rgba(46, 204, 113, 0.05); }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px;
    }
    .modal-content { background: #0a0f14; border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; text-align: center; width: 100%; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <a href="javascript:history.back()" class="back-circle">←</a>
      <div id="badgeLabel" style="font-weight: 900; opacity: 0.5; font-size: 11px;">BAROUD ELITE</div>
      <div onclick="location.href='my-orders.html'" style="font-size: 20px;">📦</div>
    </div>

    <div class="hero-card">
      <img id="heroImg" class="hero-img" src="assets/products/default.png">
      <div class="hero-info">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div id="pTitle" class="product-title">...</div>
            <div id="pCat" style="font-size: 10px; opacity: 0.4; margin-top: 2px;">Category: -</div>
          </div>
          <div id="pPrice" class="price-tag">$0.00</div>
        </div>
      </div>
    </div>

    <div class="section-box">
      <h3 id="configTitle">CONFIGURATION</h3>
      <label>SELECT PACKAGE</label>
      <button class="plan-selector" id="planBtn">
        <span id="planLabel">Pick a plan</span>
        <span>▼</span>
      </button>

      <div id="dynamicFields" style="display:none; margin-top: 15px;"></div>

      <div class="input-group" style="margin-top: 15px;">
        <label>NOTE (OPTIONAL)</label>
        <textarea id="customerNote" rows="2" placeholder="Ex: Specific instructions..."></textarea>
      </div>

      <button id="buyBtn" class="buy-btn">PURCHASE NOW</button>
    </div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="planSheet">
    <h2 id="sheetTitle" style="margin: 0 0 15px; font-size: 16px;">AVAILABLE PLANS</h2>
    <div id="plansContainer"></div>
    <button id="confirmBtn" class="buy-btn" onclick="confirmPlanSelection()">CONFIRM</button>
  </div>

  <div class="modal" id="globalModal">
    <div class="modal-content">
      <h3 id="modalTitle">Notice</h3>
      <p id="modalText" style="font-family:'Cairo'; font-size: 14px; opacity:0.8;"></p>
      <button id="modalOkBtn" class="buy-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://pqrwitolonhfbfwtsnde.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l5PtPu6xVyWq2pD6jzEYRw_CYEQ9-f_";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const productId = new URLSearchParams(window.location.search).get("id");
  let currentProduct = null, allPlans = [], selectedPlan = null, tempSelectedPlanId = null;
  let userRole = 'user'; 

  async function init() {
    if(!productId) return;
    
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: profile } = await sb.from("profiles").select("role").eq("id", session.user.id).single();
      if (profile) userRole = profile.role;
    }

    if (userRole === 'reseller') {
      document.getElementById("badgeLabel").textContent = "RESELLER PANEL";
      document.getElementById("badgeLabel").style.color = "var(--neon-green)";
      document.getElementById("pPrice").classList.add("reseller-color");
      document.getElementById("planBtn").classList.add("reseller-bg");
      document.getElementById("buyBtn").classList.add("reseller-btn");
      document.getElementById("confirmBtn").classList.add("reseller-btn");
      document.getElementById("modalOkBtn").classList.add("reseller-btn");
    }

    const { data: product } = await sb.from("products").select("*").eq("id", productId).single();
    if(!product) return;
    currentProduct = product;
    
    document.getElementById("pTitle").textContent = product.title;
    document.getElementById("pCat").textContent = "Category: " + (product.category || "General");
    document.getElementById("heroImg").src = `assets/products/${product.id}.jpg`;

    const { data: plans } = await sb.from("product_plan_prices")
                                .select("*").eq("product_id", productId)
                                .eq("active", true).order('price', {ascending: true});
    allPlans = plans || [];
    renderPlans();
    if(allPlans.length > 0) setPlan(allPlans[0]);
  }

  function renderPlans() {
    const container = document.getElementById("plansContainer");
    container.innerHTML = allPlans.map(p => {
      const priceToShow = (userRole === 'reseller') ? (p.reseller_price || p.price) : p.price;
      const isSelected = String(tempSelectedPlanId) === String(p.id);
      const selectedClass = isSelected ? (userRole === 'reseller' ? 'selected reseller-border' : 'selected') : '';
      
      return `
        <div class="plan-option ${selectedClass}" onclick="tempSelectPlan('${p.id}')">
          <div class="p-name">${p.plan_label}</div>
          <div class="p-price" style="${userRole === 'reseller' ? 'color:var(--neon-green)' : ''}">$${Number(priceToShow).toFixed(2)}</div>
        </div>
      `;
    }).join('');
  }

  function tempSelectPlan(id) { tempSelectedPlanId = id; renderPlans(); }

  function confirmPlanSelection() {
    const plan = allPlans.find(p => String(p.id) === String(tempSelectedPlanId));
    if(plan) setPlan(plan);
    closeSheet();
  }

  function setPlan(plan) {
    selectedPlan = plan;
    tempSelectedPlanId = plan.id;
    const finalPrice = (userRole === 'reseller') ? (plan.reseller_price || plan.price) : plan.price;
    
    document.getElementById("planLabel").textContent = plan.plan_label;
    document.getElementById("pPrice").textContent = `$${Number(finalPrice).toFixed(2)}`;
    updateFields();
  }

  function updateFields() {
    const container = document.getElementById("dynamicFields");
    container.innerHTML = "";
    let fields = [];

    const planL = selectedPlan && selectedPlan.plan_label ? selectedPlan.plan_label.toLowerCase() : "";
    const isDirectPlan = planL.includes("direct");

    if (isDirectPlan || currentProduct.require_email || currentProduct.require_account_details) {
      fields.push({ id: "acc_email", label: currentProduct.email_label || "EMAIL / USERNAME" });
      fields.push({ id: "acc_pass", label: currentProduct.password_label || "PASSWORD" });
    }
    if (currentProduct.require_backup_codes) {
      fields.push({ id: "backup_codes", label: "BACKUP CODES (2FA)" });
    }
    if (currentProduct.require_player_id || currentProduct.requires_player_id) {
      fields.push({ id: "player_id", label: currentProduct.player_id_label || "PLAYER ID" });
    }

    if (fields.length > 0) {
      container.style.display = "block";
      container.innerHTML = fields.map(f => `
        <div class="input-group">
          <label>${f.label}</label>
          <input type="${f.id==='acc_pass'?'password':'text'}" id="${f.id}" placeholder="Required">
        </div>
      `).join('');
    } else {
      container.style.display = "none";
    }
  }

  document.getElementById("planBtn").onclick = () => {
    document.getElementById("sheetOverlay").style.display = "block";
    setTimeout(() => document.getElementById("planSheet").classList.add("active"), 10);
  };

  function closeSheet() {
    document.getElementById("planSheet").classList.remove("active");
    setTimeout(() => document.getElementById("sheetOverlay").style.display = "none", 300);
  }

  document.getElementById("buyBtn").onclick = async () => {
    const btn = document.getElementById("buyBtn");
    
    // التأكد من تعبئة جميع الحقول المطلوبة قبل الإرسال للواتساب
    const inputs = document.querySelectorAll("#dynamicFields input");
    for(let i of inputs) {
      if(!i.value.trim()) { 
        showModal("Error", "Please fill all required fields"); 
        return; 
      }
    }

    const finalPrice = (userRole === 'reseller') ? (selectedPlan.reseller_price || selectedPlan.price) : selectedPlan.price;
    
    // تجميع البيانات المدخلة لتوليد رسالة الواتساب المنسقة
    const accEmail = document.getElementById("acc_email")?.value || "";
    const accPass = document.getElementById("acc_pass")?.value || "";
    const backupCodes = document.getElementById("backup_codes")?.value || "";
    const playerId = document.getElementById("player_id")?.value || "";
    const customerNote = document.getElementById("customerNote").value.trim();

    // بناء نص الرسالة بأسلوب منظم جداً يصل إلى هاتفك
    let wpMessage = `🔥 *NEW ORDER - BAROUD APP* 🔥\n\n` +
                    `📦 *Product:* ${currentProduct.title}\n` +
                    `⏱️ *Plan:* ${selectedPlan.plan_label}\n` +
                    `💰 *Price:* $${Number(finalPrice).toFixed(2)}\n` +
                    `👤 *Role:* ${userRole.toUpperCase()}\n\n` +
                    `🚨 *Order Details:* \n`;

    if (playerId) wpMessage += `🔹 *Player ID:* ${playerId}\n`;
    if (accEmail) wpMessage += `🔹 *Email/User:* ${accEmail}\n`;
    if (accPass)  wpMessage += `🔹 *Password:* ${accPass}\n`;
    if (backupCodes) wpMessage += `🔹 *Backup Codes:* ${backupCodes}\n`;
    if (customerNote) wpMessage += `📝 *Notes:* ${customerNote}\n`;

    wpMessage += `\nيرجى تأكيد واستلام الطلب عبر الواتساب لتجهيز الدفع 🟢`;

    const adminWhatsAppNumber = "70385398"; // رقم الواتساب الخاص بك للعمل الفوري
    const whatsappUrl = `https://wa.me/${adminWhatsAppNumber}?text=${encodeURIComponent(wpMessage)}`;

    // فتح الرابط وتوجيه العميل مباشرة
    window.open(whatsappUrl, '_blank');

    // إعادة تفعيل الزر ليعمل مرة أخرى دون تعليق
    btn.textContent = "PURCHASE NOW";
  };

  function showModal(t, txt) { 
    document.getElementById("modalTitle").textContent = t;
    document.getElementById("modalText").textContent = txt;
    document.getElementById("globalModal").style.display = "flex";
  }
  function closeModal() { document.getElementById("globalModal").style.display = "none"; }

  init();
</script>
</body>
</html>
